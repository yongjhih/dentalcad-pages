  // Main Render Routine
  function render() {
    if (!data) {
      container.innerHTML = renderEmptyState();
      bindEmptyEvents();
      return;
    }

    activeView = getActiveViewData();

    let mainContent = '';

    if (state.activeTab === 'files') {
      let mainPane = '';
      if (state.selectedFile) {
        mainPane = renderFileViewer();
      } else {
        const vFolders = activeView?.folders || data.folders || {};
        const vSummary = activeView?.summary || data.summary;
        const currentFolderCov = vFolders[state.currentFolder] || vSummary;
        const trendPoints = state.currentFolder 
          ? data.trends?.folders?.[state.currentFolder] 
          : data.trends?.overall;

        mainPane = `
          ${renderCommitBanner()}
          ${renderMetrics(currentFolderCov, activeView?.delta ?? data.delta)}
          ${trendPoints && trendPoints.length > 1 ? renderTrendChart(state.currentFolder ? `Folder Trend: ${state.currentFolder}` : 'Overall Coverage Trend', trendPoints, state.trendMetric) : ''}
          ${renderTable()}
        `;
      }

      mainContent = `
        <div class="files-layout ${state.sidebarVisible ? '' : 'sidebar-collapsed'}">
          <aside class="files-sidebar" aria-label="Files tree">
            ${renderSidebar()}
          </aside>
          <div class="files-main">
            ${mainPane}
          </div>
        </div>
      `;
    } else if (state.activeTab === 'trends') {
      mainContent = renderTrendsTab();
    } else if (state.activeTab === 'commits') {
      mainContent = renderCommitsTab();
    }

    container.innerHTML = `
      ${renderHeader()}
      <main class="gh-container">
        ${mainContent}
      </main>
      <footer class="gh-footer">
        Generated by <a href="https://github.com/yongjhih/covpages" target="_blank" rel="noopener">covpages</a> • 
        ${escapeHtml(data.generatedAt ? formatDate(data.generatedAt) : new Date().toISOString())}
      </footer>
    `;

    bindEvents();
  }

  function bindEmptyEvents() {
    const askAiBtn = document.getElementById('ask-ai-trigger');
    if (askAiBtn) {
      askAiBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (typeof window.toggleAskAiDrawer === 'function') {
          window.toggleAskAiDrawer();
        }
      });
    }

    const themeBtn = document.getElementById('theme-toggle-btn');
    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const nextTheme = state.theme === 'dark' ? 'light' : 'dark';
        applyTheme(nextTheme);
        render();
      });
    }

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('lcov-file-input');
    const selectBtn = document.getElementById('select-file-btn');

    if (selectBtn && fileInput) {
      selectBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        fileInput.click();
      });
    }

    if (dropZone && fileInput) {
      dropZone.addEventListener('click', () => fileInput.click());

      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = 'var(--color-accent-fg)';
      });

      dropZone.addEventListener('dragleave', () => {
        dropZone.style.borderColor = 'var(--color-border-default)';
      });

      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = 'var(--color-border-default)';
        if (e.dataTransfer?.files?.length) {
          handleFile(e.dataTransfer.files[0]);
        }
      });

      fileInput.addEventListener('change', (e) => {
        if (e.target.files?.length) {
          handleFile(e.target.files[0]);
        }
      });
    }

    function handleFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const text = e.target?.result;
        if (typeof text === 'string') {
          data = parseClientCoverage(text);
          initState();
          render();
        }
      };
      reader.readAsText(file);
    }
  }

  // Event handlers
  function bindEvents() {
    const askAiBtn = document.getElementById('ask-ai-trigger');
    if (askAiBtn) {
      askAiBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (typeof window.toggleAskAiDrawer === 'function') {
          window.toggleAskAiDrawer();
        }
      });
    }

    const themeBtn = document.getElementById('theme-toggle-btn');
    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const nextTheme = state.theme === 'dark' ? 'light' : 'dark';
        applyTheme(nextTheme);
        render();
      });
    }

    // Ref selector dropdown
    const refBtn = document.getElementById('ref-selector-btn');
    if (refBtn) {
      refBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        state.refPopoverOpen = !state.refPopoverOpen;
        state.refSearchText = '';
        render();
        if (state.refPopoverOpen) {
          const input = document.getElementById('ref-search-input');
          if (input) input.focus();
        }
      });
    }

    const refCloseBtn = document.getElementById('ref-popover-close');
    if (refCloseBtn) {
      refCloseBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        state.refPopoverOpen = false;
        render();
      });
    }

    document.querySelectorAll('.ref-tab').forEach(tab => {
      tab.addEventListener('click', (e) => {
        e.stopPropagation();
        state.refActiveTab = tab.getAttribute('data-ref-tab');
        render();
        const input = document.getElementById('ref-search-input');
        if (input) input.focus();
      });
    });

    const refSearchInput = document.getElementById('ref-search-input');
    if (refSearchInput) {
      refSearchInput.addEventListener('click', (e) => e.stopPropagation());
      refSearchInput.addEventListener('input', (e) => {
        state.refSearchText = e.target.value;
        const popoverEl = document.getElementById('ref-popover');
        if (popoverEl) {
          popoverEl.outerHTML = renderRefPopover();
          bindEvents();
          const inp = document.getElementById('ref-search-input');
          if (inp) {
            inp.focus();
            inp.selectionStart = inp.selectionEnd = inp.value.length;
          }
        }
      });
    }

    document.querySelectorAll('.ref-item').forEach(item => {
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        const refType = item.getAttribute('data-ref-type');
        const refName = item.getAttribute('data-ref-name');
        const refSha = item.getAttribute('data-ref-sha');
        selectRef(refType, refName, refSha);
      });
    });

    if (state.refPopoverOpen) {
      const handleOutsideClick = (e) => {
        if (!e.target.closest('.ref-selector-wrap')) {
          state.refPopoverOpen = false;
          document.removeEventListener('click', handleOutsideClick);
          render();
        }
      };
      setTimeout(() => {
        document.addEventListener('click', handleOutsideClick);
      }, 0);
    }

    // Commits tab click to view commit coverage snapshot
    document.querySelectorAll('[data-commit-sha]').forEach(row => {
      row.addEventListener('click', () => {
        const sha = row.getAttribute('data-commit-sha');
        let targetFile = null;
        let targetFolder = '';
        if (state.activeTab === 'trends') {
          if (state.trendScope === 'file' && state.trendTarget) {
            targetFile = state.trendTarget;
          } else if (state.trendScope === 'folder' && state.trendTarget) {
            targetFolder = state.trendTarget;
          }
        }
        openCommitSnapshot(sha, targetFile, targetFolder);
      });
    });

    // Badge copy buttons (header, folder, file, commit)
    document.querySelectorAll('[data-badge-copy]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const scope = btn.getAttribute('data-badge-copy');
        let label = 'coverage';
        let pct = activeView?.summary?.lines?.pct || 100;
        let filename = 'badge.svg';

        const defaultBranch = data?.defaultBranch || data?.currentCommit?.branch || 'main';

        if (scope === 'folder') {
          const folder = btn.getAttribute('data-badge-folder') || state.currentFolder || '';
          label = 'coverage&' + (folder || data?.repoName || 'coverage');
          const fCov = activeView?.folders?.[folder] || activeView?.summary;
          pct = fCov?.lines?.pct || 100;
          filename = folder ? 'folder-' + sanitizeBadgeName(folder) + '.svg' : 'badge.svg';
        } else if (scope === 'file') {
          const file = btn.getAttribute('data-badge-file') || state.selectedFile || '';
          label = 'coverage&' + file;
          const fCov = activeView?.files?.[file];
          pct = fCov?.lines?.pct || 100;
          filename = 'file-' + sanitizeBadgeName(file) + '.svg';
        } else if (scope === 'commit') {
          const sha = btn.getAttribute('data-badge-commit') || (activeView?.commit || data?.currentCommit)?.shortSha || '';
          label = 'coverage@' + sha;
          const attrPct = btn.getAttribute('data-badge-pct');
          pct = attrPct ? parseFloat(attrPct) : (activeView?.summary?.lines?.pct || 100);
          filename = 'commit-' + sanitizeBadgeName(sha) + '.svg';
        } else if (scope === 'ref') {
          const refName = state.activeRefName || defaultBranch;
          if (state.activeRefType === 'tag') {
            label = 'coverage@' + refName;
            filename = 'tag-' + sanitizeBadgeName(refName) + '.svg';
          } else if (refName === defaultBranch) {
            label = 'coverage';
            filename = 'badge.svg';
          } else {
            label = 'coverage@' + refName;
            filename = 'branch-' + sanitizeBadgeName(refName) + '.svg';
          }
          pct = activeView?.summary?.lines?.pct || 100;
        }

        copyBadgeMarkdown(label, pct, filename);
      });
    });

    // Sidebar toggle and collapse
    const collapseBtn = document.getElementById('sidebar-collapse-btn');
    if (collapseBtn) {
      collapseBtn.addEventListener('click', () => {
        state.sidebarVisible = false;
        localStorage.setItem('covpages-sidebar', 'false');
        render();
      });
    }

    const expandBtn = document.getElementById('sidebar-expand-btn');
    if (expandBtn) {
      expandBtn.addEventListener('click', () => {
        state.sidebarVisible = true;
        localStorage.setItem('covpages-sidebar', 'true');
        render();
      });
    }

    // Go to file search
    const gotoInput = document.getElementById('goto-input');
    if (gotoInput) {
      gotoInput.addEventListener('input', (e) => {
        state.gotoFilterText = e.target.value;
        state.gotoActiveIndex = 0;
        const sidebar = document.querySelector('.files-sidebar');
        if (sidebar) {
          sidebar.innerHTML = renderSidebar();
          bindEvents();
          const gi = document.getElementById('goto-input');
          if (gi) {
            gi.focus();
            gi.selectionStart = gi.selectionEnd = gi.value.length;
          }
        }
      });

      gotoInput.addEventListener('keydown', (e) => {
        const query = state.gotoFilterText.trim().toLowerCase();
        const allFiles = Object.keys(data.files || {}).filter(f => f.toLowerCase().includes(query));
        allFiles.sort((a, b) => {
          const aBase = a.split('/').pop()?.toLowerCase() || '';
          const bBase = b.split('/').pop()?.toLowerCase() || '';
          const aStarts = aBase.startsWith(query);
          const bStarts = bBase.startsWith(query);
          if (aStarts && !bStarts) return -1;
          if (!aStarts && bStarts) return 1;
          return a.localeCompare(b);
        });

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (allFiles.length > 0) {
            state.gotoActiveIndex = Math.min(state.gotoActiveIndex + 1, Math.min(allFiles.length, 50) - 1);
            updateGotoActive();
          }
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (allFiles.length > 0) {
            state.gotoActiveIndex = Math.max(state.gotoActiveIndex - 1, 0);
            updateGotoActive();
          }
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (allFiles.length > 0 && allFiles[state.gotoActiveIndex]) {
            const target = allFiles[state.gotoActiveIndex];
            state.selectedFile = target;
            state.gotoFilterText = '';
            ensureExpanded(target);
            updateRoute();
            render();
          }
        } else if (e.key === 'Escape') {
          e.preventDefault();
          state.gotoFilterText = '';
          render();
        }
      });
    }

    function updateGotoActive() {
      const items = document.querySelectorAll('.goto-item');
      items.forEach((item, idx) => {
        if (idx === state.gotoActiveIndex) {
          item.classList.add('active');
          item.scrollIntoView({ block: 'nearest' });
        } else {
          item.classList.remove('active');
        }
      });
    }

    const gotoClear = document.getElementById('goto-clear');
    if (gotoClear) {
      gotoClear.addEventListener('click', () => {
        state.gotoFilterText = '';
        render();
        const gi = document.getElementById('goto-input');
        if (gi) gi.focus();
      });
    }

    // Go to file item click
    document.querySelectorAll('[data-goto-file]').forEach(el => {
      el.addEventListener('click', () => {
        const file = el.getAttribute('data-goto-file');
        state.selectedFile = file;
        state.gotoFilterText = '';
        ensureExpanded(file);
        updateRoute();
        render();
      });
    });

    // File tree folder toggle (chevron)
    document.querySelectorAll('[data-tree-toggle]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const folder = btn.getAttribute('data-tree-toggle');
        const start = btn.getAttribute('data-tree-start') || folder;
        if (state.expandedFolders.has(folder) || state.expandedFolders.has(start)) {
          state.expandedFolders.delete(folder);
          state.expandedFolders.delete(start);
        } else {
          state.expandedFolders.add(folder);
        }
        render();
      });
    });

    // File tree folder row click
    document.querySelectorAll('[data-tree-folder]').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.closest('[data-tree-toggle]')) return;
        const folder = el.getAttribute('data-tree-folder');
        state.currentFolder = folder;
        state.selectedFile = null;
        state.expandedFolders.add(folder);
        updateRoute();
        render();
      });
    });

    // File tree file click
    document.querySelectorAll('[data-tree-file]').forEach(el => {
      el.addEventListener('click', () => {
        const file = el.getAttribute('data-tree-file');
        state.selectedFile = file;
        ensureExpanded(file);
        updateRoute();
        render();
      });
    });

    const brandLink = document.getElementById('brand-link');
    if (brandLink) {
      brandLink.addEventListener('click', (e) => {
        e.preventDefault();
        state.activeTab = 'files';
        state.currentFolder = '';
        state.selectedFile = null;
        state.activeRefType = 'branch';
        state.activeRefName = data?.currentCommit?.branch || data?.defaultBranch || 'main';
        state.selectedCommitSha = data?.currentCommit?.sha || '';
        updateRoute();
        render();
      });
    }

    document.querySelectorAll('.gh-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        state.activeTab = tab.getAttribute('data-tab');
        updateRoute();
        render();
      });
    });

    document.querySelectorAll('.breadcrumb-item').forEach(item => {
      item.addEventListener('click', () => {
        const folder = item.getAttribute('data-folder');
        state.currentFolder = folder || '';
        state.selectedFile = null;
        updateRoute();
        render();
      });
    });

    document.querySelectorAll('[data-nav-folder]').forEach(el => {
      el.addEventListener('click', () => {
        state.currentFolder = el.getAttribute('data-nav-folder');
        state.selectedFile = null;
        updateRoute();
        render();
      });
    });

    document.querySelectorAll('[data-nav-file]').forEach(el => {
      el.addEventListener('click', () => {
        state.selectedFile = el.getAttribute('data-nav-file');
        updateRoute();
        render();
      });
    });

    const filterInput = document.getElementById('filter-input');
    if (filterInput) {
      filterInput.addEventListener('input', (e) => {
        state.filterText = e.target.value;

        if (tableContainer) {
          const newHtml = renderTable();
          const toolbar = document.querySelector('.file-toolbar');
          if (toolbar) {
            toolbar.outerHTML = newHtml;
            bindEvents();
            const refocusedInput = document.getElementById('filter-input');
            if (refocusedInput) {
              refocusedInput.focus();

      });
    }

    document.querySelectorAll('.gh-table th.sortable').forEach(th => {
      th.addEventListener('click', () => {
        const sortCol = th.getAttribute('data-sort');
        if (state.sortColumn === sortCol) {
          state.sortAsc = !state.sortAsc;

          state.sortColumn = sortCol;
          state.sortAsc = true;

      });
    });

    document.querySelectorAll('.chart-actions button[data-metric]').forEach(btn => {
      btn.addEventListener('click', () => {

      });

      btn.addEventListener('click', () => {

        const scrollY = window.scrollY;
        let targetRow = null;
        for (const row of uncoveredRows) {
          const top = row.getBoundingClientRect().top + scrollY;
          if (top > scrollY + 50) {
            targetRow = row;
            break;
          }
        }
        if (!targetRow) targetRow = uncoveredRows[0];
        targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    }

    document.querySelectorAll('.chart-dot').forEach(dot => {
      dot.addEventListener('mouseenter', (e) => {
        if (!tooltipEl) return;
        const sha = dot.getAttribute('data-sha')?.slice(0, 7);
        const date = formatDate(dot.getAttribute('data-date'));
        const msg = dot.getAttribute('data-msg');
        const lines = dot.getAttribute('data-lines');
        const fn = dot.getAttribute('data-fn');
        const br = dot.getAttribute('data-br');

        tooltipEl.innerHTML = `

        `;
        tooltipEl.style.opacity = '1';
        tooltipEl.style.left = (e.pageX + 10) + 'px';
        tooltipEl.style.top = (e.pageY - 40) + 'px';
      });

      dot.addEventListener('mousemove', (e) => {
        if (!tooltipEl) return;
        tooltipEl.style.left = (e.pageX + 10) + 'px';
        tooltipEl.style.top = (e.pageY - 40) + 'px';
      });

      dot.addEventListener('mouseleave', () => {
        if (!tooltipEl) return;
        tooltipEl.style.opacity = '0';
      });
    });
  }

  // Keyboard shortcut '/' to focus search input
  window.addEventListener('keydown', (e) => {
    if (document.activeElement?.tagName === 'INPUT' || document.activeElement?.tagName === 'TEXTAREA') {
      return;
    }
    if (e.key === 't') {
      e.preventDefault();
      if (!state.sidebarVisible) {
        state.sidebarVisible = true;
        localStorage.setItem('covpages-sidebar', 'true');
        render();
      }
      const gotoInput = document.getElementById('goto-input');
      if (gotoInput) {
        gotoInput.focus();
        gotoInput.select();

    } else if (e.key === 'b') {
      e.preventDefault();
      state.sidebarVisible = !state.sidebarVisible;
      localStorage.setItem('covpages-sidebar', String(state.sidebarVisible));
      render();
    } else if (e.key === '/') {
      const input = document.getElementById('filter-input');
      if (input) {
        e.preventDefault();
        input.focus();
      }
    } else if (e.key === 'n' && state.selectedFile) {
      const jumpBtn = document.getElementById('jump-next-uncovered');
      if (jumpBtn) jumpBtn.click();
    } else if (e.key === 'Escape' && state.refPopoverOpen) {
      e.preventDefault();
      state.refPopoverOpen = false;
      render();
    }
  });

  window.addEventListener('popstate', () => {
    parseRoute();
    render();
  });

  window.addEventListener('hashchange', () => {
    parseRoute();
    render();
  });

  // Dynamic bootstrapping for Drop-in mode
  async function bootstrap() {
    const base = getBasePath();
    if (data) {
      if (!data.refs) {
        try {
          const rr = await fetch(base + 'refs.json');
          if (rr.ok) data.refs = await rr.json();
        } catch {}
      }
      initState();
      render();
      return;
    }

    // Try fetching covpages-data.json
    try {
      const r = await fetch(base + 'covpages-data.json');
      if (r.ok) {
        data = await r.json();
        if (!data.refs) {
          try {
            const rr = await fetch(base + 'refs.json');
            if (rr.ok) data.refs = await rr.json();
          } catch {}
        }
        initState();
        render();
        return;
      }
    } catch {}

    // Try fetching history.json
    let historyCommits = [];
    try {
      const hr = await fetch(base + 'history.json');
      if (hr.ok) {
        historyCommits = await hr.json();
      }
    } catch {}

    // Try fetching coverage files (LCOV, Cobertura XML, Istanbul/Jest JSON)
    const candidates = [
      base + 'lcov.info',
      base + 'coverage/lcov.info',
      base + 'cobertura.xml',
      base + 'coverage/cobertura-coverage.xml',
      base + 'coverage/coverage-final.json',
      base + 'coverage-final.json',
      base + 'coverage.json',
    ];
    for (const cand of candidates) {
      try {
        const lr = await fetch(cand);
        if (lr.ok) {
          const covText = await lr.text();
          data = parseClientCoverage(covText, historyCommits);
          try {
            const rr = await fetch(base + 'refs.json');
            if (rr.ok) data.refs = await rr.json();
          } catch {}
          initState();
          render();
          return;
        }
      } catch {}
    }

    // Fallback: render empty state with drag-and-drop
    render();
  }

          '<p><button type="button" class="btn btn-sm btn-primary ask-ai-cta-btn" data-action="navigate:covpages/mcp?tool=find_high_value_targets">Open in WebMCP Catalog (?tool=find_high_value_targets)</button></p>';
      } else if (/(?:flutter|dart|vitest|vite|jest|rust|cargo|python|pytest|golang|go|cpp|preset|框架)/i.test(lower) || lower.includes('c++')) {
        var fw = 'vitest';
        if (lower.includes('flutter')) fw = 'flutter';
        else if (lower.includes('dart')) fw = 'dart';
        else if (lower.includes('jest')) fw = 'jest';
        else if (lower.includes('rust') || lower.includes('cargo')) fw = 'rust';
        else if (lower.includes('python') || lower.includes('pytest')) fw = 'python';
        else if (lower.includes('go') || lower.includes('golang')) fw = 'go';
        else if (lower.includes('cpp') || lower.includes('c++') || lower.includes('gcov')) fw = 'cpp';
        else if (lower.includes('vitest') || lower.includes('vite')) fw = 'vitest';

        var presetRes = await callWebMcp('get_framework_preset', { framework: fw, docs: true });
        replyHtml = '<p>🛠️ <strong>WebMCP Tool Invoked:</strong> <code>get_framework_preset(framework: "' + escapeHtml(fw) + '")</code></p>' +
          '<p>⚡ <strong>' + escapeHtml(presetRes.framework) + ' Integration Preset:</strong></p>' +
          '<p><strong>Test Command:</strong> <code>' + escapeHtml(presetRes.testCommand) + '</code></p>' +
          '<p><strong>Coverage File:</strong> <code>' + escapeHtml(presetRes.coverageFile) + '</code></p>' +
          '<p><strong>GitHub Actions Workflow (<code>' + escapeHtml(presetRes.recommendedWorkflowPath) + '</code>):</strong></p>' +
          '<pre><code>' + escapeHtml(presetRes.workflow) + '</code></pre>' +
          '<p><button type="button" class="btn btn-sm btn-primary ask-ai-cta-btn" data-action="navigate:mcp?tool=get_framework_preset&framework=' + encodeURIComponent(fw) + '">Open in WebMCP Catalog</button></p>';
      } else if (/(?:summary|delta|總覽|覆蓋率總結|current coverage|指標|metrics)/i.test(lower)) {
        var summaryRes = await callWebMcp('get_coverage_summary', {});
        var s = summaryRes.summary;
        var d = summaryRes.delta;
        var deltaStr = d ? (' (' + (d.linesPct >= 0 ? '+' : '') + d.linesPct + '% vs previous)') : '';
        replyHtml = '<p>🛠️ <strong>WebMCP Tool Invoked:</strong> <code>get_coverage_summary</code></p>' +
          '<p>📊 <strong>Current Coverage Metrics:</strong></p>' +
          '<ul>' +
          '<li><strong>Lines:</strong> ' + s.lines.pct + '% (' + s.lines.covered + '/' + s.lines.total + ')' + deltaStr + '</li>' +
          '<li><strong>Functions:</strong> ' + s.functions.pct + '% (' + s.functions.covered + '/' + s.functions.total + ')</li>' +
          '<li><strong>Branches:</strong> ' + s.branches.pct + '% (' + s.branches.covered + '/' + s.branches.total + ')</li>' +
          '</ul>' +
          '<p><button type="button" class="btn btn-sm btn-primary ask-ai-cta-btn" data-action="navigate:covpages/">Open Live Coverage Viewer</button></p>';
      } else if (/(?:trend|trends|history|歷史|趨勢|commits?|走勢|進展)/i.test(lower)) {
        var trendsRes = await callWebMcp('get_coverage_trends', { limit: 5 });
        replyHtml = '<p>🛠️ <strong>WebMCP Tool Invoked:</strong> <code>get_coverage_trends(limit: 5)</code></p>' +
          '<p>📈 <strong>Recent Coverage Trends across Commits:</strong></p>' +
          '<ul>';
        trendsRes.trends.forEach(function (c) {
          replyHtml += '<li><code>' + escapeHtml(c.shortSha) + '</code>: <strong>' + c.linesPct + '%</strong> - ' + escapeHtml(c.message) + ' (' + escapeHtml(c.date) + ')</li>';
        });
        replyHtml += '</ul>' +
          '<p><button type="button" class="btn btn-sm btn-primary ask-ai-cta-btn" data-action="navigate:covpages/#trend">View Interactive Trendline</button></p>';
      } else if (/(?:setup|advisor|consult|如何配置|配置|安裝|架設|模式|哪個模式|模式選擇)/i.test(lower)) {
        var setupRes = await callWebMcp('consult_setup', {
          zeroBuild: lower.includes('zero') || lower.includes('drop'),
          hasExistingCommits: lower.includes('backfill') || lower.includes('commit') || lower.includes('history')
        });
        replyHtml = '<p>🛠️ <strong>WebMCP Tool Invoked:</strong> <code>consult_setup</code></p>' +
          '<p>🚀 <strong>Recommended Deployment Mode:</strong> <code>' + escapeHtml(setupRes.recommendedMode) + '</code></p>' +
          '<p>' + escapeHtml(setupRes.summary) + '</p>' +
          (setupRes.quickCommand ? '<pre><code>' + escapeHtml(setupRes.quickCommand) + '</code></pre>' : '') +
          (setupRes.command ? '<pre><code>' + escapeHtml(setupRes.command) + '</code></pre>' : '') +
          '<p><button type="button" class="btn btn-sm btn-primary ask-ai-cta-btn" data-action="navigate:mcp?tool=consult_setup">Open in WebMCP Catalog</button></p>';
      } else if (/(?:badge|badges|徽章|svg badge|shield)/i.test(lower)) {
        var badgeRes = await callWebMcp('get_badge_code', { scope: 'overall' });
        replyHtml = '<p>🛠️ <strong>WebMCP Tool Invoked:</strong> <code>get_badge_code</code></p>' +
          '<p>🏷️ <strong>Scoped SVG Badge Code:</strong></p>' +
          '<p>Markdown:</p>' +
          '<pre><code>' + escapeHtml(badgeRes.markdown) + '</code></pre>' +
          '<p>HTML:</p>' +
          '<pre><code>' + escapeHtml(badgeRes.html) + '</code></pre>' +
          '<p><button type="button" class="btn btn-sm ask-ai-cta-btn" data-action="jump:#badges">Open Badge Generator</button></p>';
      } else if (/(?:doc|docs|documentation|文件|說明)/i.test(lower)) {
        var docRes = await callWebMcp('get_documentation', { topic: 'overview' });
        replyHtml = '<p>🛠️ <strong>WebMCP Tool Invoked:</strong> <code>get_documentation</code></p>' +
          formatMarkdown(docRes.content);
      } else if (/(?:navigate|jump|go to|前往|打開|跳轉|demo|live)/i.test(lower)) {
        replyHtml = '<p>🛠️ <strong>WebMCP Tool Invoked:</strong> <code>navigate_to(target: "live_demo")</code></p>' +
          '<p>Click below to jump directly to the live coverage report:</p>' +
          '<p><button type="button" class="btn btn-sm btn-primary ask-ai-cta-btn" data-action="navigate:covpages/">Open Live Coverage Demo</button></p>';
      } else if (/(?:mcp|ai-proxy|register|註冊|連接)/i.test(lower)) {
        var isCov = window.location.pathname.includes('/covpages/');
        var targetPath = isCov ? 'covpages/covpages/mcp' : 'covpages/mcp';
        var siteSlug = isCov ? 'covpages-covpages' : 'covpages';
        replyHtml = '<p>🔌 <strong>Register WebMCP Endpoint:</strong></p>' +
          '<p>Add this site to your local <code>ai-proxy</code> relay server:</p>' +
          '<pre><code>npx ai-proxy add https://yongjhih.github.io/' + targetPath + ' --name ' + siteSlug + '</code></pre>' +
          '<p style="display:flex;gap:0.5rem;flex-wrap:wrap;">' +
          '<button type="button" class="btn btn-sm btn-primary ask-ai-cta-btn" data-action="action:add-mcp?url=' + encodeURIComponent('https://yongjhih.github.io/' + targetPath) + '&name=' + encodeURIComponent(siteSlug) + '">➕ 一鍵新增到 local ai-proxy</button>' +
          '<button type="button" class="btn btn-sm ask-ai-cta-btn" data-action="navigate:mcp">View MCP Tools Catalog</button>' +
          '</p>';
      } else {
        replyHtml = '<p>🛠️ <strong>WebMCP Tools Ready (11 Tools Registered)</strong></p>' +
          '<p>Ask me a question or click a tool to run it directly:</p>' +
          '<div class="ask-ai-chips">' +
            '<button type="button" class="ask-ai-chip" data-ask="covpages cli help">🛠️ get_cli_help</button>' +
            '<button type="button" class="ask-ai-chip" data-ask="Find high-value coverage targets">🎯 find_high_value_targets</button>' +
            '<button type="button" class="ask-ai-chip" data-ask="Vitest framework preset">⚡ get_framework_preset</button>' +
            '<button type="button" class="ask-ai-chip" data-ask="Coverage summary and metrics">📊 get_coverage_summary</button>' +
            '<button type="button" class="ask-ai-chip" data-ask="Multi-commit coverage trends">📈 get_coverage_trends</button>' +
            '<button type="button" class="ask-ai-chip" data-ask="Generate SVG badge">🏷️ get_badge_code</button>' +
            '<button type="button" class="ask-ai-chip" data-ask="Setup advisor and modes">🚀 consult_setup</button>' +
          '</div>';
      }
    } catch (toolErr) {
      replyHtml = '<p>⚠️ Error executing WebMCP tool: ' + escapeHtml(toolErr && toolErr.message ? toolErr.message : String(toolErr)) + '</p>' +
        '<p>You can also query tools directly on the <a href="mcp">MCP Tools Catalog</a> page.</p>';
    }

    updateTypingContent(replyHtml);
  }

  if (form) {
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (currentAbortController) {
        currentAbortController.abort();
        return;
      }
      var val = input.value;
      if (val) handleUserQuery(val);
    });
  }

  if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && currentAbortController) {
        currentAbortController.abort();
      }
    });
  }

  // Bind initial suggestion chips
  bindActions(messagesEl);

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatMarkdown(markdown) {
    if (!markdown) return '';
    var lines = String(markdown).split('\n');
    var result = [];
    var inCodeBlock = false;
    var codeBlockLines = [];
    var inList = false;

    function closeList() {
      if (inList === 'ol') {
        result.push('</ol>');
        inList = false;
      } else if (inList) {
        result.push('</ul>');
        inList = false;
      }
    }

    function formatInline(text) {
      var out = escapeHtml(text);

      // 1) Action CTA buttons: [Text](action:...)
      out = out.replace(
        /\[([^\]]+)\]\((action:[^)]+)\)/g,
        function (_, label, actionUrl) {
          return '<button type="button" class="btn btn-sm btn-primary ask-ai-cta-btn" data-action="' + actionUrl + '">' + label + '</button>';
        }
      );

      // 2) Jump buttons: [Text](#hash)
      out = out.replace(
        /\[([^\]]+)\]\((#[^)]+)\)/g,
        function (_, label, hash) {
          return '<button type="button" class="btn btn-sm ask-ai-jump-btn" data-jump="' + hash + '">' + label + '</button>';
        }
      );

      // 3) Normal Links / relative files: [Text](url)
      out = out.replace(
        /\[([^\]]+)\]\(([^)]+)\)/g,
        function (_, label, url) {
          var isExt = url.startsWith('http://') || url.startsWith('https://');
          var targetAttr = isExt ? ' target="_blank" rel="noopener"' : '';
          return '<a href="' + url + '" class="btn btn-sm ask-ai-cta-btn" style="text-decoration:none;"' + targetAttr + '>' + label + '</a>';
        }
      );

      // 4) Bold: **text**
      out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

      // 5) Inline code
      out = out.replace(new RegExp('\x60([^\x60]+)\x60', 'g'), '<code>$1</code>');

      return out;
    }

    var codeFence = String.fromCharCode(96, 96, 96);
    for (var i = 0; i < lines.length; i++) {
      var rawLine = lines[i];
      var trimmed = rawLine.trim();

      if (trimmed.startsWith(codeFence)) {
        if (inCodeBlock) {
          result.push('<pre><code>' + escapeHtml(codeBlockLines.join('\n')) + '</code></pre>');
          codeBlockLines = [];
          inCodeBlock = false;
        } else {
          closeList();
          inCodeBlock = true;
        }
        continue;
      }
      if (inCodeBlock) {
        codeBlockLines.push(rawLine);
        continue;
      }

      if (!trimmed) {
        closeList();
        continue;
      }

      if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
        var itemContent = trimmed.slice(2);
        var isAction = /^\[.+?\]\(.+?\)$/.test(itemContent.trim());
        if (!inList) {
          inList = 'ul';
          result.push(isAction ? '<ul class="ask-ai-actions-list">' : '<ul>');
        }
        result.push('<li>' + formatInline(itemContent) + '</li>');
        continue;
      }

      var olMatch = /^(\d+)\.\s+(.*)$/.exec(trimmed);
      if (olMatch) {
        if (!inList) {
          inList = 'ol';
          result.push('<ol>');
        }
        result.push('<li>' + formatInline(olMatch[2]) + '</li>');
        continue;
      }

      closeList();

      if (trimmed.startsWith('> ')) {
        result.push('<blockquote>' + formatInline(trimmed.slice(2)) + '</blockquote>');
        continue;
      }

      result.push('<p>' + formatInline(rawLine) + '</p>');
    }

    closeList();
    if (inCodeBlock && codeBlockLines.length > 0) {
      result.push('<pre><code>' + escapeHtml(codeBlockLines.join('\n')) + '</code></pre>');
    }

    return result.join('');
  }
})();

  </script>
