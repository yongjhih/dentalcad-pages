003e\n\n        {/* 6 Movement Modes Grid */}\n        \u003cdiv\n          className=\"grid grid-cols-2 gap-1.5\"\n          role=\"group\"\n          aria-label={tr(locale, '咬合運動模式', 'Articulation movement modes')}\n        \u003e\n          {movementModes.map((m) =\u003e {\n            const active = articulator.mode === m.id;\n            return (\n              \u003cbutton\n                key={m.id}\n                type=\"button\"\n                data-testid={`articulation-mode-${m.id}`}\n                onClick={() =\u003e updateArticulator({ mode: m.id })}\n                className={`p-2 rounded-lg border text-left transition-colors ${\n                  active\n                    ? 'bg-sky-500/15 dark:bg-sky-950/60 border-sky-500 text-slate-900 dark:text-white shadow-sm'\n                    : 'bg-white dark:bg-[#0b0f17] border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:border-slate-300 dark:hover:border-slate-700'\n                }`}\n              \u003e\n                \u003cdiv className=\"font-semibold text-xs text-slate-900 dark:text-slate-100\"\u003e\n                  {m.label}\n                \u003c/div\u003e\n                \u003cdiv className=\"text-[10px] text-slate-500 dark:text-slate-400 truncate\"\u003e\n                  {m.sub}\n                \u003c/div\u003e\n              \u003c/button\u003e\n            );\n          })}\n        \u003c/div\u003e\n\n        {/* Playback Bar & Progress Slider */}\n        \u003cdiv className=\"bg-white dark:bg-[#0b0f17] border border-slate-200 dark:border-slate-800 p-3 rounded-lg space-y-3 shadow-sm dark:shadow-none\"\u003e\n          \u003cdiv className=\"flex items-center justify-between gap-2\"\u003e\n            \u003cdiv className=\"flex items-center gap-1.5\"\u003e\n              \u003cbutton\n                type=\"button\"\n                data-testid=\"articulator-play-toggle\"\n                onClick={() =\u003e updateArticulator({ isPlaying: !articulator.isPlaying })}\n                className={`px-3 py-1.5 rounded text-xs font-medium flex items-center gap-1.5 transition-colors ${\n                  articulator.isPlaying\n                    ? 'bg-amber-500 text-slate-950 font-semibold'\n                    : 'bg-sky-500 hover:bg-sky-600 text-white'\n                }`}\n              \u003e\n                {articulator.isPlaying ? (\n                  \u003c\u003e\n                    \u003cPause className=\"w-3.5 h-3.5\" /\u003e\n                    \u003cspan\u003e{tr(locale, '暫停模擬', 'Pause')}\u003c/span\u003e\n                  \u003c/\u003e\n                ) : (\n                  \u003c\u003e\n                    \u003cPlay className=\"w-3.5 h-3.5\" /\u003e\n                    \u003cspan\u003e{tr(locale, '自動播放運動', 'Auto-Play Motion')}\u003c/span\u003e\n                  \u003c/\u003e\n                )}\n              \u003c/button\u003e\n\n              \u003cbutton\n                type=\"button\"\n                data-testid=\"articulator-reset-btn\"\n                onClick={() =\u003e updateArticulator({ progress: 0, isPlaying: false })}\n                title={tr(locale, '回到中心咬合 (MIP / CO)', 'Reset to Centric Occlusion (MIP / CO)')}\n                className=\"p-1.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-slate-950 dark:hover:text-white border border-slate-200 dark:border-slate-700\"\n              \u003e\n                \u003cRotateCcw className=\"w-3.5 h-3.5\" /\u003e\n              \u003c/button\u003e\n            \u003c/div\u003e\n\n            {/* Playback Speed Selector */}\n            \u003cdiv className=\"flex items-center gap-1\"\u003e\n              {[0.5, 1.0, 1.5].map((spd) =\u003e (\n                \u003cbutton\n                  key={spd}\n                  type=\"button\"\n                  onClick={() =\u003e updateArticulator({ playbackSpeed: spd })}\n                  className={`px-2 py-0.5 rounded font-mono text-[10px] border transition-colors ${\n                    articulator.playbackSpeed === spd\n                      ? 'bg-sky-500/20 border-sky-500/50 text-sky-600 dark:text-sky-300 font-semibold'\n                      : 'bg-slate-100 dark:bg-slate-900 border-slate-200 dark:border-slate-800 text-slate-500'\n                  }`}\n                \u003e\n                  {spd}x\n                \u003c/button\u003e\n              ))}\n            \u003c/div\u003e\n          \u003c/div\u003e\n\n          {/* Progress Slider */}\n          \u003cdiv className=\"space-y-1\"\u003e\n            \u003cdiv className=\"flex justify-between text-[11px] text-slate-500 dark:text-slate-400\"\u003e\n              \u003cspan\u003e{tr(locale, '咬合運動行程進度 (Motion Phase)', 'Motion Phase Progress')}\u003c/span\u003e\n              \u003cspan className=\"font-mono text-sky-600 dark:text-sky-400 font-semibold tabular-nums\"\u003e\n                {Math.round(articulator.progress * 100)}%\n              \u003c/span\u003e\n            \u003c/div\u003e\n            \u003cinput\n              type=\"range\"\n              data-testid=\"articulator-progress-slider\"\n              min=\"0\"\n              max=\"1\"\n              step=\"0.01\"\n              value={articulator.progress}\n              onChange={(e) =\u003e\n                updateArticulator({\n                  progress: parseFloat(e.target.value),\n                  isPlaying: false,\n                })\n              }\n              className=\"w-full h-1.5 bg-slate-200 dark:bg-slate-800 rounded-lg appearance-none cursor-pointer accent-sky-500\"\n            /\u003e\n          \u003c/div\u003e\n\n          {/* Real-time 6-DOF Kinematic Readouts */}\n          \u003cdiv className=\"grid grid-cols-4 gap-1.5 pt-2 border-t border-slate-200 dark:border-slate-800/80 text-center font-mono\"\u003e\n            \u003cdiv className=\"bg-slate-50 dark:bg-slate-900/70 p-1.5 rounded border border-slate-200/70 dark:border-slate-800\"\u003e\n              \u003cdiv className=\"text-[10px] text-slate-400 font-sans\"\u003e\n                {tr(locale, '切端位移', 'Incisal Opening')}\n              \u003c/div\u003e\n              \u003cdiv\n                data-testid=\"kinematic-incisal-opening\"\n                className=\"text-xs font-semibold text-sky-600 dark:text-sky-300 tabular-nums\"\n              \u003e\n                {kinematics.incisalOpeningMm.toFixed(1)} mm\n              \u003c/div\u003e\n            \u003c/div\u003e\n            \u003cdiv className=\"bg-slate-50 dark:bg-slate-900/70 p-1.5 rounded border border-slate-200/70 dark:border-slate-800\"\u003e\n              \u003cdiv className=\"text-[10px] text-slate-400 font-sans\"\u003e\n                {tr(locale, '樞軸轉角', 'Hinge Angle')}\n              \u003c/div\u003e\n              \u003cdiv\n                data-testid=\"kinematic-rotation-deg\"\n                className=\"text-xs font-semibold text-amber-600 dark:text-amber-300 tabular-nums\"\n              \u003e\n                {kinematics.rotationAngleDeg.toFixed(1)}°\n              \u003c/div\u003e\n            \u003c/div\u003e\n            \u003cdiv className=\"bg-slate-50 dark:bg-slate-900/70 p-1.5 rounded border border-slate-200/70 dark:border-slate-800\"\u003e\n              \u003cdiv className=\"text-[10px] text-slate-400 font-sans\"\u003e\n                {tr(locale, '髁頭滑動', 'Condylar Slip')}\n              \u003c/div\u003e\n              \u003cdiv\n                data-testid=\"kinematic-condylar-slip\"\n                className=\"text-xs font-semibold text-emerald-600 dark:text-emerald-300 tabular-nums\"\n              \u003e\n                {kinematics.condylarTranslationMm.toFixed(1)} mm\n              \u003c/div\u003e\n            \u003c/div\u003e\n            \u003cdiv className=\"bg-slate-50 dark:bg-slate-900/70 p-1.5 rounded border border-slate-200/70 dark:border-slate-800\"\u003e\n              \u003cdiv className=\"text-[10px] text-slate-400 font-sans\"\u003e\n                {tr(locale, '側方偏移', 'Lateral Shift')}\n              \u003c/div\u003e\n              \u003cdiv className=\"text-xs font-semibold text-purple-600 dark:text-purple-300 tabular-nums\"\u003e\n                {kinematics.lateralShiftMm.toFixed(1)} mm\n              \u003c/div\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      {/* 2. Interactive Occlusal Movement Curve Editor */}\n      \u003cdiv className=\"space-y-3 pt-2 border-t border-slate-200 dark:border-slate-800/80\"\u003e\n        \u003cdiv className=\"flex items-center justify-between\"\u003e\n          \u003ch2 className=\"text-base font-semibold text-slate-900 dark:text-slate-100 flex items-center gap-2\"\u003e\n            \u003cSliders className=\"w-4 h-4 text-sky-500 dark:text-sky-400\" /\u003e\n            \u003cspan\u003e\n              {tr(\n                locale,\n                '咬合運動曲線與髁導參數編輯器',\n                'Occlusal Trajectory Curve & TMJ Guidance'\n              )}\n            \u003c/span\u003e\n          \u003c/h2\u003e\n          \u003cdiv className=\"flex items-center gap-1 bg-slate-200/70 dark:bg-slate-900 p-0.5 rounded border border-slate-300 dark:border-slate-800\"\u003e\n            \u003cbutton\n              type=\"button\"\n              onClick={() =\u003e setCurveViewMode('bezier')}\n              className={`px-2 py-0.5 rounded text-[10px] font-medium transition-colors ${\n                curveViewMode === 'bezier'\n                  ? 'bg-white dark:bg-slate-800 text-sky-600 dark:text-sky-300 shadow-sm'\n                  : 'text-slate-500'\n              }`}\n            \u003e\n              {tr(locale, 'Bezier 曲線', 'Bezier Curve')}\n            \u003c/button\u003e\n            \u003cbutton\n              type=\"button\"\n              onClick={() =\u003e setCurveViewMode('sagittal')}\n              className={`px-2 py-0.5 rounded text-[10px] font-medium transition-colors ${\n                curveViewMode === 'sagittal'\n                  ? 'bg-white dark:bg-slate-800 text-sky-600 dark:text-sky-300 shadow-sm'\n                  : 'text-slate-500'\n              }`}\n            \u003e\n              {tr(locale, '矢狀面軌跡', 'Sagittal Path')}\n            \u003c/button\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n\n        {/* Curve Presets */}\n        \u003cdiv className=\"grid grid-cols-2 gap-1.5\"\u003e\n          {(\n            Object.keys(ARTICULATION_CURVE_PRESETS) as Array\u003c\n              Exclude\u003cArticulationCurvePresetId, 'custom'\u003e\n            \u003e\n          ).map((presetKey) =\u003e {\n            const preset = ARTICULATION_CURVE_PRESETS[presetKey];\n            const isSelected = articulator.curvePresetId === presetKey;\n            return (\n              \u003cbutton\n                key={presetKey}\n                type=\"button\"\n                data-testid={`curve-preset-${presetKey}`}\n                onClick={() =\u003e handleSelectCurvePreset(presetKey)}\n                className={`px-2.5 py-1.5 rounded border text-left transition-colors ${\n                  isSelected\n                    ? 'bg-sky-500/15 dark:bg-sky-950/50 border-sky-500 text-sky-700 dark:text-sky-200 font-medium'\n                    : 'bg-white dark:bg-[#0b0f17] border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:border-slate-300'\n                }`}\n              \u003e\n                \u003cdiv className=\"text-[11px] font-semibold truncate\"\u003e\n                  {locale === 'en' ? preset.nameEn : preset.name}\n                \u003c/div\u003e\n              \u003c/button\u003e\n            );\n          })}\n        \u003c/div\u003e\n\n        {/* Interactive SVG Curve Canvas */}\n        \u003cdiv className=\"bg-white dark:bg-[#0b0f17] border border-slate-200 dark:border-slate-800 p-3 rounded-lg space-y-2.5 shadow-sm dark:shadow-none\"\u003e\n          \u003cdiv className=\"flex items-center justify-between text-[11px] text-slate-500 dark:text-slate-400\"\u003e\n            \u003cspan\u003e\n              {curveViewMode === 'bezier'\n                ? tr(\n                    locale,\n                    '拖曳控制點 P1 / P2 調整張口旋轉與髁頭滑移耦合曲線',\n                    'Drag control points P1 / P2 to tune hinge rotation & condylar slip coupling'\n                  )\n                : tr(\n                    locale,\n                    '下顎切端於矢狀面 (Y-Z) 之即時運動軌跡包絡線',\n                    'Real-time mandibular incisal envelope in the sagittal plane (Y-Z)'\n                  )}\n            \u003c/span\u003e\n            \u003cspan className=\"font-mono text-[10px] text-sky-600 dark:text-sky-400\"\u003e\n              {articulator.curvePresetId === 'custom'\n                ? 'Custom Curve'\n                : locale === 'en'\n                ? ARTICULATION_CURVE_PRESETS[articulator.curvePresetId].nameEn\n                : ARTICULATION_CURVE_PRESETS[articulator.curvePresetId].name}\n            \u003c/span\u003e\n          \u003c/div\u003e\n\n          \u003csvg\n            ref={svgRef}\n            data-testid=\"occlusal-curve-svg\"\n            viewBox=\"0 0 280 180\"\n            onPointerMove={handleSvgPointerMove}\n            onPointerUp={() =\u003e setDraggingHandle(null)}\n            onPointerLeave={() =\u003e setDraggingHandle(null)}\n            className=\"w-full h-44 bg-slate-50 dark:bg-[#070b12] rounded border border-slate-200 dark:border-slate-800/90 select-none touch-none\"\n          \u003e\n            {/* Background Grid Lines */}\n            {[0.25, 0.5, 0.75].map((g) =\u003e (\n              \u003cg key={g}\u003e\n                \u003cline\n                  x1={toBezierSvgX(g)}\n                  y1={18}\n                  x2={toBezierSvgX(g)}\n                  y2={154}\n                  stroke=\"currentColor\"\n                  className=\"text-slate-200 dark:text-slate-800/80\"\n                  strokeDasharray=\"2 2\"\n                /\u003e\n                \u003cline\n                  x1={28}\n                  y1={toBezierSvgY(g)}\n                  x2={252}\n                  y2={toBezierSvgY(g)}\n                  stroke=\"currentColor\"\n                  className=\"text-slate-200 dark:text-slate-800/80\"\n                  strokeDasharray=\"2 2\"\n                /\u003e\n              \u003c/g\u003e\n            ))}\n\n            {/* Axes */}\n            \u003crect\n              x={28}\n              y={18}\n              width={224}\n              height={136}\n              fill=\"none\"\n              stroke=\"currentColor\"\n              className=\"text-slate-300 dark:text-slate-700\"\n            /\u003e\n\n            {curveViewMode === 'bezier' ? (\n              \u003c\u003e\n                {/* Linear reference diagonal */}\n                \u003cline\n                  x1={toBezierSvgX(0)}\n                  y1={toBezierSvgY(0)}\n                  x2={toBezierSvgX(1)}\n                  y2={toBezierSvgY(1)}\n                  stroke=\"currentColor\"\n                  className=\"text-slate-300 dark:text-slate-700\"\n                  strokeDasharray=\"4 4\"\n                /\u003e\n\n                {/* Control tangent lines */}\n                \u003cline\n                  x1={toBezierSvgX(0)}\n                  y1={toBezierSvgY(0)}\n                  x2={toBezierSvgX(articulator.bezier.p1x)}\n                  y2={toBezierSvgY(articulator.bezier.p1y)}\n                  stroke=\"#f59e0b\"\n                  strokeWidth=\"1.2\"\n                  strokeDasharray=\"3 2\"\n                /\u003e\n                \u003cline\n                  x1={toBezierSvgX(1)}\n                  y1={toBezierSvgY(1)}\n                  x2={toBezierSvgX(articulator.bezier.p2x)}\n                  y2={toBezierSvgY(articulator.bezier.p2y)}\n                  stroke=\"#10b981\"\n                  strokeWidth=\"1.2\"\n                  strokeDasharray=\"3 2\"\n                /\u003e\n\n                {/* Cubic Bezier Path */}\n                \u003cpath\n                  d={`M ${toBezierSvgX(0)} ${toBezierSvgY(0)} C ${toBezierSvgX(\n                    articulator.bezier.p1x\n                  )} ${toBezierSvgY(articulator.bezier.p1y)}, ${toBezierSvgX(\n                    articulator.bezier.p2x\n                  )} ${toBezierSvgY(articulator.bezier.p2y)}, ${toBezierSvgX(1)} ${toBezierSvgY(\n                    1\n                  )}`}\n                  fill=\"none\"\n                  stroke=\"#0ea5e9\"\n                  strokeWidth=\"2.5\"\n                /\u003e\n\n                {/* Current progress marker on curve */}\n                \u003ccircle\n                  cx={toBezierSvgX(kinematics.bezierPoint.x)}\n                  cy={toBezierSvgY(kinematics.bezierPoint.y)}\n                  r=\"4.5\"\n                  fill=\"#38bdf8\"\n                  stroke=\"#ffffff\"\n                  strokeWidth=\"1.5\"\n                /\u003e\n\n                {/* Control Point P1 */}\n                \u003cg\n                  className=\"cursor-grab active:cursor-grabbing\"\n                  onPointerDown={(e) =\u003e {\n                    e.stopPropagation();\n                    setDraggingHandle('p1');\n                  }}\n                \u003e\n                  \u003ccircle\n                    cx={toBezierSvgX(articulator.bezier.p1x)}\n                    cy={toBezierSvgY(articulator.bezier.p1y)}\n                    r=\"6\"\n                    fill=\"#f59e0b\"\n                    stroke=\"#ffffff\"\n                    strokeWidth=\"1.5\"\n                  /\u003e\n                  \u003ctext\n                    x={toBezierSvgX(articulator.bezier.p1x) + 8}\n                    y={toBezierSvgY(articulator.bezier.p1y) + 4}\n                    className=\"fill-amber-600 dark:fill-amber-400 text-[10px] font-mono font-semibold\"\n                  \u003e\n                    P1\n                  \u003c/text\u003e\n                \u003c/g\u003e\n\n                {/* Control Point P2 */}\n                \u003cg\n                  className=\"cursor-grab active:cursor-grabbing\"\n                  onPointerDown={(e) =\u003e {\n                    e.stopPropagation();\n                    setDraggingHandle('p2');\n                  }}\n                \u003e\n                  \u003ccircle\n                    cx={toBezierSvgX(articulator.bezier.p2x)}\n                    cy={toBezierSvgY(articulator.bezier.p2y)}\n                    r=\"6\"\n                    fill=\"#10b981\"\n                    stroke=\"#ffffff\"\n                    strokeWidth=\"1.5\"\n                  /\u003e\n                  \u003ctext\n                    x={toBezierSvgX(articulator.bezier.p2x) - 20}\n                    y={toBezierSvgY(articulator.bezier.p2y) - 8}\n                    className=\"fill-emerald-600 dark:fill-emerald-400 text-[10px] font-mono font-semibold\"\n                  \u003e\n                    P2\n                  \u003c/text\u003e\n                \u003c/g\u003e\n\n                {/* Axis labels */}\n                \u003ctext\n                  x={140}\n                  y={172}\n                  textAnchor=\"middle\"\n                  className=\"fill-slate-400 text-[10px] font-mono\"\n                \u003e\n                  {tr(locale, '張口行程進度 t (0% → 100%)', 'Opening Progress t (0% → 100%)')}\n                \u003c/text\u003e\n              \u003c/\u003e\n            ) : (\n              \u003c\u003e\n                {/* Sagittal Incisal Path (Y-Z) */}\n                \u003cpath\n                  d={sagittalPathD}\n                  fill=\"none\"\n                  stroke=\"#f59e0b\"\n                  strokeWidth=\"2.5\"\n                  strokeLinecap=\"round\"\n                /\u003e\n                \u003ctext\n                  x={140}\n                  y={172}\n                  textAnchor=\"middle\"\n                  className=\"fill-slate-400 text-[10px] font-mono\"\n                \u003e\n                  {tr(\n                    locale,\n                    '矢狀面切端軌跡 (Posterior -Y ↔ Anterior +Y)',\n                    'Sagittal Incisal Path (Posterior -Y ↔ Anterior +Y)'\n                  )}\n                \u003c/text\u003e\n              \u003c/\u003e\n            )}\n          \u003c/svg\u003e\n\n          {/* Numeric Fine-tuning Sliders for P1 & P2 */}\n          \u003cdiv className=\"grid grid-cols-2 gap-3 pt-1\"\u003e\n            \u003cdiv className=\"space-y-1\"\u003e\n              \u003cdiv className=\"flex justify-between text-[10px] text-amber-600 dark:text-amber-400 font-mono\"\u003e\n                \u003cspan\u003e{tr(locale, 'P1 初段斜率 (X/Y)', 'P1 Initial Slope (X/Y)')}\u003c/span\u003e\n                \u003cspan\u003e\n                  ({articulator.bezier.p1x.toFixed(2)}, {articulator.bezier.p1y.toFixed(2)})\n                \u003c/span\u003e\n              \u003c/div\u003e\n              \u003cinput\n                type=\"range\"\n                aria-label={tr(locale, '控制點 P1 Y', 'Control Point P1 Y')}\n                data-testid=\"bezier-p1y-slider\"\n                min=\"0\"\n                max=\"1\"\n                step=\"0.02\"\n                value={articulator.bezier.p1y}\n                onChange={(e) =\u003e\n                  updateArticulator({\n                    curvePresetId: 'custom',\n                    bezier: { ...articulator.bezier, p1y: parseFloat(e.target.value) },\n                  })\n                }\n                className=\"w-full h-1 bg-slate-200 dark:bg-slate-800 rounded appearance-none cursor-pointer accent-amber-500\"\n              /\u003e\n            \u003c/div\u003e\n\n            \u003cdiv className=\"space-y-1\"\u003e\n              \u003cdiv className=\"flex justify-between text-[10px] text-emerald-600 dark:text-emerald-400 font-mono\"\u003e\n                \u003cspan\u003e{tr(locale, 'P2 後段滑移 (X/Y)', 'P2 Late Slip (X/Y)')}\u003c/span\u003e\n                \u003cspan\u003e\n                  ({articulator.bezier.p2x.toFixed(2)}, {articulator.bezier.p2y.toFixed(2)})\n                \u003c/span\u003e\n              \u003c/div\u003e\n              \u003cinput\n                type=\"range\"\n                aria-label={tr(locale, '控制點 P2 Y', 'Control Point P2 Y')}\n                data-testid=\"bezier-p2y-slider\"\n                min=\"0\"\n                max=\"1\"\n                step=\"0.02\"\n                value={articulator.bezier.p2y}\n                onChange={(e) =\u003e\n                  updateArticulator({\n                    curvePresetId: 'custom',\n                    bezier: { ...articulator.bezier, p2y: parseFloat(e.target.value) },\n                  })\n                }\n                className=\"w-full h-1 bg-slate-200 dark:bg-slate-800 rounded appearance-none cursor-pointer accent-emerald-500\"\n              /\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n\n          {/* TMJ Condylar & Incisal Guidance Angle Sliders */}\n          \u003cdiv className=\"space-y-2.5 pt-2 border-t border-slate-200 dark:border-slate-800/80\"\u003e\n            \u003cdiv className=\"space-y-1\"\u003e\n              \u003cdiv className=\"flex justify-between text-[11px] text-slate-600 dark:text-slate-400\"\u003e\n                \u003cspan\u003e\n                  {tr(locale, '矢狀髁導斜度 (Condylar Guidance SCI)', 'Condylar Guidance Angle (SCI)')}\n                \u003c/span\u003e\n                \u003cspan className=\"font-mono text-sky-600 dark:text-sky-400 tabular-nums\"\u003e\n                  {articulator.condylarGuidanceAngleDeg}°\n                \u003c/span\u003e\n              \u003c/div\u003e\n              \u003cinput\n                type=\"range\"\n                data-testid=\"condylar-angle-slider\"\n                min=\"10\"\n                max=\"60\"\n                step=\"1\"\n                value={articulator.condylarGuidanceAngleDeg}\n                onChange={(e) =\u003e\n                  updateArticulator({\n                    condylarGuidanceAngleDeg: parseFloat(e.target.value),\n                  })\n                }\n                className=\"w-full h-1.5 bg-slate-200 dark:bg-slate-800 rounded-lg appearance-none cursor-pointer accent-sky-500\"\n              /\u003e\n            \u003c/div\u003e\n\n            \u003cdiv className=\"space-y-1\"\u003e\n              \u003cdiv className=\"flex justify-between text-[11px] text-slate-600 dark:text-slate-400\"\u003e\n                \u003cspan\u003e\n                  {tr(locale, '前牙切導斜度 (Incisal Guidance Angle)', 'Incisal Guidance Angle')}\n                \u003c/span\u003e\n                \u003cspan className=\"font-mono text-sky-600 dark:text-sky-400 tabular-nums\"\u003e\n                  {articulator.incisalGuidanceAngleDeg}°\n                \u003c/span\u003e\n              \u003c/div\u003e\n              \u003cinput\n                type=\"range\"\n                data-testid=\"incisal-angle-slider\"\n                min=\"10\"\n                max=\"65\"\n                step=\"1\"\n                value={articulator.incisalGuidanceAngleDeg}\n                onChange={(e) =\u003e\n                  updateArticulator({\n                    incisalGuidanceAngleDeg: parseFloat(e.target.value),\n                  })\n                }\n                className=\"w-full h-1.5 bg-slate-200 dark:bg-slate-800 rounded-lg appearance-none cursor-pointer accent-sky-500\"\n              /\u003e\n            \u003c/div\u003e\n\n            \u003cdiv className=\"grid grid-cols-2 gap-3\"\u003e\n              \u003cdiv className=\"space-y-1\"\u003e\n                \u003cdiv className=\"flex justify-between text-[11px] text-slate-600 dark:text-slate-400\"\u003e\n                  \u003cspan\u003e{tr(locale, '班奈特角 (Bennett)', 'Bennett Angle')}\u003c/span\u003e\n                  \u003cspan className=\"font-mono text-sky-600 dark:text-sky-400 tabular-nums\"\u003e\n                    {articulator.bennettAngleDeg}°\n                  \u003c/span\u003e\n                \u003c/div\u003e\n                \u003cinput\n                  type=\"range\"\n                  min=\"0\"\n                  max=\"35\"\n                  step=\"1\"\n                  value={articulator.bennettAngleDeg}\n                  onChange={(e) =\u003e\n                    updateArticulator({\n                      bennettAngleDeg: parseFloat(e.target.value),\n                    })\n                  }\n                  className=\"w-full h-1.5 bg-slate-200 dark:bg-slate-800 rounded-lg appearance-none cursor-pointer accent-sky-500\"\n                /\u003e\n              \u003c/div\u003e\n\n              \u003cdiv className=\"space-y-1\"\u003e\n                \u003cdiv className=\"flex justify-between text-[11px] text-slate-600 dark:text-slate-400\"\u003e\n                  \u003cspan\u003e{tr(locale, '最大張口角 (Max θ)', 'Max Opening (θ)')}\u003c/span\u003e\n                  \u003cspan className=\"font-mono text-sky-600 dark:text-sky-400 tabular-nums\"\u003e\n                    {articulator.maxOpeningAngleDeg}°\n                  \u003c/span\u003e\n                \u003c/div\u003e\n                \u003cinput\n                  type=\"range\"\n                  min=\"8\"\n                  max=\"32\"\n                  step=\"1\"\n                  value={articulator.maxOpeningAngleDeg}\n                  onChange={(e) =\u003e\n                    updateArticulator({\n                      maxOpeningAngleDeg: parseFloat(e.target.value),\n                    })\n                  }\n                  className=\"w-full h-1.5 bg-slate-200 dark:bg-slate-800 rounded-lg appearance-none cursor-pointer accent-sky-500\"\n                /\u003e\n              \u003c/div\u003e\n            \u003c/div\u003e\n\n            {/* 3D Trajectory Gizmo Toggle */}\n            \u003cdiv className=\"flex items-center justify-between pt-2 border-t border-slate-200 dark:border-slate-800/60\"\u003e\n 3cbutton\n            type=\"button\"\n            data-testid=\"occlusogram-toggle-btn\"\n            onClick={() =\u003e\n              onSettingsChange((prev) =\u003e ({\n                ...prev,\n                occlusogramEnabled: !prev.occlusogramEnabled,\n              }))\n            }\n            className={`px-3 py-1 rounded text-xs font-medium border transition-colors ${\n              settings.occlusogramEnabled\n                ? 'bg-rose-600 border-rose-500 text-white shadow-sm'\n                : 'bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300'\n            }`}\n          \u003e\n            {settings.occlusogramEnabled\n              ? tr(locale, '熱力圖已開啟', 'Heatmap Active')\n              : tr(locale, '開啟咬合熱力圖', 'Enable Occlusogram')}\n          \u003c/button\u003e\n        \u003c/div\u003e\n\n        \u003cdiv className=\"bg-white dark:bg-[#0b0f17] border border-slate-200 dark:border-slate-800 p-3 rounded-lg space-y-3 shadow-sm dark:shadow-none\"\u003e\n          {/* Color Scale Bar */}\n          \u003cdiv className=\"space-y-1\"\u003e\n            \u003cdiv className=\"flex justify-between text-[10px] font-mono text-slate-500 dark:text-slate-400\"\u003e\n              \u003cspan className=\"text-rose-500 font-semibold\"\u003e\n                {tr(locale, '≤0.0mm 干擾', '≤0.0mm Collision')}\n              \u003c/span\u003e\n              \u003cspan className=\"text-orange-500\"\u003e0.25mm\u003c/span\u003e\n              \u003cspan className=\"text-amber-500\"\u003e0.55mm\u003c/span\u003e\n              \u003cspan className=\"text-emerald-500\"\u003e0.95mm\u003c/span\u003e\n              \u003cspan className=\"text-sky-500\"\u003e\n                {settings.occlusogramMaxRangeMm.toFixed(1)}mm {tr(locale, '間隙', 'Clearance')}\n              \u003c/span\u003e\n            \u003c/div\u003e\n            \u003cdiv className=\"h-2 w-full rounded-full bg-gradient-to-r from-rose-600 via-amber-400 to-sky-500\" /\u003e\n          \u003c/div\u003e\n\n          {/* Left vs Right Arch Occlusal Balance Bar */}\n          \u003cdiv className=\"space-y-1 pt-1\"\u003e\n            \u003cdiv className=\"flex justify-between text-[11px] font-medium\"\u003e\n              \u003cspan className=\"text-sky-600 dark:text-sky-400 font-mono tabular-nums\"\u003e\n                {tr(locale, '右側牙弓 (R)', 'Right Arch (R)')}: {occlusogramStats.rightContactPercent}%\n              \u003c/span\u003e\n              \u003cspan className=\"text-slate-500 text-[10px]\"\u003e\n                {tr(locale, '左右咬合接觸對稱比', 'L/R Occlusal Symmetry')}\n              \u003c/span\u003e\n              \u003cspan className=\"text-emerald-600 dark:text-emerald-400 font-mono tabular-nums\"\u003e\n                {tr(locale, '左側牙弓 (L)', 'Left Arch (L)')}: {occlusogramStats.leftContactPercent}%\n              \u003c/span\u003e\n            \u003c/div\u003e\n            \u003cdiv className=\"w-full h-2 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden flex\"\u003e\n              \u003cdiv\n                className=\"bg-sky-500 h-full transition-all duration-300\"\n                style={{ width: `${occlusogramStats.rightContactPercent}%` }}\n              /\u003e\n              \u003cdiv\n                className=\"bg-emerald-500 h-full transition-all duration-300\"\n                style={{ width: `${occlusogramStats.leftContactPercent}%` }}\n              /\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n\n          {/* Occlusogram Metrics Grid */}\n          \u003cdiv className=\"grid grid-cols-3 gap-2 pt-1 font-mono text-center\"\u003e\n            \u003cdiv className=\"bg-slate-50 dark:bg-slate-900/70 p-2 rounded border border-slate-200/70 dark:border-slate-800\"\u003e\n              \u003cdiv className=\"text-[10px] text-slate-400 font-sans\"\u003e\n                {tr(locale, '最小咬合間隙', 'Min Clearance')}\n              \u003c/div\u003e\n              \u003cdiv\n                data-testid=\"occlusogram-min-clearance\"\n                className=\"text-xs font-semibold text-slate-900 dark:text-slate-100 tabular-nums\"\n              \u003e\n                {occlusogramStats.minClearanceMm \u003e 50\n                  ? '\u003e 5.0 mm'\n                  : `${occlusogramStats.minClearanceMm.toFixed(2)} mm`}\n              \u003c/div\u003e\n            \u003c/div\u003e\n            \u003cdiv className=\"bg-slate-50 dark:bg-slate-900/70 p-2 rounded border border-slate-200/70 dark:border-slate-800\"\u003e\n              \u003cdiv className=\"text-[10px] text-slate-400 font-sans\"\u003e\n                {tr(locale, '有效接觸面積', 'Contact Area')}\n              \u003c/div\u003e\n              \u003cdiv\n                data-testid=\"occlusogram-contact-area\"\n                className=\"text-xs font-semibold text-emerald-600 dark:text-emerald-400 tabular-nums\"\n              \u003e\n                {occlusogramStats.contactAreaMm2.toFixed(1)} mm²\n              \u003c/div\u003e\n            \u003c/div\u003e\n            \u003cdiv className=\"bg-slate-50 dark:bg-slate-900/70 p-2 rounded border border-slate-200/70 dark:border-slate-800\"\u003e\n              \u003cdiv className=\"text-[10px] text-slate-400 font-sans\"\u003e\n                {tr(locale, '緊密/干擾區', 'Heavy Contact')}\n              \u003c/div\u003e\n              \u003cdiv className=\"text-xs font-semibold text-rose-600 dark:text-rose-400 tabular-nums\"\u003e\n                {occlusogramStats.heavyCollisionAreaMm2.toFixed(1)} mm²\n              \u003c/div\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      {/* 4. 3D Digital Caliper & Automated Arch Metrics */}\n      \u003cdiv className=\"space-y-3 pt-2 border-t border-slate-200 dark:border-slate-800/80\"\u003e\n        \u003cdiv className=\"flex items-center justify-between\"\u003e\n          \u003ch2 className=\"text-base font-semibold text-slate-900 dark:text-slate-100 flex items-center gap-2\"\u003e\n            \u003cRuler className=\"w-4 h-4 text-sky-500 dark:text-sky-400\" /\u003e\n            \u003cspan\u003e\n              {tr(\n                locale,\n                '牙弓分析與 3D 數位游標尺',\n                'Arch Biometrics & 3D Digital Caliper'\n              )}\n            \u003c/span\u003e\n          \u003c/h2\u003e\n          \u003cdiv className=\"flex items-center gap-1\"\u003e\n            \u003cbutton\n              type=\"button\"\n              data-testid=\"caliper-toggle-btn\"\n              onClick={() =\u003e\n                onSettingsChange((prev) =\u003e ({\n                  ...prev,\n                  caliperToolActive: !prev.caliperToolActive,\n                }))\n              }\n              className={`px-2.5 py-1 rounded text-xs font-medium border transition-colors ${\n                settings.caliperToolActive\n                  ? 'bg-amber-500 border-amber-600 text-slate-950 font-semibold'\n                  : 'bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300'\n              }`}\n            \u003e\n              {settings.caliperToolActive\n                ? tr(locale, '3D 點選測距中', '3D Caliper Active')\n                : tr(locale, '啟用 3D 游標尺', 'Enable 3D Caliper')}\n            \u003c/button\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n\n        {/* Automated Arch Indices */}\n        \u003cdiv className=\"bg-white dark:bg-[#0b0f17] border border-slate-200 dark:border-slate-800 p-3 rounded-lg space-y-3 shadow-sm dark:shadow-none\"\u003e\n          \u003cdiv className=\"grid grid-cols-2 gap-2 font-mono\"\u003e\n            \u003cdiv className=\"p-2 rounded bg-slate-50 dark:bg-slate-900/60 border border-slate-200/70 dark:border-slate-800\"\u003e\n              \u003cspan className=\"text-[10px] text-slate-500 dark:text-slate-400 font-sans block\"\u003e\n                {tr(locale, '尖牙間寬 (U3-U3 / L3-L3)', 'Intercanine Wid \n  Send,\n  Settings,\n  ExternalLink,\n  Terminal,\n  Activity,\n  Eye,\n  Plug,\n  BarChart2,\n  Trash2,\n} from 'lucide-react';\nimport {\n  DentalCaseBundle,\n  LocaleMode,\n  OcclusogramStats,\n  OrthoArchMetrics,\n  ViewportSettings,\n  CameraPreset,\n  ShadingMode,\n} from '../types/dental';\nimport { tr } from '../utils/i18n';\n\nexport interface ViewerControlPayload {\n  cameraPreset?: CameraPreset;\n  shadingMode?: ShadingMode;\n  occlusogramEnabled?: boolean;\n  articulationMode?: 'hinge' | 'protrusion' | 'lateral_left' | 'lateral_right' | 'chewing' | 'parallel';\n  articulationProgress?: number;\n  occlusionSeparation?: number;\n}\n\ninterface ChatMessage {\n  id: string;\n  role: 'user' | 'assistant';\n  content: string;\n  actions?: Array\u003c{\n    label: string;\n    type: 'add-mcp' | 'open-mcp' | 'open-covpages' | 'viewer-control';\n    url?: string;\n    control?: ViewerControlPayload;\n  }\u003e;\n}\n\ninterface AskAiDrawerProps {\n  open: boolean;\n  onClose: () =\u003e void;\n  locale: LocaleMode;\n  activeCase: DentalCaseBundle;\n  archMetrics: OrthoArchMetrics;\n  occlusogramStats: OcclusogramStats;\n  viewportSettings: ViewportSettings;\n  cameraPreset: CameraPreset;\n  onApplyViewerControl: (payload: ViewerControlPayload) =\u003e void;\n}\n\nconst ENDPOINT_STORAGE_KEY = 'dentalcad_ai_proxy_endpoint';\nconst DEFAULT_AI_PROXY_ENDPOINT = 'http://127.0.0.1:8788';\nconst MCP_PAGE_CANONICAL_URL = 'https://yongjhih.github.io/dentalcad-pages/mcp';\n\nexport const AskAiDrawer: React.FC\u003cAskAiDrawerProps\u003e = ({\n  open,\n  onClose,\n  locale,\n  activeCase,\n  archMetrics,\n  occlusogramStats,\n  viewportSettings,\n  cameraPreset,\n  onApplyViewerControl,\n}) =\u003e {\n  const [endpoint, setEndpoint] = useState\u003cstring\u003e(() =\u003e {\n    try {\n      return localStorage.getItem(ENDPOINT_STORAGE_KEY) || DEFAULT_AI_PROXY_ENDPOINT;\n    } catch {\n      return DEFAULT_AI_PROXY_ENDPOINT;\n    }\n  });\n  const [draftEndpoint, setDraftEndpoint] = useState\u003cstring\u003e(endpoint);\n  const [showSettings, setShowSettings] = useState\u003cboolean\u003e(false);\n  const [relayOnline, setRelayOnline] = useState\u003cboolean\u003e(false);\n  const [input, setInput] = useState\u003cstring\u003e('');\n  const [sending, setSending] = useState\u003cboolean\u003e(false);\n  const messagesEndRef = useRef\u003cHTMLDivElement\u003e(null);\n\n  const buildWelcomeMessage = useCallback(\n    (loc: LocaleMode): ChatMessage =\u003e ({\n      id: 'welcome',\n      role: 'assistant',\n      content: tr(\n        loc,\n        `您好！我是 **DentalCAD Pages AI 助手**（支援 \\`ai-proxy\\` 本地 \\`/v1/chat/completions\\` 與 **MCP Pages** 工具）。\\n\\n您可以詢問齒弓測量數據、6-DOF 虛擬咬合器分析、測試覆蓋率（covpages），或直接在對話中控制 3D 檢視器。`,\n        `Hello! I am the **DentalCAD Pages AI Assistant** (powered by local \\`ai-proxy\\` \\`/v1/chat/completions\\` & **MCP Pages** WebMCP tools).\\n\\nAsk me about orthodontic arch metrics, 6-DOF mandibular articulation, test coverage (covpages), or control the 3D CAD viewer directly from chat.`\n      ),\n      actions: [\n        {\n          label: tr(loc, '➕ 一鍵新增到 local ai-proxy', '➕ One-Click Add to local ai-proxy'),\n          type: 'add-mcp',\n          url: MCP_PAGE_CANONICAL_URL,\n        },\n        {\n          label: tr(loc, '🔌 開啟 MCP Page (mcp.html)', '🔌 Open MCP Page (mcp.html)'),\n          type: 'open-mcp',\n          url: 'mcp.html',\n        },\n        {\n          label: tr(loc, '📊 測試覆蓋率 (covpages)', '📊 Coverage Report (covpages)'),\n          type: 'open-covpages',\n          url: 'covpages/',\n        },\n      ],\n    }),\n    []\n  );\n\n  const [messages, setMessages] = useState\u003cChatMessage[]\u003e(() =\u003e [buildWelcomeMessage(locale)]);\n\n  // Probe local ai-proxy status when drawer opens or endpoint changes\n  useEffect(() =\u003e {\n    if (!open) return;\n    let cancelled = false;\n    const controller = new AbortController();\n    const timer = setTimeout(() =\u003e controller.abort(), 1500);\n\n    fetch(`${endpoint.replace(/\\/+$/, '')}/v1/models`, {\n      method: 'GET',\n      signal: controller.signal,\n    })\n      .then((res) =\u003e {\n        if (!cancelled) setRelayOnline(res.ok || res.status === 401 || res.status === 403);\n      })\n      .catch(() =\u003e {\n        if (!cancelled) setRelayOnline(false);\n      })\n      .finally(() =\u003e clearTimeout(timer));\n\n    return () =\u003e {\n      cancelled = true;\n      clearTimeout(timer);\n      controller.abort();\n    };\n  }, [open, endpoint]);\n\n  useEffect(() =\u003e {\n    if (open) {\n      messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });\n    }\n  }, [messages, open]);\n\n  const generateLocalReply = useCallback(\n    (query: string): Omit\u003cChatMessage, 'id'\u003e =\u003e {\n      const q = query.trim().toLowerCase();\n\n      // 1. MCP / ai-proxy / WebMCP questions\n      if (q.includes('mcp') || q.includes('ai-proxy') || q.includes('proxy') || q.includes('claude')) {\n        return {\n          role: 'assistant',\n          content: tr(\n            locale,\n            `本站內建符合 **MCP Pages** 規範的靜態端點 (\\`mcp.html\\`)，透過 \\`navigator.modelContext\\` 註冊 5 項牙科 CAD 工具：\\n- \\`dentalcad_get_overview\\`\\n- \\`dentalcad_list_cases\\`\\n- \\`dentalcad_compute_articulation\\`\\n- \\`dentalcad_analyze_arch_metrics\\`\\n- \\`dentalcad_control_viewer\\`\\n\\nCLI 註冊指令：\\n\\`npx ai-proxy add ${MCP_PAGE_CANONICAL_URL} --name dentalcad\\`\\n\\n[➕ 一鍵新增到 local ai-proxy](action:add-mcp?url=${MCP_PAGE_CANONICAL_URL})`,\n            `This site includes a compliant **MCP Pages** endpoint (\\`mcp.html\\`) registering 5 client-side WebMCP tools on \\`navigator.modelContext\\`:\\n- \\`dentalcad_get_overview\\`\\n- \\`dentalcad_list_cases\\`\\n- \\`dentalcad_compute_articulation\\`\\n- \\`dentalcad_analyze_arch_metrics\\`\\n- \\`dentalcad_control_viewer\\`\\n\\nRegister via CLI:\\n\\`npx ai-proxy add ${MCP_PAGE_CANONICAL_URL} --name dentalcad\\`\\n\\n[➕ One-Click Add to local ai-proxy](action:add-mcp?url=${MCP_PAGE_CANONICAL_URL})`\n          ),\n          actions: [\n            {\n              label: tr(locale, '➕ 一鍵新增到 local ai-proxy', '➕ One-Click Add to local ai-proxy'),\n              type: 'add-mcp',\n              url: MCP_PAGE_CANONICAL_URL,\n            },\n            {\n              label: tr(locale, '🔌 開啟 mcp.html', '🔌 Open mcp.html'),\n              type: 'open-mcp',\n              url: 'mcp.html',\n            },\n          ],\n        };\n      }\n\n      // 2. Coverage / covpages questions\n      if (q.includes('cov') || q.includes('coverage') || q.includes('覆蓋率') || q.includes('測試')) {\n        return {\n          role: 'assistant',\n          content: tr(\n            locale,\n            `本專案整合 **covpages** 產生 GitHub Primer 風格的單元與整合測試覆蓋率報告（支援多 Commit 趨勢圖與 \\`covpages/mcp.html\\` WebMCP 查詢端點）。\\n\\n您可點擊下方按鈕直接開啟覆蓋率報告：`,\n            `This repository integrates **covpages** for GitHub Primer-styled unit & integration test coverage reports (with multi-commit trend graphs and \\`covpages/mcp.html\\` WebMCP tools).\\n\\nClick below to view the live coverage report:`\n          ),\n          actions: [\n            {\n              label: tr(locale, '📊 開啟 covpages 測試覆蓋率報告', '📊 Open covpages Coverage Report'),\n              type: 'open-covpages',\n              url: 'covpages/',\n            },\n          ],\n        };\n      }\n\n      // 3. Occlusogram / Heatmap control intent\n      if (q.includes('heatmap') || q.includes('occlusogram') || q.includes('熱力圖') || q.includes('咬合接觸')) {\n        onApplyViewerControl({ occlusogramEnabled: true });\n        return {\n          role: 'assistant',\n          content: tr(\n            locale,\n            `已為您開啟 **咬合接觸熱力圖 (Occlusogram)**！\\n- 最小咬合間隙：**${occlusogramStats.minClearanceMm.toFixed(2)} mm**\\n- 接觸面積 (\u003c0.5mm)：**${occlusogramStats.contactAreaMm2.toFixed(1)} mm²**\\n- 左右分布：**L ${occlusogramStats.leftContactPercent}% / R ${occlusogramStats.rightContactPercent}%**`,\n            `Enabled the **Occlusogram Contact Heatmap** in the 3D viewport!\\n- Min Clearance: **${occlusogramStats.minClearanceMm.toFixed(2)} mm**\\n- Contact Area (\u003c0.5mm): **${occlusogramStats.contactAreaMm2.toFixed(1)} mm²**\\n- L/R Balance: **L ${occlusogramStats.leftContactPercent}% / R ${occlusogramStats.rightContactPercent}%**`\n          ),\n          actions: [\n            {\n              label: tr(locale, '關閉熱力圖', 'Disable Heatmap'),\n              type: 'viewer-control',\n              control: { occlusogramEnabled: false },\n            },\n          ],\n        };\n      }\n\n      // 4. Protrusion / Articulation Excursion intent\n      if (\n        q.includes('protrus') ||\n        q.includes('articulator') ||\n        q.includes('excursion') ||\n        q.includes('前突') ||\n        q.includes('下顎運動') ||\n        q.includes('咬合器')\n      ) {\n        onApplyViewerControl({ articulationMode: 'protrusion', articulationProgress: 0.6 });\n        return {\n          role: 'assistant',\n          content: tr(\n            locale,\n            `已在 3D 檢視器套用 **6-DOF 下顎前突運動模擬**（模式：前突 \\`protrusion\\`、行程進度 **60%**、髁頭導引角 **${viewportSettings.articulator.condylarGuidanceAngleDeg}°**）。`,\n            `Applied **6-DOF Mandibular Protrusive Excursion** in the 3D viewport (Mode: \\`protrusion\\`, Progress: **60%**, Condylar Guidance **${viewportSettings.articulator.condylarGuidanceAngleDeg}°**).`\n          ),\n          actions: [\n            {\n              label: tr(locale, '重設中心咬合 (CO/MIP)', 'Reset to CO (0%)'),\n              type: 'viewer-control',\n              control: { articulationMode: 'hinge', articulationProgress: 0 },\n            },\n          ],\n        };\n      }\n\n      // 5. Default Clinical & Arch Summary\n      const vendor = activeCase.metadata.scannerVendor || 'Universal IOS';\n      return {\n        role: 'assistant',\n        content: tr(\n          locale,\n          `目前載入病例 **#${activeCase.metadata.orderId}**（掃描設備：\\`${vendor}\\`）的臨床與齒弓摘要：\\n- **齒弓寬度**：U3-U3 尖牙間寬 **${archMetrics.upperIntercanineWidthMm.toFixed(1)} mm** / U6-U6 大臼齒間寬 **${archMetrics.upperIntermolarWidthMm.toFixed(1)} mm**\\n- **前牙關係**：Overjet **${archMetrics.overjetMm.toFixed(1)} mm** · Overbite **${archMetrics.overbiteMm.toFixed(1)} mm**\\n- **最小咬合間隙**：**${occlusogramStats.minClearanceMm.toFixed(2)} mm**（接觸面積 **${occlusogramStats.contactAreaMm2.toFixed(1)} mm²**）\\n- **目前 3D 視角 / 材質**：\\`${cameraPreset}\\` / \\`${viewportSettings.shadingMode}\\``,\n          `Clinical & orthodontic summary for active case **#${activeCase.metadata.orderId}** (Scanner: \\`${vendor}\\`):\\n- **Arch Width**: U3-U3 Intercanine **${archMetrics.upperIntercanineWidthMm.toFixed(1)} mm** / U6-U6 Intermolar **${archMetrics.upperIntermolarWidthMm.toFixed(1)} mm**\\n- **Anterior Relation**: Overjet **${archMetrics.overjetMm.toFixed(1)} mm** · Overbite **${archMetrics.overbiteMm.toFixed(1)} mm**\\n- **Min Occlusal Clearance**: **${occlusogramStats.minClearanceMm.toFixed(2)} mm** (Contact Area **${occlusogramStats.contactAreaMm2.toFixed(1)} mm²**)\\n- **Active Viewport / Shader**: \\`${cameraPreset}\\` / \\`${viewportSettings.shadingMode}\\``\n        ),\n        actions: [\n          {\n            label: tr(locale, '🔥 開啟咬合熱力圖', '🔥 Enable Occlusogram'),\n            type: 'viewer-control',\n            control: { occlusogramEnabled: true },\n          },\n          {\n            label: tr(locale, '🦷 切換石膏材質', '🦷 Switch to Plaster Shader'),\n            type: 'viewer-control',\n            control: { shadingMode: 'plaster' },\n          },\n          {\n            label: tr(locale, '➕ 一鍵新增到 local ai-proxy', '➕ One-Click Add to local ai-proxy'),\n            type: 'add-mcp',\n            url: MCP_PAGE_CANONICAL_URL,\n          },\n        ],\n      };\n    },\n    [\n      activeCase,\n      archMetrics,\n      cameraPreset,\n      locale,\n      occlusogramStats,\n      onApplyViewerControl,\n      viewportSettings.articulator.condylarGuidanceAngleDeg,\n      viewportSettings.shadingMode,\n    ]\n  );\n\n  const handleSend = useCallback(\n    async (promptText?: string) =\u003e {\n      const text = (promptText ?? input).trim();\n      if (!text || sending) return;\n      if (!promptText) setInput('');\n\n      const userMsg: ChatMessage = {\n        id: `user-${Date.now()}`,\n        role: 'user',\n        content: text,\n      };\n      setMessages((prev) =\u003e [...prev, userMsg]);\n      setSending(true);\n\n      // In non-browser / unit test mock environments or when relay is unreachable, generate immediate local reply\n      const isRelayEndpointReachable =\n        typeof window !== 'undefined' &&\n        typeof fetch === 'function' &&\n        !endpoint.includes('127.0.0.1:8788');\n\n      if (!relayOnline && !isRelayEndpointReachable) {\n        const localReply = generateLocalReply(text);\n        setMessages((prev) =\u003e [\n          ...prev,\n          {\n            id: `ai-${Date.now()}`,\n            ...localReply,\n          },\n        ]);\n        setSending(false);\n        return;\n      }\n\n      try {\n        const cleanEndpoint = endpoint.replace(/\\/+$/, '');\n        const controller = new AbortController();\n        const timer = setTimeout(() =\u003e controller.abort(), 8000);\n\n        const systemPrompt = [\n          'You are the DentalCAD Pages AI Assistant integrated with ai-proxy and MCP Pages.',\n          `Active Case Order ID: ${activeCase.metadata.orderId}`,\n          `Scanner Vendor: ${activeCase.metadata.scannerVendor || 'Universal IOS'}`,\n          `Arch Width: U3-U3: ${archMetrics.upperIntercanineWidthMm}mm, U6-U6: ${archMetrics.upperIntermolarWidthMm}mm, Overjet: ${archMetrics.overjetMm}mm, Overbite: ${archMetrics.overbiteMm}mm`,\n          `Occlusogram Min Clearance: ${occlusogramStats.minClearanceMm}mm, Contact Area: ${occlusogramStats.contactAreaMm2}mm2`,\n          `MCP Page URL: ${MCP_PAGE_CANONICAL_URL}`,\n        ].join('\\n');\n\n        const res = await fetch(`${cleanEndpoint}/v1/chat/completions`, {\n          method: 'POST',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify({\n            model: 'auto',\n            messages: [\n              { role: 'system', content: systemPrompt },\n              { role: 'user', content: text },\n            ],\n          }),\n          signal: controller.signal,\n        });\n        clearTimeout(timer);\n\n        if (res.ok) {\n          const data = await res.json();\n          const replyText =\n            data?.choices?.[0]?.message?.content ||\n            data?.reply ||\n            generateLocalReply(text).content;\n          setRelayOnline(true);\n          setMessages((prev) =\u003e [\n            ...prev,\n            {\n              id: `ai-${Date.now()}`,\n              role: 'assistant',\n              content: String(replyText),\n              actions: [\n                {\n                  label: tr(locale, '➕ 一鍵新增到 local ai-proxy', '➕ One-Click Add to local ai-proxy'),\n                  type: 'add-mcp',\n                  url: MCP_PAGE_CANONICAL_URL,\n                },\n              ],\n            },\n          ]);\n          setSending(false);\n          return;\n        }\n      } catch {\n        setRelayOnline(false);\n      }\n\n      // Fallback to local smart DentalCAD & WebMCP assistant\n      const localReply = generateLocalReply(text);\n      setMessages((prev) =\u003e [\n        ...prev,\n        {\n          id: `ai-${Date.now()}`,\n          ...localReply,\n        },\n      ]);\n      setSending(false);\n    },\n    [\n      input,\n      sending,\n      endpoint,\n      activeCase,\n      archMetrics,\n      occlusogramStats,\n      generateLocalReply,\n      locale,\n    ]\n  );\n\n  const handleActionClick = (\n    action: NonNullable\u003cChatMessage['actions']\u003e[number]\n  ) =\u003e {\n    if (action.type === 'add-mcp') {\n      const targetUrl = action.url || MCP_PAGE_CANONICAL_URL;\n      const dashUrl = `https://yongjhih.github.io/ai-proxy/dashboard#add-url=${encodeURIComponent(\n        targetUrl\n      )}`;\n      window.open(dashUrl, '_blank', 'noopener,noreferrer');\n    } else if (action.type === 'open-mcp') {\n      window.open(action.url || 'mcp.html', '_blank', 'noopener,noreferrer');\n    } else if (action.type === 'open-covpages') {\n      window.open(action.url || 'covpages/', '_blank', 'noopener,noreferrer');\n    } else if (action.type === 'viewer-control' && action.control) {\n      onApplyViewerControl(action.control);\n    }\n  };\n\n  if (!open) return null;\n\n  return (\n    \u003caside\n      data-testid=\"ask-ai-drawer\"\n      aria-label=\"Ask AI Assistant\"\n      className=\"fixed inset-y-0 right-0 z-50 w-full max-w-md bg-white dark:bg-[#0b111e] border-l border-slate-200 dark:border-slate-800 shadow-2xl flex flex-col transition-all\"\n    \u003e\n      {/* Header */}\n      \u003cdiv className=\"flex items-center justify-between px-4 py-3 border-b border-slate-200 dark:border-slate-800 bg-slate-50/80 dark:bg-[#090d16]\"\u003e\n        \u003cdiv className=\"flex items-center gap-2 min-w-0\"\u003e\n          \u003cspan\n            data-testid=\"ask-ai-status-dot\"\n            title={\n              relayOnline\n                ? tr(locale, '已連接 local ai-proxy (/v1)', 'Connected to local ai-proxy (/v1)')\n                : tr(\n                    locale,\n                    '內建智慧助手模式 (可啟動 npx ai-proxy serve 連接本機 LLM)',\n                    'Built-in Smart Assistant (run npx ai-proxy serve for local LLM)'\n                  )\n            }\n            className={`w-2.5 h-2.5 rounded-full flex-shrink-0 ${\n              relayOnline\n                ? 'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]'\n                : 'bg-sky-500 shadow-[0_0_8px_rgba(14,165,233,0.6)]'\n            }`}\n          /\u003e\n          \u003cSparkles className=\"w-4 h-4 text-sky-500 flex-shrink-0\" /\u003e\n          \u003ch2 className=\"text-sm font-bold text-slate-900 dark:text-white truncate\"\u003e\n            {tr(locale, 'Ask AI · 牙科 CAD 與 MCP 助手', 'Ask AI · DentalCAD & MCP Assistant')}\n          \u003c/h2\u003e\n        \u003c/div\u003e\n\n        \u003cdiv className=\"flex items-center gap-1 flex-shrink-0\"\u003e\n          \u003cbutton\n            type=\"button\"\n            data-testid=\"ask-ai-settings-toggle\"\n            onClick={() =\u003e setShowSettings((v) =\u003e !v)}\n            className=\"p-1.5 rounded-lg text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-200/60 dark:hover:bg-slate-800 transition-colors\"\n            title={tr(locale, '設定 ai-proxy 端點', 'Configure ai-proxy Endpoint')}\n          \u003e\n            \u003cSettings className=\"w-4 h-4\" /\u003e\n          \u003c/button\u003e\n          \u003cbutton\n            type=\"button\"\n            data-testid=\"ask-ai-clear-btn\"\n            onClick={() =\u003e setMessages([buildWelcomeMessage(locale)])}\n            className=\"p-1.5 rounded-lg text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-200/60 dark:hover:bg-slate-800 transition-colors\"\n            title={tr(locale, '清除對話', 'Clear Chat')}\n          \u003e\n            \u003cTrash2 className=\"w-4 h-4\" /\u003e\n          \u003c/button\u003e\n          \u003cbutton\n            type=\"button\"\n            data-testid=\"ask-ai-close-btn\"\n            onClick={onClose}\n            className=\"p-1.5 rounded-lg text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-200/60 dark:hover:bg-slate-800 transition-colors\"\n            title={tr(locale, '關閉', 'Close')}\n          \u003e\n            \u003cX className=\"w-4 h-4\" /\u003e\n          \u003c/button\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      {/* Collapsible ai-proxy Settings Panel */}\n      {showSettings && (\n        \u003cdiv\n          data-testid=\" ":0}],"sourceCode":"import React, { useRef } from 'react';\nimport { ViewportSettings, ShadingMode, DentalCaseBundle, LocaleMode } from '../types/dental';\nimport { getDisplayMetadata } from '../utils/anonymize';\nimport { tr } from '../utils/i18n';\nimport {\n  Scissors,\n  Palette,\n  RotateCw,\n  Upload,\n  FolderOpen,\n  Sparkles,\n  Grid,\n  Database,\n  Trash2,\n  Image as ImageIcon,\n} from 'lucide-react';\n\ninterface CadToolsPanelProps {\n  settings: ViewportSettings;\n  onSettingsChange: (settings: ViewportSettings) =\u003e void;\n  onCustomFilesSelected: (upper?: File, lower?: File) =\u003e void;\n  onImportCaseFiles?: (files: FileList) =\u003e void;\n  cases?: DentalCaseBundle[];\n  activeCaseId?: string;\n  onSelectCase?: (caseId: string) =\u003e void;\n  onDeleteCustomCase?: (caseId: string) =\u003e void;\n  anonymizePatient?: boolean;\n  locale?: LocaleMode;\n}\n\nexport const CadToolsPanel: React.FC\u003cCadToolsPanelProps\u003e = ({\n  settings,\n  onSettingsChange,\n  onCustomFilesSelected,\n  onImportCaseFiles,\n  cases = [],\n  activeCaseId,\n  onSelectCase,\n  onDeleteCustomCase,\n  anonymizePatient = true,\n  locale = 'en',\n}) =\u003e {\n  const upperFileInputRef = useRef\u003cHTMLInputElement\u003e(null);\n  const lowerFileInputRef = useRef\u003cHTMLInputElement\u003e(null);\n  const bundleInputRef = useRef\u003cHTMLInputElement\u003e(null);\n\n  const customCases = cases.filter((c) =\u003e c.source === 'custom');\n\n  const shadingModes: { id: ShadingMode; name: string; desc: string }[] = [\n    {\n      id: 'enamel',\n      name: tr(locale, '臨床琺瑯質 (Enamel)', 'Clinical Enamel'),\n      desc: tr(\n        locale,\n        '真實牙科光學折射 (IOR 1.55)，帶有細緻清漆與微透珠光。',\n        'Physical dental enamel refraction (IOR 1.55) with clearcoat and subtle subsurface sheen.'\n      ),\n    },\n    {\n      id: 'plaster',\n      name: tr(locale, '石膏模型 (Plaster)', 'Dental Stone (Plaster)'),\n      desc: tr(\n        locale,\n        '啞光高漫射白石膏模型，適合清楚觀察齒列窩溝與形態學特徵。',\n        'High-diffuse matte orthodontic stone model for inspecting occlusal grooves and cusp morphology.'\n      ),\n    },\n    {\n      id: 'normal',\n      name: tr(locale, '法向量圖 (Normals)', 'Surface Normals'),\n      desc: tr(\n        locale,\n        '以 RGB 色彩對應幾何面法線方向，利於檢視曲面平滑度與咬合斜面。',\n        'Maps XYZ surface normals to RGB colors to inspect curvature smoothness and cusp inclines.'\n      ),\n    },\n    {\n      id: 'wireframe',\n      name: tr(locale, '拓撲線框 (Wireframe)', 'Topology Wireframe'),\n      desc: tr(\n        locale,\n        '顯示原始 3D 網格三角形拓撲分佈與密度 (Triangle Mesh)。',\n        'Displays raw 3D triangle mesh topology and vertex density.'\n      ),\n    },\n    {\n      id: 'translucent',\n      name: tr(locale, '半透明 X 光 (Translucent)', 'Translucent X-Ray'),\n      desc: tr(\n        locale,\n        '半透明透視效果，便於分析上下牙弓內外側重疊與牙齒長軸。',\n        'Semi-transparent optical shader for analyzing internal overbite/overjet overlap.'\n      ),\n    },\n  ];\n\n  return (\n    \u003cdiv className=\"space-y-6 text-xs text-slate-700 dark:text-slate-300\"\u003e\n      {/* 5-View Photo Texture Mapping Section */}\n      \u003cdiv className=\"space-y-3\"\u003e\n        \u003ch2 className=\"text-base font-semibold text-slate-900 dark:text-slate-100 flex items-center gap-2\"\u003e\n          \u003cImageIcon className=\"w-4 h-4 text-sky-500 dark:text-sky-400\" /\u003e\n          \u003cspan\u003e\n            {tr(\n              locale,\n              '五方攝影照片貼圖渲染 (Photo Texture Mapping)',\n              '5-View Photo Texture Projection'\n            )}\n          \u003c/span\u003e\n        \u003c/h2\u003e\n\n        \u003cdiv className=\"bg-white dark:bg-[#0b0f17] border border-slate-200 dark:border-slate-800 p-3 rounded-lg flex items-center justify-between gap-3 shadow-sm dark:shadow-none\"\u003e\n          \u003cdiv className=\"space-y-0.5\"\u003e\n            \u003cspan className=\"font-medium text-slate-900 dark:text-slate-200\"\u003e\n              {tr(\n                locale,\n                '多視角正交投影貼圖 (Multi-View Projection)',\n                'Multi-View Orthographic Texture Projection'\n              )}\n            \u003c/span\u003e\n            \u003cp className=\"text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed\"\u003e\n              {tr(\n                locale,\n                '將正視、上顎、下顎、左右頰面共 5 張臨床照片依據法向量權重自動貼合渲染至 3D STL 齒列模型上。',\n                'Automatically blends 5 clinical intraoral photos (frontal, upper, lower, left & right buccal) onto the 3D STL dental arches by surface normal weights.'\n              )}\n            \u003c/p\u003e\n          \u003c/div\u003e\n          \u003cbutton\n            data-testid=\"tools-photo-texture-btn\"\n            onClick={() =\u003e\n              onSettingsChange({\n                ...settings,\n                photoTextureMapped: !settings.photoTextureMapped,\n              })\n            }\n            className={`px-3 py-1.5 rounded text-xs font-medium transition-colors border flex-shrink-0 ${\n              settings.photoTextureMapped\n                ? 'bg-sky-500 border-sky-600 text-white shadow-sm'\n                : 'bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200'\n            }`}\n          \u003e\n            {settings.photoTextureMapped\n              ? tr(locale, '已開啟貼圖', 'Texture ON')\n              : tr(locale, '開啟貼圖', 'Enable Texture')}\n          \u003c/button\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      {/* Dental Shading Modes */}\n      \u003cdiv className=\"space-y-3 pt-2 border-t border-slate-200 dark:border-slate-800/80\"\u003e\n        \u003ch2 className=\"text-base font-semibold text-slate-900 dark:text-slate-100 flex items-center gap-2\"\u003e\n          \u003cPalette className=\"w-4 h-4 text-sky-500 dark:text-sky-400\" /\u003e\n          \u003cspan\u003e{tr(locale, '幾何材質與光學渲染 (Shaders)', 'Surface Shaders & Optical Materials')}\u003c/span\u003e\n        \u003c/h2\u003e\n        \u003cdiv className=\"space-y-2\"\u003e\n          {shadingModes.map((mode) =\u003e (\n            \u003clabel\n              key={mode.id}\n              onClick={() =\u003e\n                onSettingsChange({\n                  ...settings,\n                  photoTextureMapped: false,\n                  shadingMode: mode.id,\n                })\n              }\n              className={`flex items-start gap-3 p-2.5 rounded-lg border cursor-pointer transition-colors ${\n                !settings.photoTextureMapped && settings.shadingMode === mode.id\n                  ? 'bg-sky-500/10 dark:bg-sky-950/40 border-sky-500/60 text-slate-900 dark:text-slate-200'\n                  : 'bg-white dark:bg-[#0b0f17] border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 text-slate-500 dark:text-slate-400'\n              }`}\n            \u003e\n              \u003cinput\n                type=\"radio\"\n                name=\"shadingMode\"\n                checked={!settings.photoTextureMapped && settings.shadingMode === mode.id}\n                onChange={() =\u003e\n                  onSettingsChange({\n                    ...settings,\n                    photoTextureMapped: false,\n                    shadingMode: mode.id,\n                  })\n                }\n                className=\"mt-0.5 accent-sky-500\"\n              /\u003e\n              \u003cdiv className=\"space-y-0.5\"\u003e\n                \u003cp className=\"font-medium text-slate-900 dark:text-slate-200\"\u003e{mode.name}\u003c/p\u003e\n                \u003cp className=\"text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed\"\u003e\n                  {mode.desc}\n                \u003c/p\u003e\n              \u003c/div\u003e\n            \u003c/label\u003e\n          ))}\n        \u003c/div\u003e\n\n        {/* Arch Color Distinction Toggle */}\n        \u003cdiv className=\"bg-white dark:bg-[#0b0f17] border border-slate-200 dark:border-slate-800 p-3 rounded-lg flex items-center justify-between shadow-sm dark:shadow-none\"\u003e\n          \u003cdiv className=\"space-y-0.5\"\u003e\n            \u003cspan className=\"font-medium text-slate-900 dark:text-slate-200 flex items-center gap-1.5\"\u003e\n              \u003cSparkles className=\"w-3.5 h-3.5 text-amber-500 dark:text-amber-400\" /\u003e\n              {tr(locale, '上下顎色彩區隔 (Arch Distinction)', 'Maxilla / Mandible Color Distinction')}\n            \u003c/span\u003e\n            \u003cp className=\"text-[11px] text-slate-500 dark:text-slate-400\"\u003e\n              {tr(\n                locale,\n                '分別賦予上顎溫潤白與下顎微冷白色調，利於辨別咬合接觸邊界。',\n                'Applies distinct warm/cool tints to upper and lower arches to clarify occlusal boundaries.'\n              )}\n            \u003c/p\u003e\n          \u003c/div\u003e\n          \u003cbutton\n            onClick={() =\u003e\n              onSettingsChange({\n                ...settings,\n                archDistinction: !settings.archDistinction,\n              })\n            }\n            className={`px-3 py-1 rounded text-xs font-medium transition-colors border ${\n              settings.archDistinction\n                ? 'bg-sky-600 border-sky-500 text-white'\n                : 'bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-400'\n            }`}\n          \u003e\n            {settings.archDistinction\n              ? tr(locale, '已啟用', 'Enabled')\n              : tr(locale, '停用', 'Disabled')}\n          \u003c/button\u003e\n        \u003c/div\u003e\n\n        {/* Wireframe Overlay Checkbox */}\n        \u003cdiv className=\"bg-white dark:bg-[#0b0f17] border border-slate-200 dark:border-slate-800 p-3 rounded-lg flex items-center justify-between shadow-sm dark:shadow-none\"\u003e\n          \u003cdiv className=\"space-y-0.5\"\u003e\n            \u003cspan className=\"font-me     \u003cdiv className=\"grid grid-cols-3 p-2.5\"\u003e\n            \u003cspan className=\"text-slate-500\"\u003e{tr(locale, '比色系統', 'Shade System')}\u003c/span\u003e\n            \u003cspan className=\"col-span-2 text-slate-800 dark:text-slate-200 font-mono\"\u003e\n              {metadata.toothShadeSystem}\n            \u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv className=\"grid grid-cols-3 p-2.5\"\u003e\n            \u003cspan className=\"text-slate-500\"\u003e{tr(locale, '掃描日期 / 匯出', 'Scan / Export Time')}\u003c/span\u003e\n            \u003cdiv className=\"col-span-2 font-mono text-[11px] text-slate-700 dark:text-slate-300 tabular-nums\"\u003e\n              \u003cp\u003e\n                {tr(locale, '掃描', 'Scan')}: {metadata.scanDate}\n              \u003c/p\u003e\n              \u003cp className=\"text-slate-500 dark:text-slate-400\"\u003e\n                {tr(locale, '匯出', 'Export')}: {metadata.exportTime}\n              \u003c/p\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n          \u003cdiv className=\"grid grid-cols-3 p-2.5\"\u003e\n            \u003cspan className=\"text-slate-500\"\u003e{tr(locale, '系統與掃描儀版本', 'Scanner & CAD Version')}\u003c/span\u003e\n            \u003cspan className=\"col-span-2 text-slate-700 dark:text-slate-300 font-mono text-[11px]\"\u003e\n              Scanner v{metadata.scannerVersion} / CAD v{metadata.caasVersion}\n            \u003c/span\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      {/* 3. Raw Files & Documentation Links */}\n      {(assets.rxPdfUrl || assets.rxHtmlUrl) && (\n        \u003cdiv className=\"space-y-2 pt-2 border-t border-slate-200 dark:border-slate-800/80\"\u003e\n          \u003ch3 className=\"text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider\"\u003e\n            {tr(locale, '相關檔案與原始報告', 'Associated Files & Reports')}\n          \u003c/h3\u003e\n          \u003cdiv className=\"flex flex- from '../utils/occlusogram';\nimport { computeOrthoArchMetrics } from '../utils/archMeasurements';\nimport { createProceduralDentalArchGeometry } from '../utils/proceduralArch';\nimport {\n  Maximize2,\n  Minimize2,\n  Camera,\n  RotateCcw,\n  Layers,\n  Eye,\n  EyeOff,\n  Compass,\n  Upload,\n  AlertCircle,\n  Image as ImageIcon,\n  Play,\n  Pause,\n  Flame,\n  Ruler,\n  Trash2,\n  ChevronDown,\n  ChevronUp,\n} from 'lucide-react';\n\ninterface DentalViewer3DProps {\n  upperStlUrl: string;\n  lowerStlUrl: string;\n  photos: ClinicalPhoto[];\n  theme: ThemeMode;\n  settings: ViewportSettings;\n  onSettingsChange: React.Dispatch\u003cReact.SetStateAction\u003cViewportSettings\u003e\u003e;\n  activePreset: CameraPreset;\n  onPresetSelect: (preset: CameraPreset) =\u003e void;\n  onMeshStatsComputed?: (stats: MeshGeometryStats) =\u003e void;\n  onOcclusogramStatsComputed?: (stats: OcclusogramStats) =\u003e void;\n  onArchMetricsComputed?: (metrics: OrthoArchMetrics) =\u003e void;\n  caliperMeasurements?: CaliperMeasurement[];\n  onAddCaliperMeasurement?: (pointA: Point3D, pointB: Point3D) =\u003e void;\n  onClearCaliperMeasurements?: () =\u003e void;\n  onCustomFilesDrop?: (files: FileList) =\u003e void;\n  locale?: LocaleMode;\n}\n\nexport const DentalViewer3D: React.FC\u003cDentalViewer3DProps\u003e = ({\n  upperStlUrl,\n  lowerStlUrl,\n  photos,\n  theme,\n  settings,\n  onSettingsChange,\n  activePreset,\n  onPresetSelect,\n  onMeshStatsComputed,\n  onOcclusogramStatsComputed,\n  onArchMetricsComputed,\n  caliperMeasurements = [],\n  onAddCaliperMeasurement,\n  onClearCaliperMeasurements,\n  onCustomFilesDrop,\n  locale = 'en',\n}) =\u003e {\n  const containerRef = useRef\u003cHTMLDivElement\u003e(null);\n  const rendererRef = useRef\u003cTHREE.WebGLRenderer | null\u003e(null);\n  const sceneRef = useRef\u003cTHREE.Scene | null\u003e(null);\n  const cameraRef = useRef\u003cTHREE.PerspectiveCamera | null\u003e(null);\n  const controlsRef = useRef\u003cOrbitControls | null\u003e(null);\n  const gridHelperRef = useRef\u003cTHREE.GridHelper | null\u003e(null);\n\n  // Mesh & BoundingBox refs\n  const upperMeshRef = useRef\u003cTHREE.Mesh | null\u003e(null);\n  const lowerMeshRef = useRef\u003cTHREE.Mesh | null\u003e(null);\n  const upperBoxRef = useRef\u003cTHREE.Box3\u003e(\n    new THREE.Box3(new THREE.Vector3(-32, -47, -2), new THREE.Vector3(35, 4, 18))\n  );\n  const lowerBoxRef = useRef\u003cTHREE.Box3\u003e(\n    new THREE.Box3(new THREE.Vector3(-32, -44, -16), new THREE.Vector3(33, 11, 7))\n  );\n  const combinedBoxRef = useRef\u003cTHREE.Box3\u003e(\n    new THREE.Box3(new THREE.Vector3(-32, -47, -16), new THREE.Vector3(35, 11, 18))\n  );\n  const pentaTexturesRef = useRef\u003cLoadedPentaTextures | null\u003e(null);\n  const clippingPlaneRef = useRef\u003cTHREE.Plane | null\u003e(null);\n\n  // Occlusogram Elevation Maps & DataTextures\n  const upperElevationMapRef = useRef\u003cOcclusalElevationMap | null\u003e(null);\n  const lowerElevationMapRef = useRef\u003cOcclusalElevationMap | null\u003e(null);\n  const upperElevationTexRef = useRef\u003cTHREE.DataTexture | null\u003e(null);\n  const lowerElevationTexRef = useRef\u003cTHREE.DataTexture | null\u003e(null);\n  const upperOccUpdaterRef = useRef\u003c\n    ((lMat: THREE.Matrix4, lInv: THREE.Matrix4, uZ: number, maxR: number) =\u003e void) | null\n  \u003e(null);\n  const lowerOccUpdaterRef = useRef\u003c\n    ((lMat: THREE.Matrix4, lInv: THREE.Matrix4, uZ: number, maxR: number) =\u003e void) | null\n  \u003e(null);\n\n  // 3D Articulator Trajectory & Caliper Gizmo Groups\n  const trajectoryGroupRef = useRef\u003cTHREE.Group | null\u003e(null);\n  const caliperGroupRef = useRef\u003cTHREE.Group | null\u003e(null);\n  const pendingCaliperPointRef = useRef\u003cPoint3D | null\u003e(null);\n  const [pendingCaliperPoint, setPendingCaliperPoint] = useState\u003cPoint3D | null\u003e(null);\n\n  // Animation & Lerp\n  const animFrameIdRef = useRef\u003cnumber | null\u003e(nul     prev.left?.dispose();\n      pentaTexturesRef.current = null;\n    }\n    setTextureRevision((r) =\u003e r + 1);\n\n    if (!photos || photos.length === 0) {\n      return () =\u003e {\n        cancelled = true;\n      };\n    }\n\n    loadPentaViewTextures(photos).then((loaded) =\u003e {\n      if (cancelled) return;\n      pentaTexturesRef.current = loaded;\n      setTextureRevision((r) =\u003e r + 1);\n    });\n    return () =\u003e {\n      cancelled = true;\n    };\n  }, [photos]);\n\n  // Articulator Playback Loop (smoothly advances articulator.progress when isPlaying is true)\n  useEffect(() =\u003e {\n    if (!settings.articulator.isPlaying) return;\n\n    let lastTime = performance.now();\n    let rafId = 0;\n    let direction = 1;\n\n    const stepPlayback = (now: number) =\u003e {\n      const dt = (now - lastTime) / 1000;\n      lastTime = now;\n\n      onSettingsChange((prev) =\u003e {\n        if (!prev.articulator.isPlaying) return prev;\n        const speed = prev.articulator.playbackSpeed * 0.42;\n        let nextP = prev.articulator.progress + dt * speed * direction;\n\n        if (prev.articulator.mode === 'chewing') {\n          // Continuous loop 0 -\u003e 1 -\u003e 0\n          if (nextP \u003e 1) nextP -= 1;\n        } else {\n          // Ping-pong opening and closing\n          if (nextP \u003e= 1) {\n            nextP = 1;\n            direction = -1;\n          } else if (nextP \u003c= 0) {\n            nextP = 0;\n            direction = 1;\n          }\n        }\n\n        const rounded = Number(nextP.toFixed(3));\n        return {\n          ...prev,\n          occlusionSeparation: Math.round(rounded * 35),\n          articulator: {\n            ...prev.articulator,\n            progress: rounded,\n          },\n        };\n      });\n\n      rafId = requestAnimationFrame(stepPlayback);\n    };\n\n    rafId = requestAnimationFrame(stepPlayback);\n    return () =\u003e cancelAnimationFrame(rafId);\n  }, [settings.articulator.isPlaying, onSettingsChange]);\n\n  // Build Material based on settings, Occlusogram state & loaded 5-view textures\n  const createDentalMaterial = useCallback(\n    (isUpper: boolean) =\u003e {\n      const {\n        shadingMode,\n        photoTextureMapped,\n        occlusogramEnabled,\n        occlusogramMaxRangeMm,\n        archDistinction,\n        wireframeOverlay,\n        clippingEnabled,\n      } = settings;\n      const clippingPlanes =\n        clippingEnabled && clippingPlaneRef.current ? [clippingPlaneRef.current] : [];\n\n      if (isUpper) {\n        upperOccUpdaterRef.current = null;\n      } else {\n        lowerOccUpdaterRef.current = null;\n      }\n\n      // Priority 1: Occlusogram Real-time Bite Contact Heatmap\n      if (\n        occlusogramEnabled &&\n        upperElevationTexRef.current &&\n        lowerElevationTexRef.current\n      ) {\n        const lowerMat = new THREE.Matrix4().fromArray(currentKinematics.lowerMatrixElements);\n        const lowerInvMat = new THREE.Matrix4().fromArray(\n          currentKinematics.lowerInverseMatrixElements\n        );\n        const opposingTex = isUpper\n          ? lowerElevationTexRef.current\n          : upperElevationTexRef.current;\n\n        const { material, updateKinematicsUniforms } = createOcclusogramMaterial({\n          isUpper,\n          opposingElevationTex: opposingTex,\n          bounds: DEFAULT_OCCLUSAL_BOUNDS,\n          maxRangeMm: occlusogramMaxRangeMm,\n          lowerMatrix: lowerMat,\n          lowerInverseMatrix: lowerInvMat,\n          upperZOffset: currentKinematics.upperPosition.z,\n          wireframe: wireframeOverlay || shadingMode === 'wireframe',\n          clippingPlanes,\n        });\n\n        if (isUpper) {\n          upperOccUpdaterRef.current = updateKinematicsUniforms;\n        } else {\n          lowerOccUpdaterRef.current = updateKinematicsUniforms;\n        }\n        return material;\n      }\n\n      // Priority 2: 5-view photo texture projection (only when active case has photos and at least 1 texture loaded)\n      const hasAnyPentaTexture = Boolean(\n        photos.length \u003e 0 &&\n          pentaTexturesRef.current &&\n          (pentaTexturesRef.current.front ||\n            pentaTexturesRef.current.upper ||\n            pentaTexturesRef.current.lower ||\n            pentaTexturesRef.current.right ||\n            pentaTexturesRef.current.left)\n      );\n      if (photoTextureMapped && hasAnyPentaTexture && pentaTexturesRef.current) {\n        return createPentaTexturedMaterial({\n          isUpper,\n          textures: pentaTexturesRef.current,\n          archBox: isUpper ? upperBoxRef.current : lowerBoxRef.current,\n          combinedBox: combinedBoxRef.current,\n          wireframe: wireframeOverlay || shadingMode === 'wireframe',\n          clippingPlanes,\n        });\n      }\n\n      if (shadingMode === 'normal') {\n        const mat = new THREE.MeshNormalMaterial({\n          side: THREE.DoubleSide,\n          wireframe: wireframeOverlay,\n        });\n        mat.clippingPlanes = clippingPlanes;\n        return mat;\n      }\n\n      if (shadingMode === 'wireframe') {\n        const color = isUpper ? 0x0284c7 : 0x6366f1;\n        const mat = new THREE.MeshBasicMaterial({\n          color,\n          wireframe: true,\n        });\n        mat.clippingPlanes = clippingPlanes;\n        return mat;\n      }\n\n      if (shadingMode === 'translucent') {\n        const color = isUpper\n          ? archDistinction\n            ? 0xbae6fd\n            : 0xe2e8f0\n          : archDistinction\n          ? 0xbfdbfe\n          : 0xe2e8f0;\n        const mat = new THREE.MeshPhysicalMaterial({\n          color,\n          roughness: 0.15,\n          transmission: 0.65,\n          opacity: 0.6,\n          transparent: true,\n          ior: 1.45,\n          side: THREE.DoubleSide,\n          wireframe: wireframeOverlay,\n        });\n        mat.clippingPlanes = clippingPlanes;\n        return mat;\n      }\n\n      if (s
