003c/span\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003cdiv className=\"h-4 w-px bg-slate-200 dark:bg-slate-800 hidden sm:block flex-shrink-0\" /\u003e\n\n        {/* Case Switcher Dropdown (Focused on Order ID & Procedure, not Patient Name) */}\n        \u003cdiv className=\"relative flex items-center min-w-0 flex-1 max-w-[140px] sm:max-w-[220px] md:max-w-xs\"\u003e\n          \u003cselect\n            aria-label={tr(locale, '選擇臨床案例', 'Select clinical case')}\n            value={activeCase.id}\n            onChange={(e) =\u003e onSelectCase(e.target.value)}\n            className=\"appearance-none w-full min-w-0 truncate bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 hover:border-slate-400 dark:hover:border-slate-700 text-xs text-slate-800 dark:text-slate-200 font-mono rounded pl-2 pr-5 py-1 cursor-pointer transition-colors tabular-nums\"\n          \u003e\n            {cases.map((c) =\u003e (\n              \u003coption key={c.id} value={c.id}\u003e\n                #{c.metadata.orderId} · {c.metadata.procedure}\n              \u003c/option\u003e\n            ))}\n          \u003c/select\u003e\n          \u003cChevronDown className=\"w-3.5 h-3.5 text-slate-500 dark:text-slate-400 pointer-events-none absolute right-1\" /\u003e\n        \u003c/div\u003e\n\n        \u003cdiv className=\"hidden xl:flex items-center space-x-1.5 flex-shrink-0\"\u003e\n          \u003cspan className=\"px-2 py-0.5 rounded bg-sky-500/15 dark:bg-sky-950/70 text-sky-700 dark:text-sky-300 border border-sky-500/30 dark:border-sky-800/60 text-[11px] font-medium\"\u003e\n            {displayMeta.procedureType}\n          \u003c/span\u003e\n          \u003cspan className=\"px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700/60 text-[11px]\"\u003e\n            {tr(locale, '掃描', 'Scan')}: {displayMeta.scanDate}\n          \u003c/span\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      {/* Actions: Clear Saved (when custom), Load, Anonymize Toggle, PDF, Locale, Theme & GitHub */}\n      \u003cdiv className=\"flex items-center gap-1 sm:gap-1.5 flex-shrink-0 ml-auto\"\u003e\n        {activeCase.source === 'custom' && onDeleteCustomCase && (\n          \u003cbutton\n            type=\"button\"\n            data-testid=\"header-clear-saved-btn\"\n            onClick={() =\u003e onDeleteCustomCase(activeCase.id)}\n            className=\"flex items-center gap-1 px-2 py-1 rounded text-xs bg-red-100 dark:bg-red-950/50 hover:bg-red-200 dark:hover:bg-red-900/70 border border-red-300 dark:border-red-800/60 text-red-600 dark:text-red-300 transition-colors whitespace-nowrap flex-shrink-0\"\n            title={tr(locale, '清除此案例存檔', 'Clear saved case')}\n          \u003e\n            \u003cTrash2 className=\"w-3.5 h-3.5 flex-shrink-0\" /\u003e\n            \u003cspan\u003e{tr(locale, '清除存檔', 'Clear Saved')}\u003c/span\u003e\n          \u003c/button\u003e\n        )}\n        {/* Load External Case Bundle Button (Mobile-friendly with visible label) */}\n        \u003cinput\n          ref={bundleInputRef}\n          data-testid=\"header-file-input\"\n          type=\"file\"\n          multiple\n          accept=\".zip,.stl,.xml,.jpg,.jpeg,.png,.pdf,.html,application/zip,application/x-zip-compressed,model/stl,application/sla,application/vnd.ms-pki.stl,application/octet-stream,image/*,application/pdf,text/xml,application/xml\"\n          className=\"hidden\"\n          onChange={(e) =\u003e {\n            if (e.target.files && e.target.files.length \u003e 0) {\n              onImportCaseFiles(e.target.files);\n              e.target.value = '';\n            }\n          }}\n        /\u003e\n        \u003cbutton\n          type=\"button\"\n          data-testid=\"header-upload-btn\"\n          onClick={() =\u003e bundleInputRef.current?.click()}\n          className=\"flex items-center space-x-1.5 px-2.5 py-1.5 sm:py-1 rounded text-xs bg-sky-600 hover:bg-sky-500 text-white shadow-sm transition-colors font-medium\"\n          title={tr(\n            locale,\n            '選擇 .zip 壓縮檔或 STL / XML / JPG / PDF 口掃檔案加載',\n            'Load .zip archive or STL / XML / JPG / PDF scanner files'\n          )}\n        \u003e\n          \u003cUpload className=\"w-3.5 h-3.5 flex-shrink-0\" /\u003e\n          \u003cspan\u003e{tr(locale, '加載', 'Load')}\u003c/span\u003e\n        \u003c/button\u003e\n\n        {/* Privacy Anonymize Toggle (Default Active) */}\n        \u003cbutton\n          type=\"button\"\n          data-testid=\"header-privacy-toggle-btn\"\n          onClick={onToggleAnonymize}\n          className={`flex items-center space-x-1 sm:space-x-1.5 px-2 sm:px-2.5 py-1 rounded text-xs transition-colors border ${\n            anonymizePatient\n              ? 'bg-amber-500/15 dark:bg-amber-950/50 border-amber-500/40 dark:border-amber-800/60 text-amber-800 dark:text-amber-300 hover:bg-amber-500/25 dark:hover:bg-amber-900/60'\n              : 'bg-slate-100 dark:bg-slate-900 border-slate-300 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:text-slate-950 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-slate-800'\n          }`}\n          title={\n            anonymizePatient\n              ? tr(\n                  locale,\n                  '目前為匿名保護模式（已遮罩病患、醫師與醫療機構名稱），點擊可顯示完整資訊',\n                  'Privacy protection active (patient, doctor & clinic masked). Click to show raw info.'\n                )\n              : tr(\n                  locale,\n                  '點擊開啟匿名保護模式（遮罩病患、醫師與醫療機構名稱）',\n                  'Click to enable privacy protection (mask patient, doctor & clinic names)'\n                )\n          }\n        \u003e\n          {anonymizePatient ? (\n            \u003cShieldAlert className=\"w-3.5 h-3.5 text-amber-600 dark:text-amber-400\" /\u003e\n          ) : (\n            \u003cShield className=\"w-3.5 h-3.5 text-slate-500 dark:text-slate-400\" /\u003e\n          )}\n          \u003cspan className=\"hidden md:inline\"\u003e\n            {anonymizePatient\n              ? tr(locale, '匿名已啟用', 'Anonymized')\n              : tr(locale, '顯示原始個資', 'Raw PHI Visible')}\n          \u003c/span\u003e\n        \u003c/button\u003e\n\n        {/* Prescription PDF Link */}\n        {assets.rxPdfUrl && (\n          \u003ca\n            href={assets.rxPdfUrl}\n            target=\"_blank\"\n            rel=\"noopener noreferrer\"\n            className=\"hidden sm:flex items-center space-x-1 px-2.5 py-1 rounded text-xs bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:text-slate-950 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors\"\n            title={tr(\n              locale,\n              `開啟處方 PDF (${assets.rxPdfFileName || 'Rx.pdf'})`,\n              `Open Rx PDF (${assets.rxPdfFileName || 'Rx.pdf'})`\n            )}\n          \u003e\n            \u003cFileText className=\"w-3.5 h-3.5 text-slate-500 dark:text-slate-400\" /\u003e\n            \u003cspan\u003e{tr(locale, '處方箋 PDF', 'Rx PDF')}\u003c/span\u003e\n          \u003c/a\u003e\n        )}\n\n        {/* English / Traditional Chinese Language Switcher */}\n        {onToggleLocale && (\n          \u003cbutton\n            type=\"button\"\n            data-testid=\"locale-toggle-btn\"\n            onClick={onToggleLocale}\n            className=\"flex items-center gap-1 px-2 py-1 rounded text-xs font-mono bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:text-slate-950 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors\"\n            title={\n              locale === 'zh-TW'\n                ? 'Switch interface language to English (EN)'\n                : '切換介面語系為繁體中文 (zh-TW)'\n            }\n          \u003e\n            \u003cGlobe className=\"w-3.5 h-3.5 text-sky-500 dark:text-sky-400\" /\u003e\n            \u003cspan\u003e{locale === 'zh-TW' ? 'EN' : '中文'}\u003c/span\u003e\n          \u003c/button\u003e\n        )}\n\n        {/* Light / Dark Theme Toggle */}\n        \u003cbutton\n          type=\"button\"\n          data-testid=\"theme-toggle-btn\"\n          onClick={onToggleTheme}\n          className=\"flex items-center gap-1 px-2 py-1 rounded text-xs bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:text-slate-950 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors\"\n          title={\n            theme === 'dark'\n              ? tr(locale, '切換為亮色佈景 (Light Mode)', 'Switch to Light Mode')\n              : tr(locale, '切換為暗色佈景 (Dark Mode)', 'Switch to Dark Mode')\n          }\n        \u003e\n          {theme === 'dark' ? (\n            \u003c\u003e\n              \u003cSun className=\"w-3.5 h-3.5 text-amber-400\" /\u003e\n              \u003cspan className=\"hidden md:inline\"\u003e{tr(locale, '亮色', 'Light')}\u003c/span\u003e\n            \u003c/\u003e\n          ) : (\n            \u003c\u003e\n              \u003cMoon className=\"w-3.5 h-3.5 text-sky-600\" /\u003e\n              \u003cspan className=\"hidden md:inline\"\u003e{tr(locale, '暗色', 'Dark')}\u003c/span\u003e\n            \u003c/\u003e\n          )}\n        \u003c/button\u003e\n\n        {/* Ask AI Assistant Button (ai-proxy /v1 & MCP Pages) */}\n        {onOpenAskAi && (\n          \u003cbutton\n            type=\"button\"\n            data-testid=\"header-ask-ai-btn\"\n            onClick={onOpenAskAi}\n            className=\"flex items-center gap-1 px-2 py-1 rounded text-xs font-medium bg-emerald-500/15 dark:bg-emerald-950/60 hover:bg-emerald-500/25 dark:hover:bg-emerald-900/70 border border-emerald-500/40 dark:border-emerald-800/60 text-emerald-700 dark:text-emerald-300 transition-colors whitespace-nowrap\"\n            title={tr(\n              locale,\n "hits":0},"291":{"hits":0},"293":{"hits":0},"294":{"hits":0},"295":{"hits":0},"296":{"hits":0},"297":{"hits":0},"298":{"hits":0},"300":{"hits":0},"301":{"hits":0},"302":{"hits":0},"303":{"hits":0},"304":{"hits":0},"305":{"hits":0},"307":{"hits":0},"308":{"hits":0},"309":{"hits":0},"310":{"hits":0},"312":{"hits":0},"313":{"hits":0},"314":{"hits":0},"315":{"hits":0},"316":{"hits":0},"318":{"hits":0},"319":{"hits":0},"321":{"hits":0},"322":{"hits":0},"323":{"hits":0},"324":{"hits":0},"325":{"hits":0},"326":{"hits":0},"327":{"hits":0},"328":{"hits":0},"330":{"hits":0},"331":{"hits":0},"332":{"hits":0},"333":{"hits":0},"335":{"hits":0},"336":{"hits":0},"337":{"hits":0},"339":{"hits":0},"340":{"hits":0},"341":{"hits":0},"342":{"hits":0},"343":{"hits":0},"344":{"hits":0},"345":{"hits":0},"346":{"hits":0},"347":{"hits":0},"349":{"hits":0},"350":{"hits":0},"351":{"hits":0},"352":{"hits":0},"353":{"hits":0},"355":{"hits":1},"357":{"hits":1}},"functionDetails":[{"name":"PentaGallery","line":25,"hits":1},{"name":"handleOpenPhoto","line":36,"hits":0},{"name":"handleClose","line":41,"hits":0},{"name":"handleNext","line":46,"hits":0},{"name":"handlePrev","line":54,"hits":0},{"name":"getPhotoCopy","line":62,"hits":0},{"name":"onChange","line":193,"hits":0},{"name":"onClick","line":275,"hits":0}],"sourceCode":"import React, { useState } from 'react';\nimport { ClinicalPhoto, CameraPreset, LocaleMode } from '../types/dental';\nimport { tr } from '../utils/i18n';\nimport {\n  Maximize2,\n  X,\n  Compass,\n  ZoomIn,\n  ZoomOut,\n  ChevronLeft,\n  ChevronRight,\n  Layers,\n  Upload,\n} from 'lucide-react';\n\ninterface PentaGalleryProps {\n  photos: ClinicalPhoto[];\n  onSyncCameraPreset: (preset: CameraPreset) =\u003e void;\n  photoTextureMapped?: boolean;\n  onTogglePhotoTexture?: () =\u003e void;\n  onImportCaseFiles?: (files: FileList) =\u003e void;\n  locale?: LocaleMode;\n}\n\nexport const PentaGallery: React.FC\u003cPentaGalleryProps\u003e = ({\n  photos,\n  onSyncCameraPreset,\n  photoTextureMapped = false,\n  onTogglePhotoTexture,\n  onImportCaseFiles,\n  locale = 'en',\n}) =\u003e {\n  const [selectedPhoto, setSelectedPhoto] = useState\u003cClinicalPhoto | null\u003e(null);\n  const [zoomLevel, setZoomLevel] = useState\u003cnumber\u003e(1);\n\n  const handleOpenPhoto = (photo: ClinicalPhoto) =\u003e {\n    setSelectedPhoto(photo);\n    setZoomLevel(1);\n  };\n\n  const handleClose = () =\u003e {\n    setSelectedPhoto(null);\n    setZoomLevel(1);\n  };\n\n  const handleNext = () =\u003e {\n    if (!selectedPhoto || photos.length === 0) return;\n    const currentIndex = photos.findIndex((p) =\u003e p.id === selectedPhoto.id);\n    const nextIndex = (currentIndex + 1) % photos.length;\n    setSelectedPhoto(photos[nextIndex]);\n    setZoomLevel(1);\n  };\n\n  const handlePrev = () =\u003e {\n    if (!selectedPhoto || photos.length === 0) return;\n    const currentIndex = photos.findIndex((p) =\u003e p.id === selectedPhoto.id);\n    const prevIndex = (currentIndex - 1 + photos.length) % photos.length;\n    setSelectedPhoto(photos[prevIndex]);\n    setZoomLevel(1);\n  };\n\n  const getPhotoCopy = (photo: ClinicalPhoto) =\u003e {\n    const dict: Record\u003c\n      string,\n      { titleZh: string; titleEn: string; viewZh: string; viewEn: string; descZh: string; descEn: string }\n    \u003e = {\n      overview: {\n        titleZh: '複合臨床全覽圖 (Overview)',\n        titleEn: 'Composite Clinical Overview',\n        viewZh: '五方位總覽 (Overview)',\n        viewEn: 'Composite Penta View',\n        descZh: '口掃系統匯總之五方位臨床照片集合總覽圖。',\n        descEn: 'Composite 5-view intraoral clinical photography overview.',\n      },\n      front: {\n        titleZh: '正視咬合面 (Frontal View)',\n        titleEn: 'Frontal Occlusal View',\n        viewZh: '正視咬合 (Frontal)',\n        viewEn: 'Frontal Occlusion',\n        descZh: '前牙中線、前牙覆咬與覆蓋及前牙齒列排列檢視。',\n        descEn: 'Anterior midline, overjet/overbite, and frontal arch alignment.',\n      },\n      upper: {\n        titleZh: '上顎齒列咬合面 (Upper Arch)',\n        titleEn: 'Maxillary Occlusal View (Upper)',\n        viewZh: '上顎咬合面 (Maxilla)',\n        viewEn: 'Maxillary Occlusal',\n        descZh: '上顎牙弓型態、顎面窩溝咬合點以及牙弓寬度。',\n        descEn: 'Maxillary arch form, occlusal fissures, and arch width.',\n      },\n      lower: {\n        titleZh: '下顎齒列咬合面 (Lower Arch)',\n        titleEn: 'Mandibular Occlusal View (Lower)',\n        viewZh: '下顎咬合面 (Mandible)',\n        viewEn: 'Mandibular Occlusal',\n        descZh: '下顎牙弓對稱性、舌側傾斜度及前牙擁擠分析。',\n        descEn: 'Mandibular arch symmetry, lingual inclination, and anterior crowding.',\n      },\n      patientright: {\n        titleZh: '右側頰面咬合 (Right Buccal)',\n        titleEn: 'Right Buccal Occlusion',\n        viewZh: '右側頰面 (Right Buccal)',\n        viewEn: 'Right Buccal Occlusion',\n        descZh: '右側犬齒與第一大臼齒咬合關係與齒間接觸。',\n        descEn: 'Right canine and first molar occlusal relationship and intercuspation.',\n      },\n      patientleft: {\n        titleZh: '左側頰面咬合 (Left Buccal)',\n        titleEn: 'Left Buccal Occlusion',\n        viewZh: '左側頰面 (Left Buccal)',\n        viewEn: 'Left Buccal Occlusion',\n        descZh: '左側犬齒與第一大臼齒咬合關係及後牙側方引導。',\n        descEn: 'Left canine and first molar occlusal relationship and lateral guidance.',\n      },\n    };\n    const entry = dict[photo.id];\n    if (!entry) {\n      return {\n        title: photo.title,\n        viewName: photo.viewName,\n        description: photo.description,\n      };\n    }\n    return {\n      title: locale === 'en' ? entry.titleEn : entry.titleZh,\n      viewName: locale === 'en' ? entry.viewEn : entry.viewZh,\n      description: locale === 'en' ? entry.descEn : entry.descZh,\n    };\n  };\n\n  return (\n    \u003cdiv className=\"space-y-4 text-xs text-slate-700 dark:text-slate-300\"\u003e\n      \u003cdiv className=\"flex items-start justify-between gap-2 flex-wrap\"\u003e\n        \u003cdiv\u003e\n          \u003ch2 className=\"text-base font-semibold text-slate-900 dark:text-slate-100\"\u003e\n            {tr(locale, '五方位臨床齒列照片', '5-View Intraoral Clinical Photography')}\n          \u003c/h2\u003e\n          \u003cp className=\"text-slate-500 dark:text-slate-400 mt-0.5\"\u003e\n            {tr(\n              locale,\n              '口掃系統擷取之標準臨床攝影與五方位咬合記錄 (Penta Gallery)',\n              'Standard 5-view occlusal photography & 3D orthographic texture projection'\n            )}\n          \u003c/p\u003e\n        \u003c/div\u003e\n\n        {onTogglePhotoTexture && (\n          \u003cbutton\n            onClick={onTogglePhotoTexture}\n            className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium border transition-colors ${\n              photoTextureMapped\n                ? 'bg-sky-500 border-sky-600 text-white shadow-sm'\n                : 'bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'\n            }`}\n          \u003e\n            \u003cLayers className=\"w-3.5 h-3.5\" /\u003e\n            \u003cspan\u003e\n              {photoTextureMapped\n                ? tr(locale, '3D 照片貼圖：已啟用', '3D Photo Texture: ON')\n                : tr(locale, '套用照片貼圖至 3D 模型', 'Map Photos onto 3D Arch')}\n            \u003c/span\u003e\n          \u003c/button\u003e\n        )}\n      \u003c/div\u003e\n\n      {/* Empty State when no local photos have been uploaded yet */}\n      {photos.length === 0 ? (\n        \u003cdiv className=\"border border-dashed border-slate-300 dark:border-slate-700 bg-white dark:bg-[#0b0f17] rounded-lg p-6 text-center space-y-3\"\u003e\n          \u003cp className=\"text-xs font-medium text-slate-800 dark:text-slate-200\"\u003e\n            {tr(\n              locale,\n              '尚未載入五方位臨床齒列照片 (純瀏覽器零隱私外洩模式)',\n              'No 5-View Intraoral Clinical Photos Loaded (Zero-PHI Browser Mode)'\n            )}\n          \u003c/p\u003e\n          \u003cp className=\"text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed max-w-md mx-auto\"\u003e\n            {tr(\n              locale,\n              '本系統預設不預載任何本地病患資料。請點擊下方按鈕選擇口掃匯出的五方位臨床照片（包含 front / upper / lower / right / left 之 .jpg 或 .png 與 .stl），即可即時渲染 3D 照片貼圖並儲存於瀏覽器 IndexedDB。',\n              'No local patient data is preloaded by default. Click the button below to load a .zip archive or intraoral photos (front / upper / lower / right / left .jpg/.png + .stl) for 3D texture projection.'\n            )}\n          \u003c/p\u003e\n          {onImportCaseFiles && (\n            \u003clabel\n              data-testid=\"gallery-upload-label\"\n              className=\"inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white text-xs font-medium cursor-pointer transition-colors\"\n            \u003e\n              \u003cinput\n                type=\"file\"\n                multiple\n                accept=\".zip,.stl,.xml,.jpg,.jpeg,.png,.pdf,.html,application/zip,application/x-zip-compressed,model/stl,application/sla,application/vnd.ms-pki.stl,application/octet-stream,image/*,application/pdf,text/xml,application/xml\"\n                className=\"hidden\"\n                onChange={(e) =\u003e {\n                  if (e.target.files && e.target.files.length \u003e 0) {\n                    onImportCaseFiles(e.target.files);\n                    e.target.value = '';\n                  }\n                }}\n              /\u003e\n              \u003cUpload className=\"w-3.5 h-3.5\" /\u003e\n              \u003cspan\u003e{tr(locale, '選擇本地口掃照片與 STL 檔案', 'Load Intraoral Photos & STL Files')}\u003c/span\u003e\n            \u003c/label\u003e\n          )}\n        \u003c/div\u003e\n      ) : (\n        \u003cdiv className=\"grid grid-cols-2 sm:grid-cols-3 gap-3\"\u003e\n          {photos.map((photo) =\u003e {\n            const copy = getPhotoCopy(photo);\n            return (\n              \u003cdiv\n                key={photo.id}\n                onClick={() =\u003e handle mmon prefixes like \"Dr.\")\n */\nexport function maskWords(input: string): string {\n  if (!input) return '';\n  return input.replace(/[A-Za-z\\u4e00-\\u9fa50-9]+/g, (word) =\u003e {\n    if (/^(Dr|Clinic|Dental|City|Taiwan)$/i.test(word)) {\n      return word;\n    }\n    if (word.length \u003c= 1) return '*';\n    return word[0] + '*'.repeat(Math.min(word.length - 1, 5));\n  });\n}\n\n/**\n * Mask an identifier or license number\n */\nexport function maskIdentifier(id: string): string {\n  if (!id || id === 'N/A') return id;\n  if (id.length \u003c= 4) return '*'.repeat(id.length);\n  return `${id.slice(0, 2)}${'*'.repeat(Math.min(id.length - 4, 8))}${id.slice(-2)}`;\n}\n\n/**\n * Return either raw or anonymized DentalCaseMetadata based on `enabled` flag\n */\nexport function getDisplayMetadata(\n  metadata: DentalCaseMetadata,\n  anonymize: boolean\n): DentalCaseMetadata {\n  if (!anonymize) return metadata;\n\n  return {\n    ...metadata,\n    patientName: maskWords(metadata.patientName),\n    patientId: maskIdentifier(metadata.patientId),\n    doctorName: maskWords(metadata.doctorName),\n    doctorLicense: maskIdentifier(metadata.doctorLicense),\n    doctorId: maskIdentifier(metadata.doctorId),\n    clinicName: maskWords(metadata.clinicName),\n    clinicAddress: maskWords(metadata.clinicAddress),\n  };\n}\n\n/**\n * Mask sensitive XML tags (\u003cPatient\u003e, \u003cDoctor\u003e, \u003cPracticeShipToAddress\u003e, etc.) when anonymize is active\n */\nexport function anonymizeXmlString(xml: string, anonymize: boolean): string {\n  if (!anonymize || !xml) return xml;\n\n  const sensitiveTags = [\n    'Patient',\n    'UniquePatientIdentifier',\n    'Doctor',\n    'DoctorLicense',\n    'DoctorID',\n    'DoctorCompanyID',\n    'PracticeShipToAddress',\n  ];\n\n  let result = xml;\n  for (const tag of sensitiveTags) {\n    result = result.replace(\n      new RegExp(`(\u003c${tag}[^\u003e]*\u003e)([\\\\s\\\\S]*?)(\u003c\\\\/${tag}\u003e)`, 'gi'),\n      (_match, openTag, content, closeTag) =\u003e {\n        const trimmed = content.trim();\n        if (!trimmed) return `${openTag}${content}${closeTag}`;\n        const masked =\n          tag.includes('ID') || tag.includes('Identifier') || tag.includes('License')\n            ? maskIdentifier(trimmed)\n            : maskWords(trimmed);\n        return `${openTag}${masked}${closeTag}`;\n      }\n    );\n  }\n  return result;\n}\n"},"src/utils/archMeasurements.ts":{"path":"src/utils/archMeasurements.ts","lines":{"total":155,"covered":144,"skipped":11,"pct":92.9},"functions":{"total":3,"covered":3,"skipped":0,"pct":100},"branches":{"total":50,"covered":43,"skipped":7,"pct":86},"lineDetails":{"3":{"hits":1},"4":{"hits":1},"5":{"hits":1},"6":{"hits":1},"7":{"hits":1},"8":{"hits":1},"9":{"hits":1},"10":{"hits":1},"11":{"hits":1},"12":{"hits":1},"13":{"hits":1},"14":{"hits":1},"19":{"hits":1,"branches":{"total":1,"taken":1}},"20":{"hits":50},"21":{"hits":50},"22":{"hits":50},"23":{"hits":50},"24":{"hits":50},"25":{"hits":50},"26":{"hits":50},"27":{"hits":50},"28":{"hits":50},"30":{"hits":50},"31":{"hits":50},"32":{"hits":50},"33":{"hits":50},"34":{"hits":50},"35":{"hits":50},"36":{"hits":50},"37":{"hits":50},"38":{"hits":50},"39":{"hits":50},"40":{"hits":50},"41":{"hits":50},"42":{"hits":50},"43":{"hits":50},"44":{"hits":50},"45":{"hits":50},"46":{"hits":50},"47":{"hits":50},"48":{"hits":50},"64":{"hits":4,"branches":{"total":1,"taken":1}},"65":{"hits":4},"66":{"hits":4,"branches":{"total":1,"taken":1}},"68":{"hits":2},"69":{"hits":2},"70":{"hits":2},"71":{"hits":2},"72":{"hits":2},"73":{"hits":2},"76":{"hits":2},"77":{"hits":4,"branches":{"total":1,"taken":1}},"78":{"hits":168},"79":{"hits":168},"80":{"hits":168},"81":{"hits":168},"82":{"hits":168,"branches":{"total":1,"taken":1}},"83":{"hits":168,"branches":{"total":1,"taken":1}},"84":{"hits":168,"branches":{"total":1,"taken":1}},"85":{"hits":168,"branches":{"total":1,"taken":1}},"86":{"hits":168,"branches":{"total":1,"taken":1}},"8 2},"179":{"hits":2},"180":{"hits":2},"182":{"hits":2,"branches":{"total":2,"taken":2}},"183":{"hits":1},"184":{"hits":1},"186":{"hits":1},"187":{"hits":1},"189":{"hits":1},"190":{"hits":1},"191":{"hits":1},"193":{"hits":2,"branches":{"total":1,"taken":0}},"195":{"hits":2},"196":{"hits":2},"197":{"hits":2},"198":{"hits":2},"199":{"hits":2},"200":{"hits":2},"201":{"hits":2},"202":{"hits":2},"203":{"hits":2},"204":{"hits":2},"205":{"hits":2},"206":{"hits":2},"207":{"hits":2}},"functionDetails":[{"name":"createCaliperMeasurement","line":19,"hits":50},{"name":"analyzeArchVertices","line":64,"hits":4},{"name":"computeOrthoArchMetrics","line":175,"hits":2}],"sourceCode":"import { CaliperMeasurement, OrthoArchMetrics, Point3D } from '../types/dental';\n\nexport const DEFAULT_ORTHO_ARCH_METRICS: OrthoArchMetrics = {\n  upperIntercanineWidthMm: 34.8,\n  lowerIntercanineWidthMm: 27.4,\n  upperIntermolarWidthMm: 52.6,\n  lowerIntermolarWidthMm: 47.2,\n  upperArchDepthMm: 41.5,\n  lowerArchDepthMm: 38.2,\n  overjetMm: 2.6,\n  overbiteMm: 2.4,\n  midlineDeviationMm: 0.4,\n  archFormRatio: 1.27,\n};\n\n/**\n * Compute a 3D point-to-point digital caliper measurement in millimeters\n */\nexport function createCaliperMeasurement(\n  id: string,\n  label: string,\n  pointA: Point3D,\n  pointB: Point3D\n): CaliperMeasurement {\n  const dx = pointB.x - pointA.x;\n  const dy = pointB.y - pointA.y;\n  const dz = pointB.z - pointA.z;\n  const dist = Math.hypot(dx, dy, dz);\n\n  return {\n    id,\n    label,\n    pointA: {\n      x: Number(pointA.x.toFixed(2)),\n      y: Number(pointA.y.toFixed(2)),\n      z: Number(pointA.z.toFixed(2)),\n    },\n    pointB: {\n      x: Number(pointB.x.toFixed(2)),\n      y: Number(pointB.y.toFixed(2)),\n      z: Number(pointB.z.toFixed(2)),\n    },\n    distanceMm: Number(dist.toFixed(2)),\n    deltaX: Number(Math.abs(dx).toFixed(2)),\n    deltaY: Number(Math.abs(dy).toFixed(2)),\n    deltaZ: Number(Math.abs(dz).toFixed(2)),\n  };\n}\n\ninterface ArchBandSummary {\n  minX: number;\n  maxX: number;\n  minY: number;\n  maxY: number;\n  minZ: number;\n  maxZ: number;\n  canineWidth: number;\n  molarWidth: number;\n  incisalY: number;\n  incisalZ: number;\n  incisalMidlineX: number;\n}\n\nfunction analyzeArchVertices(positions: ArrayLike\u003cnumber\u003e, isUpper: boolean): ArchBandSummary | null {\n  const n = Math.floor(positions.length / 3);\n  if (n \u003c 12) return null;\n\n  let minX = Infinity;\n  let maxX = -Infinity;\n  let minY = Infinity;\n  let maxY = -Infinity;\n  let minZ = Infinity;\n  let maxZ = -Infinity;\n\n  // Step 1: Bounding box\n  const step = Math.max(1, Math.floor(n / 15000));\n  for (let i = 0; i \u003c n; i += step) {\n    const idx = i * 3;\n    const x = positions[idx];\n    const y = positions[idx + 1];\n    const z = positions[idx + 2];\n    if (x \u003c minX) minX = x;\n    if (x \u003e maxX) maxX = x;\n    if (y \u003c minY) minY = y;\n    if (y \u003e maxY) maxY = y;\n    if (z \u003c minZ) minZ = z;\n    if (z \u003e maxZ) maxZ = z;\n  }\n\n  const depthY = Math.max(1, maxY - minY);\n  // In STL coordinates: Anterior (Incisors) is near minY (-47 mm) and Posterior (Molars) is near maxY (+10 mm)\n  // Canine coronal band is approximately 20% to 32% from anterior (minY) toward posterior (maxY)\n  const canineYMin = minY + depthY * 0.20;\n  const canineYMax = minY + depthY * 0.32;\n\n  // First molar coronal band is approximately 54% to 70% from anterior (minY) toward posterior (maxY)\n  const molarYMin = minY + depthY * 0.54;\n  const molarYMax = minY + depthY * 0.70;\n\n  // Anterior incisal band is the frontmost 14% near minY and midline\n  const incisalYMax = minY + depthY * 0.14;\n  const centerX = 0.5 * (minX + maxX);\n\n  let cLeftMax = -Infinity;\n  let cRightMin = Infinity;\n  let mLeftMax = -Infinity;\n  let mRightMin = Infinity;\n\n  let incisalY = Infinity;\n  let incisalZ = isUpper ? Infinity : -Infinity;\n  let incisalXSum = 0;\n  let incisalCount = 0;\n\n  for (let i = 0; i \u003c n; i += step) {\n    const idx = i * 3;\n    const x = positions[idx];\n    const y = positions[idx + 1];\n    const z = positions[idx + 2];\n\n    // Focus on tooth crown height band (exclude outer base rim)\n    if (isUpper && z \u003e minZ + (maxZ - minZ) * 0.55) continue;\n    if (!isUpper && z \u003c maxZ - (maxZ - minZ) * 0.55) continue;\n\n    if (y \u003e= canineYMin && y \u003c= canineYMax) {\n      if (x \u003e cLeftMax) cLeftMax = x;\n      if (x \u003c cRightMin) cRightMin = x;\n    }\n\n    if (y \u003e= molarYMin && y \u003c= molarYMax) {\n      if (x \u003e mLeftMax) mLeftMax = x;\n      if (x \u003c mRightMin) mRightMin = x;\n    }\n\n    if (y \u003c= incisalYMax && Math.abs(x - centerX) \u003c= 8.5) {\n      if (y \u003c incisalY) incisalY = y;\n      if (isUpper) {\n        if (z \u003c incisalZ) incisalZ = z;\n      } else {\n        if (z \u003e incisalZ) incisalZ = z;\n      }\n      incisalXSum += x;\n      incisalCount++;\n    }\n  }\n\n  const totalWidth = maxX - minX;\n  // Convert outer buccal width at canine/molar band to clinical cusp-tip intercanine/intermolar width (~0.80 factor)\n  const rawCanineSpan =\n    Number.isFinite(cLeftMax) && Number.isFinite(cRightMin) && cLeftMax \u003e cRightMin\n      ? (cLeftMax - cRightMin) * 0.78\n      : totalWidth * 0.54;\n  const rawMolarSpan =\n    Number.isFinite(mLeftMax) && Number.isFinite(mRightMin) && mLeftMax \u003e mRightMin\n      ? (mLeftMax - mRightMin) * 0.82\n      : totalWidth * 0.79;\n\n  return {\n    minX,\n    maxX,\n    minY,\n    maxY,\n    minZ,\n    maxZ,\n    canineWidth: Number(rawCanineSpan.toFixed(1)),\n    molarWidth: Number(rawMolarSpan.toFixed(1)),\n    incisalY: Number.isFinite(incisalY) ? incisalY : maxY,\n    incisalZ: Number.isFinite(incisalZ) ? incisalZ : 0,\n    incisalMidlineX: incisalCount \u003e 0 ? incisalXSum / incisalCount : centerX,\n  };\n}\n\n/**\n * Compute clinical arch and occlusal metrics from Upper and Lower 3D mesh vertices\n */\nexport function computeOrthoArchMetrics(\n  upperPositions: ArrayLike\u003cnumber\u003e,\n  lowerPositions: ArrayLike\u003cnumber\u003e\n): OrthoArchMetrics {\n  const upper = analyzeArchVertices(upperPositions, true);\n  const lower = analyzeArchVertices(lowerPositions, false);\n\n  if (!upper || !lower) {\n    return { ...DEFAULT_ORTHO_ARCH_METRICS };\n  }\n\n  const upperDepth = Number(((upper.maxY - upper.minY) * 0.82).toFixed(1));\n  const lowerDepth = Number(((lower.maxY - lower.minY) * 0.78).toFixed(1));\n\n  const rawOverjet = Math.max(0.2, Math.abs(upper.incisalY - lower.incisalY));\n  const rawOverbite = Math.max(0.1, Math.abs(lower.incisalZ - upper.incisalZ));\n  const midlineDev = Math.abs(upper.incisalMidlineX - lower.incisalMidlineX);\n\n  const ratio = upperDepth \u003e 0 ? upper.molarWidth / upperDepth : 1.25;\n\n  return {\n    upperIntercanineWidthMm: upper.canineWidth,\n    lowerIntercanineWidthMm: lower.canineWidth,\n    upperIntermolarWidthMm: upper.molarWidth,\n    lowerIntermolarWidthMm: lower.molarWidth,\n    upperArchDepthMm: upperDepth,\n    lowerArchDepthMm: lowerDepth,\n    overjetMm: Number(Math.min(12, rawOverjet).toFixed(1)),\n    overbiteMm: Number(Math.min(10, rawOverbite).toFixed(1)),\n    midlineDeviationMm: Number(Math.min(5, midlineDev).toFixed(2)),\n    archFormRatio: Number(ratio.toFixed(2)),\n  };\n}\n"},"src/utils/articulatorKinematics.ts":{"path":"src/utils/articulatorKinematics.ts","lines":{"total":331,"covered":331,"skipped":0,"pct":100},"functions":{"total":9,"covered":9,"skipped":0,"pct":100},"branches":{"total":32,"covered":32,"skipped":0,"pct":100},"lineDetails":{"19":{"hits":1},"22":{"hits":1},"23":{"hits":1},"24":{"hits":1},"25":{"hits":1},"26":{"hits":1},"27":{"hits":1},"28":{"hits":1},"29":{"hits":1},"30":{"hits":1},"31":{"hits":1},"32":{"hits":1},"33":{"hits":1},"34":{"hits":1},"35":{"hits":1},"36":{"hits":1},"37":{"hits":1},"38":{"hits":1},"39":{"hits":1},"40":{"hits":1},"41":{"hits":1},"42":{"hits":1},"43":{"hits":1},"44": 0,\n  },\n  pure_hinge: {\n    id: 'pure_hinge',\n    name: '純樞軸定軸旋轉 (Pure Hinge)',\n    nameEn: 'Pure Hinge Rotation',\n    description: '模擬全可調咬合器固定樞軸開合，僅繞雙側髁頭連線旋轉而不產生前下滑動。',\n    descriptionEn:\n      'Simulates fixed-axle hinge rotation around the intercondylar axis with minimal anterior condylar translation.',\n    bezier: { p1x: 0.85, p1y: 0.02, p2x: 0.95, p2y: 0.15 },\n    condylarGuidanceAngleDeg: 25,\n    incisalGuidanceAngleDeg: 30,\n  },\n  early_translation: {\n    id: 'early_translation',\n    name: '早期髁頭滑動 (Early Translation)',\n    nameEn: 'Early Condylar Translation',\n    description: '張口初期即伴隨明顯的下顎前下移位，常見於關節窩較淺或韌帶鬆弛型態。',\n    descriptionEn:\n      'Immediate anterior-inferior condylar translation from early opening, typical of shallow glenoid fossa morphology.',\n    bezier: { p1x: 0.12, p1y: 0.58, p2x: 0.38, p2y: 0.94 },\n    condylarGuidanceAngleDeg: 28,\n    incisalGuidanceAngleDeg: 32,\n  },\n  steep_guidance: {\n    id: 'steep_guidance',\n    name: '深咬陡峭切導 (Steep Guidance)',\n    nameEn: 'Steep Anterior Guidance',\n    description: '前牙覆咬較深，前突與開合初期需較陡峭之垂直打開角度以避開切端干擾。',\n    descriptionEn:\n      'Deep anterior overbite profile requiring steeper initial vertical disclusion to clear incisal interference.',\n    bezier: { p1x: 0.25, p1y: 0.05, p2x: 0.5, p2y: 0.96 },\n    condylarGuidanceAngleDeg: 45,\n    incisalGuidanceAngleDeg: 55,\n  },\n};\n\n/**\n * In STL model coordinates:\n * - Anterior (Incisors / 前牙切端) is at Y ≈ -43.5 mm (-Y direction)\n * - Posterior (Molars / 後牙大臼齒) is at Y ≈ +5 to +10.7 mm (+Y direction)\n * - Therefore, the TMJ Intercondylar Hinge Axis is posterior to the molars at Y = +42 mm, Z = +28 mm\n */\nexport const DEFAULT_ARTICULATOR_SETTINGS: ArticulatorSettings = {\n  mode: 'hinge',\n  progress: 0,\n  isPlaying: false,\n  playbackSpeed: 1.0,\n  maxOpeningAngleDeg: 22,\n  condylarGuidanceAngleDeg: 33,\n  incisalGuidanceAngleDeg: 40,\n  bennettAngleDeg: 15,\n  hingeAxisY: 42,\n  hingeAxisZ: 28,\n  showTrajectoryGizmo: true,\n  curvePresetId: 'posselt',\n  bezier: { ...ARTICULATION_CURVE_PRESETS.posselt.bezier },\n};\n\nexport const DEFAULT_INCISAL_REF_POINT: Point3D = {\n  x: 0,\n  y: -43.5,\n  z: 0.5,\n};\n\nexport interface MandibularKinematicsResult {\n  upperPosition: Point3D;\n  upperRotation: Point3D;\n  lowerPosition: Point3D;\n  lowerRotation: Point3D;\n  /** 16-element column-major 4x4 transformation matrix for lower arch */\n  lowerMatrixElements: number[];\n  /** 16-element column-major 4x4 inverse matrix for lower arch */\n  lowerInverseMatrixElements: number[];\n  /** Pivot center in model coordinates */\n  hingePivot: Point3D;\n  /** Left & Right TMJ condyle world positions */\n  condyleLeftWorld: Point3D;\n  condyleRightWorld: Point3D;\n  /** Transformed lower central incisor position in world coordinates */\n  incisalWorldPoint: Point3D;\n  /** Displacement vector of the lower central incisor from Centric Occlusion (mm) */\n  incisalDisplacementMm: Point3D;\n  /** Total Euclidean opening distance at the incisors (mm) */\n  incisalOpeningMm: number;\n  /** Current sagittal opening rotation angle (degrees) */\n  rotationAngleDeg: number;\n  /** Current condylar translation distance along the eminence (mm) */\n  condylarTranslationMm: number;\n  /** Current lateral shift at the incisors (mm) */\n  lateralShiftMm: number;\n  /** Evaluated Bezier curve point (bx, by) at current progress */\n  bezierPoint: { x: number; y: number };\n}\n\nexport interface TrajectorySamplePoint {\n  t: number;\n  incisalWorld: Point3D;\n  condyleWorld: Point3D;\n  rotationAngleDeg: number;\n  condylarTranslationMm: number;\n  bezierX: number;\n  bezierY: number;\n}\n\nfunction clamp(v: number, min: number, max: number): number {\n  return Math.max(min, Math.min(max, v));\n}\n\n/**\n * Evaluate 1D Cubic Bezier with endpoints P0=0 and P3=1:\n * B(s) = 3*(1-s)^2*s*p1 + 3*(1-s)*s^2*p2 + s^3\n */\nexport function evaluateCubicBezier1D(s: number, p1: number, p2: number): number {\n  const u = clamp(s, eRecord): Promise\u003cvoid\u003e {\n  const db = await openDatabase();\n  return new Promise((resolve, reject) =\u003e {\n    const tx = db.transaction(STORE_CASES, 'readwrite');\n    const store = tx.objectStore(STORE_CASES);\n    store.put(record);\n    tx.oncomplete = () =\u003e {\n      db.close();\n      resolve();\n    };\n    tx.onerror = () =\u003e {\n      db.close();\n      reject(tx.error);\n    };\n  });\n}\n\n/**\n * Get a single StoredCaseRecord by ID from IndexedDB\n */\nexport async function getCaseRecordFromIndexedDB(id: string): Promise\u003cStoredCaseRecord | undefined\u003e {\n  const db = await openDatabase();\n  return new Promise((resolve, reject) =\u003e {\n    const tx = db.transaction(STORE_CASES, 'readonly');\n    const store = tx.objectStore(STORE_CASES);\n    const req = store.get(id);\n    req.onsuccess = () =\u003e {\n      db.close();\n      resolve(req.result as StoredCaseRecord | undefined);\n    };\n    req.onerror = () =\u003e {\n      db.close();\n      reject(req.error);\n    };\n  });\n}\n\n/**\n * Update mesh stats on an existing IndexedDB case record once Three.js finishes computing them\n */\nexport async function updateStoredCaseMeshStats(\n  id: string,\n  meshStats: MeshGeometryStats\n): Promise\u003cvoid\u003e {\n  try {\n    const existing = await getCaseRecordFromIndexedDB(id);\n    if (!existing) return;\n    existing.defaultMeshStats = meshStats;\n    await saveCaseRecordToIndexedDB(existing);\n  } catch (err) {\n    console.warn('Failed to update mesh stats in IndexedDB:', err);\n  }\n}\n\n/**\n * Delete a case from IndexedDB by ID\n */\nexport async function deleteCaseFromIndexedDB(id: string): Promise\u003cvoid\u003e {\n  const db = await openDatabase();\n  return new Promise((resolve, reject) =\u003e {\n    const tx = db.transaction(STORE_CASES, 'readwrite');\n    const store = tx.objectStore(STORE_CASES);\n    store.delete(id);\n    tx.oncomplete = () =\u003e {\n      db.close();\n      resolve();\n    };\n    tx.onerror = () =\u003e {\n      db.close();\n      reject(tx.error);\n    };\n  });\n}\n\n/**\n * Convert a StoredCaseRecord from IndexedDB into a live DentalCaseBundle with fresh Blob Object URLs\n */\nexport function hydrateCaseBundleFromRecord(record: StoredCaseRecord): DentalCaseBundle {\n  const upperStlUrl = record.upperStlBlob\n    ? URL.createObjectURL(record.upperStlBlob)\n    : record.fallbackUpperStlUrl || '';\n  const lowerStlUrl = record.lowerStlBlob\n    ? URL.createObjectURL(record.lowerStlBlob)\n    : record.fallbackLowerStlUrl || '';\n\n  const rxPdfUrl = record.rxPdfBlob\n    ? URL.createObjectURL(record.rxPdfBlob)\n    : record.fallbackRxPdfUrl;\n  const rxHtmlUrl = record.rxHtmlBlob\n    ? URL.createObjectURL(record.rxHtmlBlob)\n    : record.fallbackRxHtmlUrl;\n\n  const xmlV50Url = record.xmlV50Blob\n    ? URL.createObjectURL(record.xmlV50Blob)\n    : record.rawXmlV50\n    ? URL.createObjectURL(new Blob([record.rawXmlV50], { type: 'application/xml' }))\n    : undefined;\n\n  const xmlV30Url = record.xmlV30Blob\n    ? URL.createObjectURL(record.xmlV30Blob)\n    : record.rawXmlV30\n    ? URL.createObjectURL(new Blob([record.rawXmlV30], { type: 'application/xml' }))\n    : undefined;\n\n  const photos: ClinicalPhoto[] =\n    record.storedPhotos && record.storedPhotos.length \u003e 0\n      ? record.storedPhotos.map((p) =\u003e ({\n          id: p.id,\n          title: p.title,\n          viewName: p.viewName,\n          description: p.description,\n          fileName: p.fileName,\n          src: URL.createObjectURL(p.blob),\n          cameraPreset: p.cameraPreset,\n        }))\n      : record.fallbackPhotos || [];\n\n  return {\n    id: record.id,\n    label: record.label,\n    source: 'custom',\n    metadata: record.metadata,\n    assets: {\n      upperStlUrl,\n      upperStlFileName: record.upperStlFileName,\n      lowerStlUrl,\n      lowerStlFileName: record.lowerStlFileName,\n      rxPdfUrl,\n      rxPdfFileName: record.rxPdfFileName,\n      rxHtmlUrl,\n      rxHtmlFileName: record.rxHtmlFileName,\n      xmlV50Url,\n      xmlV50FileName: record.xmlV50FileName,\n      xmlV30Url,\n      xmlV30FileName: record.xmlV30FileName,\n      logoUrl: record.logoUrl,\n    },\n    photos,\n    defaultMeshStats: record.defaultMeshStats,\n    rawXmlV50: record.rawXmlV50,\n    rawXmlV30: record.rawXmlV30,\n  };\n}\n\n/**\n * Load all persisted custom cases from IndexedDB, sorted by most recently updated\n */\nexport async function loadAllCasesFromIndexedDB(): Promise\u003cDentalCaseBundle[]\u003e {\n  try {\n    const db = await openDatabase();\n    return await new Promise((resolve, reject) =\u003e {\n      const tx = db.transaction(STORE_CASES, 'readonly');\n      const store = tx.objectStore(STORE_CASES);\n      const req = store.getAll();\n      req.onsuccess = () =\u003e {\n        db.close();\n        const records = (req.result as StoredCaseRecord[]) || [];\n        records.sort((a, b) =\u003e (b.updatedAt || 0) - (a.updatedAt || 0));\n        resolve(records.map(hydrateCaseBundleFromRecord));\n      };\n      req.onerror = () =\u003e {\n        db.close();\n        reject(req.error);\n      };\n    });\n  } catch (err) {\n    console.warn('IndexedDB unavailable or failed to read:', err);\n    return [];\n  }\n}\n\nexport function saveLastActiveCaseId(caseId: string): void {\n  try {\n    localStorage.setItem(LAST_ACTIVE_CASE_KEY, caseId);\n  } catch {\n    // ignore storage errors\n  }\n}\n\nexport function getLastActiveCaseId(): string | null {\n  try {\n    return localStorage.getItem(LAST_ACTIVE_CASE_KEY);\n  } catch {\n    return null;\n  }\n}\n"},"src/utils/i18n.ts":{"path":"src/utils/i18n.ts","lines":{"total":100,"covered":89,"skipped":11,"pct":89},"functions":{"total":3,"covered":3,"skipped":0,"pct":100},"branches":{"total":33,"covered":27,"skipped":6,"pct":81.82},"lineDetails":{"3":{"hits":1},"9":{"hits":1,"branches":{"total":1,"taken":1}},"10":{"hits":5332,"branches":{"total":2,"taken":2}},"11":{"hits":5 .search\n        : '';\n    if (rawSearch) {\n      const params = new URLSearchParams(rawSearch);\n      const qLang = (params.get('lang') || params.get('locale') || '').trim().toLowerCase();\n      if (qLang.startsWith('zh')) return 'zh-TW';\n      if (qLang.startsWith('en')) return 'en';\n    }\n  } catch {\n    // ignore URL parse errors\n  }\n\n  try {\n    const nav =\n      customNav !== undefined\n        ? customNav\n        : typeof navigator !== 'undefined'\n        ? navigator\n        : undefined;\n    if (nav) {\n      const candidates: string[] = [];\n      if (Array.isArray(nav.languages) && nav.languages.length \u003e 0) {\n        candidates.push(...nav.languages);\n      }\n      if (typeof nav.language === 'string' && nav.language.trim()) {\n        candidates.push(nav.language);\n      }\n      const primary = candidates.find((c) =\u003e typeof c === 'string' && c.trim().length \u003e 0);\n      if (primary && primary.trim().toLowerCase().startsWith('zh')) {\n        return 'zh-TW';\n      }\n    }\n  } catch {\n    // ignore navigator access errors\n  }\n\n  return 'en';\n}\n\n/**\n * Localizes preset or dynamic 3D caliper measurement labels when switching between zh-TW and en.\n */\nexport function localizeCaliperLabel(label: string, locale: LocaleMode): string {\n  const map: Record\u003cstring, { zh: string; en: string }\u003e = {\n    '上顎尖牙間距 (U3-U3)': {\n      zh: '上顎尖牙間距 (U3-U3)',\n      en: 'Upper Intercanine (U3-U3)',\n    },\n    'Upper Intercanine (U3-U3)': {\n      zh: '上顎尖牙間距 (U3-U3)',\n      en: 'Upper Intercanine (U3-U3)',\n    },\n    '大臼齒間寬 (U6-U6)': {\n      zh: '大臼齒間寬 (U6-U6)',\n      en: 'Upper Intermolar (U6-U6)',\n    },\n    'Upper Intermolar (U6-U6)': {\n      zh: '大臼齒間寬 (U6-U6)',\n      en: 'Upper Intermolar (U6-U6)',\n    },\n    '下顎尖牙間寬 (L3-L3)': {\n      zh: '下顎尖牙間寬 (L3-L3)',\n      en: 'Lower Intercanine (L3-L3)',\n    },\n    'Lower Intercanine (L3-L3)': {\n      zh: '下顎尖牙間寬 (L3-L3)',\n      en: 'Lower Intercanine (L3-L3)',\n    },\n    '前牙水平覆蓋 (Overjet)': {\n      zh: '前牙水平覆蓋 (Overjet)',\n      en: 'Anterior Overjet (OJ)',\n    },\n    'Anterior Overjet (OJ)': {\n      zh: '前牙水平覆蓋 (Overjet)',\n      en: 'Anterior Overjet (OJ)',\n    },\n  };\n\n  if (map[label]) {\n    return locale === 'en' ? map[label].en : map[label].zh;\n  }\n\n  const dynMatch = label.match(/^(?:3D 測距|3D Caliper) #(\\d+)$/);\n  if (dynMatch) {\n    return locale === 'en' ? `3D Caliper #${dynMatch[1]}` : `3D 測距 #${dynMatch[1]}`;\n  }\n\n  return label;\n}\n"},"src/utils/occlusogram.ts":{"path":"src/utils/occlusogram.ts","lines":{"total":282,"covered":184,"skipped":98,"pct":65.25},"functions":{"total":6,"covered":4,"skipped":2,"pct":66.67},"branches":{"total":56,"covered":47,"skipped":9,"pct":83.93},"lineDetails":{"1":{"hits":1},"27":{"hits":1},"28":{"hits":1},"29":{"hits":1},"30":{"hits":1},"31":{"hits":1},"32":{"hits":1},"33":{"hits":1},"34":{"hits":1},"41":{"hits":1,"branches":{"total":1,"taken":1}},"42":{"hits":7},"43":{"hits":7},"44":{"hits":7},"45":{"hits":7,"branches":{"total":2,"taken":2}},"46":{"hits":2},"47":{"hits":2,"branches":{"total":1,"taken":1}},"50":{"hits":7,"branches":{"total":1,"taken":1}},"51":{"hits":1},"52":{"hits":1,"branches":{"total":1,"taken":1}},"54":{"hits":4},"55":{"hits":4},"56":{"hits":4},"57":{"hits":4},"58":{"hits":4},"59":{"hits":4},"60":{"hits":4},"62":{"hits":7,"branches":{"total":1,"taken":1}},"63":{"hits":10},"64":{"hits":10},"65":{"hits":10,"branches":{"total":1,"taken":1}},"66":{"hits":4},"67":{"hits":4},"68":{"hits":4},"69":{"hits":4},"70":{"hits":4},"71":{"hits":4},"72":{"hits":4},"73":{"hits":10,"branches":{"total":1,"taken":0}},"75":{"hits":0},"76":{"hits":0},"83":{"hits":1,"branches":{"total":1,"taken":1}},"84":{"hits":6},"85":{"hits":6},"86":{"hits":6},"87":{"hits":6},"88":{"hits":6},"89":{"hits":6},"90":{"hits":6},"91":{"hits":6},"92":{"hits":6},"94":{"hits":6},"95":{"hits":6},"96":{"hits":6},"98":{"hits":6},"99":{"hits":6,"branches":{"total":1,"taken":1}},"1 Upper: boolean;\n  resolution: number;\n  bounds: OcclusalMapBounds;\n  /** Z height in mm for each cell; NaN if cell has no occlusal surface */\n  heights: Float32Array;\n  /** Area of a single grid cell in mm^2 */\n  cellAreaMm2: number;\n}\n\nexport const DEFAULT_OCCLUSAL_BOUNDS: OcclusalMapBounds = {\n  minX: -36,\n  maxX: 36,\n  minY: -50,\n  maxY: 14,\n  minZ: -25,\n  maxZ: 25,\n};\n\n/**\n * Map an inter-arch clearance distance (in mm) to an RGB color [r, g, b] in 0..1\n * following the clinical Occlusogram color scale.\n * Returns null if clearance exceeds maxRangeMm (no occlusal contact).\n */\nexport function clearanceToOcclusogramRGB(\n  clearanceMm: number,\n  maxRangeMm = 1.6\n): [number, number, number] | null {\n  if (!Number.isFinite(clearanceMm) || clearanceMm \u003e maxRangeMm) {\n    return null;\n  }\n\n  // \u003c= 0.0 mm: Heavy contact / penetration (Red / Magenta-Red)\n  if (clearanceMm \u003c= 0.0) {\n    return [0.94, 0.18, 0.22]; // #ef2e38\n  }\n\n  const stops: Array\u003c{ d: number; rgb: [number, number, number] }\u003e = [\n    { d: 0.0, rgb: [0.94, 0.18, 0.22] }, // Red (0.0 mm collision)\n    { d: 0.25, rgb: [0.98, 0.45, 0.09] }, // Orange (0.25 mm tight contact)\n    { d: 0.55, rgb: [0.92, 0.72, 0.05] }, // Yellow (0.55 mm moderate contact)\n    { d: 0.95, rgb: [0.13, 0.77, 0.37] }, // Green (0.95 mm functional contact)\n    { d: Math.max(1.1, maxRangeMm), rgb: [0.02, 0.65, 0.91] }, // Cyan-Blue (light clearance)\n  ];\n\n  for (let i = 0; i \u003c stops.length - 1; i++) {\n    const a = stops[i];\n    const b = stops[i + 1];\n    if (clearanceMm \u003e= a.d && clearanceMm \u003c= b.d) {\n      const t = (clearanceMm - a.d) / Math.max(0.0001, b.d - a.d);\n      return [\n        Number((a.rgb[0] + (b.rgb[0] - a.rgb[0]) * t).toFixed(4)),\n        Number((a.rgb[1] + (b.rgb[1] - a.rgb[1]) * t).toFixed(4)),\n        Number((a.rgb[2] + (b.rgb[2] - a.rgb[2]) * t).toFixed(4)),\n      ];\n    }\n  }\n\n  return stops[stops.length - 1].rgb;\n}\n\n/**\n * Build a 2D XY Occlusal Elevation Map from 3D vertex positions (and optional normals).\n * - For Upper arch (isUpper = true): captures the minimum (most inferior/occlusal) Z per XY cell.\n * - For Lower arch (isUpper = false): captures the maximum (most superior/occlusal) Z per XY cell.\n */\nexport function buildOcclusalElevationMap(\n  positions: ArrayLike\u003cnumber\u003e,\n  normals: ArrayLike\u003cnumber\u003e | null | undefined,\n  isUpper: boolean,\n  bounds: OcclusalMapBounds = DEFAULT_OCCLUSAL_BOUNDS,\n  resolution = 96\n): OcclusalElevationMap {\n  const res = Math.max(8, resolution);\n  const heights = new Float32Array(res * res);\n  heights.fill(NaN);\n\n  const spanX = Math.max(0.001, bounds.maxX - bounds.minX);\n  const spanY = Math.max(0.001, bounds.maxY - bounds.minY);\n  const cellAreaMm2 = (spanX / res) * (spanY / res);\n\n  const vertexCount = Math.floor(positions.length / 3);\n  for (let i = 0; i \u003c vertexCount; i++) {\n    const idx = i * 3;\n    const x = positions[idx];\n    const y = positions[idx + 1];\n    const z = positions[idx + 2];\n\n    // Filter out base/gingival vertices far from occlusal plane\n    if (isUpper && z \u003e 8.5) continue;\n    if (!isUpper && z \u003c -6.5) continue;\n\n    // If normals are provided, prefer occlusal-facing vertices\n    if (normals && normals.length \u003e= idx + 3) {\n      const nz = normals[idx + 2];\n      if (isUpper && nz \u003e 0.25) continue;\n      if (!isUpper && nz \u003c -0.25) continue;\n    }\n\n    const gx = Math.floor(((x - bounds.minX) / spanX) * res);\n    const gy = Math.floor(((y - bounds.minY) / spanY) * res);\n    if (gx \u003c 0 || gx \u003e= res || gy \u003c 0 || gy \u003e= res) continue;\n\n    const cellIdx = gy * res + gx;\n    const current = heights[cellIdx];\n    if (Number.isNaN(current)) {\n      heights[cellIdx] = z;\n    } else if (isUpper) {\n      // Upper arch occlusal cusps point downward (-Z)\n      if (z \u003c current) heights[cellIdx] = z;\n    } else {\n      // Lower arch occlusal cusps point upward (+Z)\n      if (z \u003e current) heights[cellIdx] = z;\n    }\n  }\n\n  // 1-pass 3x3 morphological smoothing/dilation to fill tiny sub-cell triangle gaps\n  const filled = new Float32Array(heights);\n  for (let y = 1; y \u003c res - 1; y++) {\n    for (let x = 1; x \u003c res - 1; x++) {\n      const cIdx = y * res + x;\n      if (!Number.isNaN(heights[cIdx])) continue;\n\n      let sum = 0;\n      let count = 0;\n      for (let dy = -1; dy \u003c= 1; dy++) {\n        for (let dx = -1; dx \u003c= 1; dx++) {\n          const nVal = heights[(y + dy) * res + (x + dx)];\n          if (!Number.isNaN(nVal)) {\n            sum += nVal;\n            count++;\n          }\n        }\n      }\n      if (count \u003e= 4) {\n        filled[cIdx] = sum / count;\n      }\n    }\n  }\n\n  return {\n    isUpper,\n    resolution: res,\n    bounds,\n    heights: filled,\n    cellAreaMm2,\n  };\n}\n\n/**\n * Sample height Z (in mm) at (x, y) from an OcclusalElevationMap.\n * Returns NaN if out of bounds or no occlusal surface at (x, y).\n */\nexport function sampleElevationMapAtXY(\n  map: OcclusalElevationMap,\n  x: number,\n  y: number\n): number {\n  const { bounds, resolution, heights } = map;\n  const u = (x - bounds.minX) / Math.max(0.001, bounds.maxX - bounds.minX);\n  const v = (y - bounds.minY) / Math.max(0.001, bounds.maxY - bounds.minY);\n  if (u \u003c 0 || u \u003e= 1 || v \u003c 0 || v \u003e= 1) return NaN;\n\n  const gx = Math.min(resolution - 1, Math.max(0, Math.floor(u * resolution)));\n  const gy = Math.min(resolution - 1, Math.max(0, Math.floor(v * resolution)));\n  return heights[gy * resolution + gx];\n}\n\n/**\n * Compute real-time Occlusogram contact statistics given Upper & Lower elevation maps\n * and the current MandibularKinematicsResult.\n */\nexport function computeOcclusogramStats(\n  upperMap: OcclusalElevationMap,\n  lowerMap: OcclusalElevationMap,\n  kinematics: MandibularKinematicsResult,\n  maxRangeMm = 1.6\n): OcclusogramStats {\n  const { resolution, bounds, heights: lowerHeights, cellAreaMm2 } = lowerMap;\n  const spanX = bounds.maxX - bounds.minX;\n  const spanY = bounds.maxY - bounds.minY;\n\n  let minClearance = Infinity;\n  let clearanceSum = 0;\n  let contactCount = 0;\n  let heavyCollisionCount = 0;\n  let leftContacts = 0;\n  let rightContacts = 0;\n  let anteriorContacts = 0;\n  let posteriorContacts = 0;\n\n  for (let gy = 0; gy \u003c resolution; gy++) {\n    const localY = bounds.minY + ((gy + 0.5) / resolution) * spanY;\n    for (let gx = 0; gx \u003c resolution; gx++) {\n      const localZ = lowerHeights[gy * resolution + gx];\n      if (Number.isNaN(localZ)) continue;\n\n      const localX = bounds.minX + ((gx + 0.5) / resolution) * spanX;\n      const worldLower: Point3D = transformPoint3DByMatrix4(\n        { x: localX, y: localY, z: localZ },\n        kinematics.lowerMatrixElements\n      );\n\n      const upperLocalZ = sampleElevationMapAtXY(upperMap, worldLower.x, worldLower.y);\n      if (Number.isNaN(upperLocalZ)) continue;\n\n      const worldUpperZ = upperLocalZ + kinematics.upperPosition.z;\n      const clearance = worldUpperZ - worldLower.z;\n\n      if (clearance \u003c minClearance) {\n        minClearance = clearance;\n      }\n\n      if (clearance \u003c= maxRangeMm) {\n        contactCount++;\n        clearanceSum += Math.max(0, clearance);\n\n        if (clearance \u003c= 0.2) {\n          heavyCollisionCount++;\n        }\n        if (worldLower.x \u003e= 0) {\n          leftContacts++;\n        } else {\n          rightContacts++;\n        }\n        if (worldLower.y \u003e= -15) {\n          anteriorContacts++;\n        } else {\n          posteriorContacts++;\n        }\n      }\n    }\n  }\n\n  const totalLR = leftContacts + rightContacts;\n  const totalAP = anteriorContacts + posteriorContacts;\n\n  return {\n    minClearanceMm: Number.isFinite(minClearance) ? Number(minClearance.toFixed(2)) : 99.9,\n    meanContactClearanceMm:\n      contactCount \u003e 0 ? Number((clearanceSum / contactCount).toFixed(2)) : 0,\n    contactAreaMm2: Number((contactCount * cellAreaMm2).toFixed(1)),\n    heavyCollisionAreaMm2: Number((heavyCollisionCount * cellAreaMm2).toFixed(1)),\n    leftContactPercent: totalLR \u003e 0 ? Math.round((leftContacts / totalLR) * 100) : 50,\n    rightContactPercent:\n      totalLR \u003e 0 ? 100 - Math.round((leftContacts / totalLR) * 100) : 50,\n    anteriorContactPercent:\n      totalAP \u003e 0 ? Math.round((anteriorContacts / totalAP) * 100) : 0,\n    posteriorContactPercent:\n      totalAP \u003e 0 ? 100 - Math.round((anteriorContacts / totalAP) * 100) : 0,\n    totalContactPoints: contactCount,\n  };\n}\n\n/**\n * Encode an OcclusalElevationMap into a 16-bit fixed-point RGBA DataTexture for WebGL shaders.\n * R = high byte, G = low byte, A = 255 if valid cell, 0 if empty.\n */\nexport function createElevationDataTexture(map: OcclusalElevationMap): THREE.DataTexture {\n  const { resolution, heights, bounds } = map;\n  const data = new Uint8Array(resolution * resolution * 4);\n  const spanZ = Math.max(0.001, bounds.maxZ - bounds.minZ);\n\n  for (let i = 0; i \u003c resolution * resolution; i++) {\n    const z = heights[i];\n    const base = i * 4;\n    if (Number.isNaN(z)) {\n      data[base] = 0;\n      data[base + 1] = 0;\n      data[base + 2] = 0;\n      data[base + 3] = 0;\n    } else {\n      const norm = Math.max(0, Math.min(1, (z - bounds.minZ) / spanZ));\n      const int16 = Math.round(norm * 65535);\n      data[base] = (int16 \u003e\u003e 8) & 0xff;\n      data[base + 1] = int16 & 0xff;\n      data[base + 2] = 128;\n      data[base + 3] = 255;\n    }\n  }\n\n  const tex = new THREE.DataTexture(data, resolution, resolution, THREE.RGBAFormat);\n  tex.minFilter = THREE.NearestFilter;\n  tex.magFilter = THREE.NearestFilter;\n  tex.wrapS = THREE.ClampToEdgeWrapping;\n  tex.wrapT = THREE.ClampToEdgeWrapping;\n  tex.needsUpdate = true;\n  return tex;\n}\n\n/**\n * Create a Three.js MeshPhysicalMaterial that renders real-time 60 FPS Occlusogram\n * contact heatmaps on the occlusal surfaces as the jaw moves along its articulation curve.\n */\nexport function createOcclusogramMaterial(params: {\n  isUpper: boolean;\n  opposingElevationTex: THREE.DataTexture;\n  bounds: OcclusalMapBounds;\n  maxRangeMm: number;\n  lowerMatrix: THREE.Matrix4;\n  lowerInverseMatrix: THREE.Matrix4;\n  upperZOffset: number;\n  wireframe: boolean;\n  clippingPlanes: THREE.Plane[];\n}): {\n  material: THREE.MeshPhysicalMaterial;\n  updateKinematicsUniforms: (\n    lowerMat: THREE.Matrix4,\n    lowerInvMat: THREE.Matrix4,\n    upperZ: number,\n    maxRange: number\n  ) =\u003e void;\n} {\n  const {\n    isUpper,\n    opposingElevationTex,\n    bounds,\n    maxRangeMm,\n    lowerMatrix,\n    lowerInverseMatrix,\n    upperZOffset,\n    wireframe,\n    clippingPlanes,\n  } = params;\n\n  const mat = new THREE.MeshPhysicalMaterial({\n    color: 0xf8fafc,\n    roughness: 0.26,\n    metalness: 0.03,\n    clearcoat: 0.42,\n    clearcoatRoughness: 0.18,\n    ior: 1.54,\n    side: THREE.DoubleSide,\n    wireframe,\n  });\n  mat.clippingPlanes = clippingPlanes;\n\n  const uniformsRef = {\n    uOpposingTex: { value: opposingElevationTex },\n    uBoundsMin: { value: new THREE.Vector3(bounds.minX, bounds.minY, bounds.minZ) },\n    uBoundsMax: { value: new THREE.Vector3(bounds.maxX, bounds.maxY, bounds.maxZ) },\n    uLowerMatrix: { value: lowerMatrix.clone() },\n    uLowerInvMatrix: { value: lowerInverseMatrix.clone() },\n    uUpperZOffset: { value: upperZOffset },\n    uMaxRangeMm: { value: maxRangeMm },\n    uIsUpper: { value: isUpper ? 1.0 : 0.0 },\n  };\n\n  mat.onBeforeCompile = (shader) =\u003e {\n    Object.assign(shader.uniforms, uniformsRef);\n\n    shader.vertexShader =\n      `\n      varying vec3 vOccLocalPos;\n      varying vec3 vOccLocalNormal;\n      ` +\n      shader.vertexShader.replace(\n        '#include \u003cbegin_vertex\u003e',\n        `\n        #include \u003cbegin_vertex\u003e\n        vOccLocalPos = position;\n        vOccLocalNormal = objectNormal;\n        `\n      );\n\n    shader.fragmentShader =\n      `\n      uniform sampler2D uOpposingTex;\n      uniform vec3 uBoundsMin;\n      uniform vec3 uBoundsMax;\n      uniform mat4 uLowerMatrix;\n      uniform mat4 uLowerInvMatrix;\n      uniform float uUpperZOffset;\n      uniform float uMaxRangeMm;\n      uniform float uIsUpper;\n\n      varying vec3 vOccLocalPos;\n      varying vec3 vOccLocalNormal;\n\n      vec3 occlusogramHeatColor(float d, float maxR) {\n        if (d \u003c= 0.0) {\n          return vec3(0.94, 0.15, 0.22); // Heavy contact / collision red\n        }\n        if (d \u003c= 0.25) {\n          return mix(vec3(0.94, 0.15, 0.22), vec3(0.98, 0.48, 0.08), d / 0.25);\n        }\n        if (d \u003c= 0.55) {\n          return mix(vec3(0.98, 0.48, 0.08), vec3(0.92, 0.78, 0.05), (d - 0.25) / 0.30);\n        }\n        if (d \u003c= 0.95) {\n          return mix(vec3(0.92, 0.78, 0.05), vec3(0.12, 0.78, 0.36), (d - 0.55) / 0.40);\n        }\n        return mix(vec3(0.12, 0.78, 0.36), vec3(0.02, 0.65, 0.92), clamp((d - 0.95) / max(0.15, maxR - 0.95), 0.0, 1.0));\n      }\n      ` +\n      shader.fragmentShader.replace(\n        '#include \u003ccolor_fragment\u003e',\n        `\n        #include \u003ccolor_fragment\u003e\n        {\n          vec3 N = normalize(vOccLocalNormal);\n          // Only shade occlusal-facing surfaces\n          float occFacing = uIsUpper \u003e 0.5\n            ? smoothstep(0.15, -0.25, N.z) * smoothstep(7.5, 4.0, vOccLocalPos.z)\n            : smoothstep(-0.15, 0.25, N.z) * smoothstep(-5.5, -2.0, vOccLocalPos.z);\n\n          if (occFacing \u003e 0.01) {\n            vec3 span = max(uBoundsMax - uBoundsMin, vec3(0.001));\n            float clearance = 99.0;\n            float validSample = 0.0;\n\n            if (uIsUpper \u003e 0.5) {\n              // Upper tooth point in world space -\u003e transform into lower arch local space\n              vec3 worldUpper = vec3(vOccLocalPos.x, vOccLocalPos.y, vOccLocalPos.z + uUpperZOffset);\n              vec3 lowerLocal = (uLowerInvMatrix * vec4(worldUpper, 1.0)).xyz;\n              vec2 uv = (lowerLocal.xy - uBoundsMin.xy) / span.xy;\n              if (uv.x \u003e= 0.0 && uv.x \u003c= 1.0 && uv.y \u003e= 0.0 && uv.y \u003c= 1.0) {\n                vec4 enc = texture2D(uOpposingTex, uv);\n                if (enc.a \u003e 0.5) {\n                  float normZ = (enc.r * 255.0 * 256.0 + enc.g * 255.0) / 65535.0;\n                  float oppLocalZ = uBoundsMin.z + normZ * span.z;\n                  clearance = lowerLocal.z - oppLocalZ;\n                  validSample = 1.0;\n                }\n              }\n            } else {\n              // Lower tooth point in local space -\u003e transform into world space to lookup upper map\n              vec3 worldLower = (uLowerMatrix * vec4(vOccLocalPos, 1.0)).xyz;\n              vec2 uv = (worldLower.xy - uBoundsMin.xy) / span.xy;\n              if (uv.x \u003e= 0.0 && uv.x \u003c= 1.0 && uv.y \u003e= 0.0 && uv.y \u003c= 1.0) {\n                vec4 enc = texture2D(uOpposingTex, uv);\n                if (enc.a \u003e 0.5) {\n                  float normZ = (enc.r * 255.0 * 256.0 + enc.g * 255.0) / 65535.0;\n                  float upperZ = uBoundsMin.z + normZ * span.z + uUpperZOffset;\n                  clearance = upperZ - worldLower.z;\n                  validSample = 1.0;\n                }\n              }\n            }\n\n            if (validSample \u003e 0.5 && clearance \u003c= uMaxRangeMm) {\n              vec3 heatCol = occlusogramHeatColor(clearance, uMaxRangeMm);\n              float fade = 1.0 - smoothstep(uMaxRangeMm * 0.78, uMaxRangeMm, clearance);\n              diffuseColor.rgb = mix(diffuseColor.rgb, heatCol, occFacing * clamp(fade + 0.15, 0.0, 1.0));\n            }\n          }\n        }\n        `\n      );\n  };\n\n  mat.customProgramCacheKey = () hRect","line":76,"hits":0},{"name":"loadPentaViewTextures","line":106,"hits":0},{"name":"computePentaProjectedUVs","line":140,"hits":6},{"name":"clamp01","line":155,"hits":36},{"name":"mix","line":156,"hits":48},{"name":"createPentaTexturedMaterial","line":212,"hits":0}],"sourceCode":"import * as THREE from 'three';\nimport { ClinicalPhoto } from '../types/dental';\n\nexport interface LoadedPentaTextures {\n  front?: THREE.Texture;\n  upper?: THREE.Texture;\n  lower?: THREE.Texture;\n  right?: THREE.Texture;\n  left?: THREE.Texture;\n  rects: {\n    front: THREE.Vector4;\n    upper: THREE.Vector4;\n    lower: THREE.Vector4;\n    right: THREE.Vector4;\n    left: THREE.Vector4;\n  };\n}\n\n/**\n * Scan an image on an offscreen canvas to find the normalized WebGL UV bounding box\n * [uMin, uMax, vMin, vMax] of non-white pixels (the dental model silhouette).\n */\nexport function computeImageContentUVRect(img: HTMLImageElement): THREE.Vector4 {\n  try {\n    const w = 480;\n    const h = Math.max(1, Math.round((img.height / img.width) * w));\n    const canvas = document.createElement('canvas');\n    canvas.width = w;\n    canvas.height = h;\n    const ctx = canvas.getContext('2d');\n    if (!ctx) return new THREE.Vector4(0.15, 0.85, 0.15, 0.85);\n\n    ctx.drawImage(img, 0, 0, w, h);\n    const { data } = ctx.getImageData(0, 0, w, h);\n\n    let minX = w;\n    let maxX = 0;\n    let minY = h;\n    let maxY = 0;\n    let found = false;\n\n    for (let y = 0; y \u003c h; y++) {\n      for (let x = 0; x \u003c w; x++) {\n        const idx = (y * w + x) * 4;\n        const r = data[idx];\n        const g = data[idx + 1];\n        const b = data[idx + 2];\n        const a = data[idx + 3];\n        // Non-white and non-transparent pixel\n        if (a \u003e 20 && (r \u003c 245 || g \u003c 245 || b \u003c 245)) {\n          if (x \u003c minX) minX = x;\n          if (x \u003e maxX) maxX = x;\n          if (y \u003c minY) minY = y;\n          if (y \u003e maxY) maxY = y;\n          found = true;\n        }\n      }\n    }\n\n    if (!found || maxX \u003c= minX || maxY \u003c= minY) {\n      return new THREE.Vector4(0.15, 0.85, 0.15, 0.85);\n    }\n\n    const uMin = minX / w;\n    const uMax = maxX / w;\n    // WebGL flipY = true: v=0 is bottom (y=h), v=1 is top (y=0)\n    const vMin = 1.0 - maxY / h;\n    const vMax = 1.0 - minY / h;\n\n    return new THREE.Vector4(uMin, uMax, vMin, vMax);\n  } catch {\n    return new THREE.Vector4(0.15, 0.85, 0.15, 0.85);\n  }\n}\n\nfunction loadSingleTextureWithRect(\n  url?: string\n): Promise\u003c{ texture?: THREE.Texture; rect: THREE.Vector4 }\u003e {\n  if (!url) {\n    return Promise.resolve({ rect: new THREE.Vector4(0, 1, 0, 1) });\n  }\n  return new Promise((resolve) =\u003e {\n    const img = new Image();\n    img.crossOrigin = 'anonymous';\n    img.onload = () =\u003e {\n      const rect = computeImageContentUVRect(img);\n      const tex = new THREE.Texture(img);\n      tex.colorSpace = THREE.SRGBColorSpace;\n      tex.minFilter = THREE.LinearFilter;\n      tex.magFilter = THREE.LinearFilter;\n      tex.wrapS = THREE.ClampToEdgeWrapping;\n      tex.wrapT = THREE.ClampToEdgeWrapping;\n      tex.needsUpdate = true;\n      resolve({ texture: tex, rect });\n    };\n    img.onerror = () =\u003e {\n      resolve({ rect: new THREE.Vector4(0, 1, 0, 1) });\n    };\n    img.src = url;\n  });\n}\n\n/**\n * Load all 5 penta view textures from ClinicalPhoto array and compute their content bounding rects\n */\nexport async function loadPentaViewTextures(\n  photos: ClinicalPhoto[]\n): Promise\u003cLoadedPentaTextures\u003e {\n  const findSrc = (id: string) =\u003e photos.find((p) =\u003e p.id === id)?.src;\n\n  const [frontRes, upperRes, lowerRes, rightRes, leftRes] = await Promise.all([\n    loadSingleTextureWithRect(findSrc('front')),\n    loadSingleTextureWithRect(findSrc('upper')),\n    loadSingleTextureWithRect(findSrc('lower')),\n    loadSingleTextureWithRect(findSrc('patientright')),\n    loadSingleTextureWithRect(findSrc('patientleft')),\n  ]);\n\n  return {\n    front: frontRes.texture,\n    upper: upperRes.texture,\n    lower: lowerRes.texture,\n    right: rightRes.texture,\n    left: leftRes.texture,\n    rects: {\n      front: frontRes.rect,\n      upper: upperRes.rect,\n      lower: lowerRes.rect,\n      right: rightRes.rect,\n      left: leftRes.rect,\n    },\n  };\n}\n\n/**\n * Pure helper to compute the exact WebGL UV coordinates for each of the 5 clinical views\n * given a 3D vertex position P, arch bounding box, and combined bounding box.\n * Exported for deterministic unit testing of 3D-to-2D orthographic registration.\n */\nexport function computePentaProjectedUVs(params: {\n  point: { x: number; y: number; z: number };\n  isUpper: boolean;\n  archMin: { x: number; y: number; z: number };\n  archMax: { x: number; y: number; z: number };\n  combMin: { x: number; y: number; z: number };\n  combMax: { x: number; y: number; z: number };\n  rects: {\n    front: { x: number; y: number; z: number; w: number };\n    occlusal: { x: number; y: number; z: number; w: number };\n    right: { x: number; y: number; z: number; w: number };\n    left: { x: number; y: number; z: number; w: number };\n  };\n}) {\n  const { point: P, isUpper, archMin, archMax, combMin, combMax, rects } = params;\n  const clamp01 = (v: number) =\u003e Math.max(0, Math.min(1, v));\n  const mix = (a: number, b: number, t: number) =\u003e a + (b - a) * t;\n\n  const nArch = {\n    x: clamp01((P.x - archMin.x) / Math.max(0.001, archMax.x - archMin.x)),\n    y: clamp01((P.y - archMin.y) / Math.max(0.001, archMax.y - archMin.y)),\n    z: clamp01((P.z - archMin.z) / Math.max(0.001, archMax.z - archMin.z)),\n  };\n\n  const nComb = {\n    x: clamp01((P.x - combMin.x) / Math.max(0.001, combMax.x - combMin.x)),\n    y: clamp01((P.y - combMin.y) / Math.max(0.001, combMax.y - combMin.y)),\n    z: clamp01((P.z - combMin.z) / Math.max(0.001, combMax.z - combMin.z)),\n  };\n\n  // In STL coordinate ue) {\n      const { done, value } = await reader.read();\n      if (done) break;\n      if (value) {\n        chunks.push(value);\n        total += value.byteLength;\n      }\n    }\n\n    const out = new Uint8Array(total || expectedSize);\n    let offset = 0;\n    for (const chunk of chunks) {\n      out.set(chunk, offset);\n      offset += chunk.byteLength;\n    }\n    return out;\n  }\n  throw new Error('DecompressionStream(deflate-raw) is not supported in this browser.');\n}\n\n/**\n * Extracts dental scan files (.stl, .xml, .jpg, .png, .pdf, .html) from a ZIP ArrayBuffer/Blob/File.\n */\nexport async function extractDentalFilesFromZip(\n  zipSource: ArrayBuffer | Blob | File\n): Promise\u003cFile[]\u003e {\n  const buffer =\n    zipSource instanceof ArrayBuffer ? zipSource : await zipSource.arrayBuffer();\n  const view = new DataView(buffer);\n  const bytes = new Uint8Array(buffer);\n  const decoder = new TextDecoder('utf-8');\n\n  // 1. Locate End of Central Directory (EOCD) record (signature 0x06054b50)\n  const maxCommentLen = 65535;\n  const searchStart = Math.max(0, buffer.byteLength - 22 - maxCommentLen);\n  let eocdOffset = -1;\n  for (let i = buffer.byteLength - 22; i \u003e= searchStart; i--) {\n    if (view.getUint32(i, true) === 0x06054b50) {\n      eocdOffset = i;\n      break;\n    }\n  }\n\n  const extractedFiles: File[] = [];\n\n  if (eocdOffset !== -1) {\n    const totalEntries = view.getUint16(eocdOffset + 10, true);\n    const cdOffset = view.getUint32(eocdOffset + 16, true);\n    let ptr = cdOffset;\n\n    for (let idx = 0; idx \u003c totalEntries && ptr + 46 \u003c= buffer.byteLength; idx++) {\n      const sig = view.getUint32(ptr, true);\n      if (sig !== 0x02014b50) break;\n\n      const compressionMethod = view.getUint16(ptr + 10, true);\n      const compressedSize = view.getUint32(ptr + 20, true);\n      const uncompressedSize = view.getUint32(ptr + 24, true);\n      const fileNameLen = view.getUint16(ptr + 28, true);\n      const extraLen = view.getUint16(ptr + 30, true);\n      const commentLen = view.getUint16(ptr + 32, true);\n      const localHeaderOffset = view.getUint32(ptr + 42, true);\n\n      const rawEntryName = decoder\n        .decode(bytes.subarray(ptr + 46, ptr + 46 + fileNameLen))\n        .replace(/\\\\/g, '/');\n      ptr += 46 + fileNameLen + extraLen + commentLen;\n\n      // Skip directories and macOS resource forks (__MACOSX or ._*)\n      const baseName = rawEntryName.split('/').pop() || '';\n      if (\n        !baseName ||\n        rawEntryName.endsWith('/') ||\n        rawEntryName.includes('__MACOSX/') ||\n        baseName.startsWith('._') ||\n        !DENTAL_FILE_EXT_REGEX.test(baseName)\n      ) {\n        continue;\n      }\n\n      if (localHeaderOffset + 30 \u003e buffer.byteLength) continue;\n      const localSig = view.getUint32(localHeaderOffset, true);\n      if (localSig !== 0x04034b50) continue;\n\n      const localNameLen = view.getUint16(localHeaderOffset + 26, true);\n      const localExtraLen = view.getUint16(localHeaderOffset + 28, true);\n      const dataStart = localHeaderOffset + 30 + localNameLen + localExtraLen;\n      const compressedSlice = bytes.subarray(dataStart, dataStart + compressedSize);\n\n      let fileBytes: Uint8Array;\n      if (compressionMethod === 0) {\n        fileBytes = compressedSlice;\n      } else if (compressionMethod === 8) {\n        fileBytes = await inflateRawBytes(compressedSlice, uncompressedSize);\n      } else {\n        continue;\n      }\n\n      const copy = new Uint8Array(fileBytes.byteLength);\n      copy.set(fileBytes);\n      extractedFiles.push(\n        new File([copy], baseName, { type: getMimeTypeForFilename(baseName) })\n      );\n    }\n\n    return extractedFiles;\n  }\n\n  // Fallback: Sequential Local File Header scan (0x04034b50)\n  let offset = 0;\n  while (offset + 30 \u003c= buffer.byteLength) {\n    const sig = view.getUint32(offset, true);\n    if (sig !== 0x04034b50) break;\n\n    const compressionMethod = view.getUint16(offset + 8, true);\n    const compressedSize = view.getUint32(offset + 18, true);\n    const uncompressedSize = view.getUint32(offset + 22, true);\n    const fileNameLen = view.getUint16(offset + 26, true);\n    const extraLen = view.getUint16(offset + 28, true);\n\n    const rawEntryName = decoder\n      .decode(bytes.subarray(offset + 30, offset + 30 + fileNameLen))\n      .replace(/\\\\/g, '/');\n    const dataStart = offset + 30 + fileNameLen + extraLen;\n    offset = dataStart + compressedSize;\n\n    const baseName = rawEntryName.split('/').pop() || '';\n    if (\n      !baseName ||\n      rawEntryName.endsWith('/') ||\n      rawEntryName.includes('__MACOSX/') ||\n      baseName.startsWith('._') ||\n      !DENTAL_FILE_EXT_REGEX.test(baseName)\n    ) {\n      continue;\n    }\n\n    const compressedSlice = bytes.subarray(dataStart, dataStart + compressedSize);\n    let fileBytes: Uint8Array;\n    if (compressionMethod === 0) {\n      fileBytes = compressedSlice;\n    } else if (compressionMethod === 8) {\n      fileBytes = await inflateRawBytes(compressedSlice, uncompressedSize);\n    } else {\n      continue;\n    }\n\n    const copy = new Uint8Array(fileBytes.byteLength);\n    copy.set(fileBytes);\n    extractedFiles.push(\n      new File([copy], baseName, { type: getMimeTypeForFilename(baseName) })\n    );\n  }\n\n  return extractedFiles;\n}\n\n/**\n * Expands a FileList or File[] by transparently unpacking any .zip archives into their constituent dental files.\n */\nexport async function expandUploadedFilesWithZip(\n  fileList: FileList | File[]\n): Promise\u003cFile[]\u003e {\n  const inputFiles = Array.from(fileList);\n  const result: File[] = [];\n\n  for (const file of inputFiles) {\n    if (file.name.toLowerCase().endsWith('.zip')) {\n      try {\n        const unzipped = await extractDentalFilesFromZip(file);\n        result.push(...unzipped);\n      } catch (err) {\n        console.warn(`Failed to extract ZIP archive ${file.name}:`, err);\n      }\n    } else {\n      result.push(file);\n    }\n  }\n\n  return result;\n}\n\nexport interface ParsedUrlDataParam {\n  rawParam: string;\n  cleanedUrlOrPath: string;\n  fileName: string;\n  inferredCaseId: string | null;\n  isLocalFilePath: boolean;\n  isRemoteHttpUrl: boolean;\n}\n\n/**\n * Parses a ?url=... query parameter (supports wrapped quotes like ?url=\"/Users/.../OrthoCAD_Export_297077963.zip\").\n */\nexport function parseUrlDataParameter(rawParam: string): ParsedUrlDataParam {\n  const cleanedUrlOrPath = rawParam.trim().replace(/^['\"]+|['\"]+$/g, '').trim();\n  const normalizedSlashes = cleanedUrlOrPath.replace(/\\\\/g, '/');\n  const fileName = normalizedSlashes.split('/').pop()?.split('?')[0] || cleanedUrlOrPath;\n\n  // Extract numeric case ID if present (e.g. OrthoCAD_Export_297077963.zip -\u003e 297077963)\n  const idMatch =\n    fileName.match(/(\\d{5,})/) ||\n    fileName.match(/^(\\d+)_/) ||\n    cleanedUrlOrPath.match(/(\\d{5,})/);\n  const inferredCaseId = idMatch ? idMatch[1] : null;\n\n  const isRemoteHttpUrl = /^https?:\\/\\//i.test(cleanedUrlOrPath);\n  const isLocalFilePath =\n    !isRemoteHttpUrl &&\n    (cleanedUrlOrPath.startsWith('/') ||\n      cleanedUrlOrPath.startsWith('~/') ||\n      /^file:\\/\\//i.test(cleanedUrlOrPath) ||\n      /^[a-zA-Z]:[\\\\/]/.test(cleanedUrlOrPath));\n\n  return {\n    rawParam,\n    cleanedUrlOrPath,\n    fileName,\n    inferredCaseId,\n    isLocalFilePath,\n    isRemoteHttpUrl,\n  };\n}\n\n/**\n * Helper to create an uncompressed (STORE, method 0) ZIP ArrayBuffer in memory for testing or export.\n */\nexport function createUncompressedZipBuffer(\n  entries: Array\u003c{ name: string; content: Uint8Array | string }\u003e\n): ArrayBuffer {\n  const encoder = new TextEncoder();\n  const prepared = entries.map((e) =\u003e ({\n    nameBytes: encoder.encode(e.name),\n    dataBytes: typeof e.content === 'string' ? encoder.encode(e.content) : e.content,\n  }));\n\n  let localTotalSize = 0;\n  let cdTotalSize = 0;\n  for (const item of prepared) {\n    localTotalSize += 30 + item.nameBytes.byteLength + item.dataBytes.byteLength;\n    cdTotalSize += 46 + item.nameBytes.byteLength;\n  }\n\n  const totalSize = localTotalSize + cdTotalSize + 22;\n  const buffer = new ArrayBuffer(totalSize);\n  const view = new DataView(buffer);\n  const bytes = new Uint8Array(buffer);\n\n  let localOffset = 0;\n  const localOffsets: number[] = [];\n\n  for (const item of prepared) {\n    localOffsets.push(localOffset);\n    view.setUint32(localOffset, 0x04034b50, true); // Local file header signature\n    view.setUint16(localOffset + 4, 20, true); // Version needed\n    view.setUint16(localOffset + 6, 0, true); // Flags\n    view.setUint16(localOffset + 8, 0, true); // Compression method 0 (STORE)\n    view.setUint32(localOffset + 18, item.dataBytes.byteLength, true); // Compressed size\n    view.setUint32(localOffset + 22, item.dataBytes.byteLength, true); // Uncompressed size\n    view.setUint16(localOffset + 26, item.nameBytes.byteLength, true); // File name length\n    view.setUint16(localOffset + 28, 0, true); // Extra length\n\n    bytes.set(item.nameBytes, localOffset + 30);\n    bytes.set(item.dataBytes, localOffset + 30 + item.nameBytes.byteLength);\n    localOffset += 30 + item.nameBytes.byteLength + item.dataBytes.byteLength;\n  }\n\n  let cdOffset = localOffset;\n  for (let i = 0; i \u003c prepared.length; i++) {\n    const item = prepared[i];\n    view.setUint32(cdOffset, 0x02014b50, true); // Central directory signature\n    view.setUint16(cdOffset + 4, 20, true);\n    view.setUint16(cdOffset + 6, 20, true);\n    view.setUint16(cdOffset + 10, 0, true); // Method 0 (STORE)\n    view.setUint32(cdOffset + 20, item.dataBytes.byteLength, true);\n    view.setUint32(cdOffset + 24, item.dataBytes.byteLength, true);\n    view.setUint16(cdOffset + 28, item.nameBytes.byteLength, true);\n    view.setUint32(cdOffset + 42, localOffsets[i], true);\n\n    bytes.set(item.nameBytes, cdOffset + 46);\n    cdOffset += 46 + item.nameBytes.byteLength;\n  }\n\n  // End of Central Directory (EOCD)\n  view.setUint32(cdOffset, 0x06054b50, true);\n  view.setUint16(cdOffset + 8, prepared.length, true);\n  view.setUint16(cdOffset + 10, prepared.length, true);\n  view.setUint32(cdOffset + 12, cdTotalSize, true);\n  view.setUint32(cdOffset + 16, localOffset, true);\n\n  return buffer;\n}\n"}},"folderChildren":{"":{"subfolders":["src"],"files":[]},"src":{"subfolders":["src/components","src/data","src/types","src/utils"],"files":["src/App.tsx"]},"src/components":{"subfolders":[],"files":["src/components/ArticulatorPanel.tsx","src/components/AskAiDrawer.tsx","src/components/CadToolsPanel.tsx","src/components/CaseDossier.tsx","src/components/DentalViewer3D.tsx","src/components/Header.tsx","src/components/PentaGallery.tsx","src/components/XmlInspector.tsx"]},"src/data":{"subfolders":[],"files":["src/data/caseData.ts"]},"src/types":{"subfolders":[],"files":["src/types/dental.ts"]},"src/utils":{"subfolders":[],"files":["src/utils/anonymize.ts","src/utils/archMeasurements.ts","src/utils/articulatorKinematics.ts","src/utils/caseStorage.ts","src/utils/i18n.ts","src/utils/occlusogram.ts","src/utils/pentaTextureShader.ts","src/utils/proceduralArch.ts","src/utils/zipExtractor.ts"]}},"commits":[{"commit":{"sha":"e409bb476d875ed0157be7f216b624626fd04e4b","shortSha":"e409bb4","message":"fix(ui): resolve mobile button overlap, 3D orbit drag snap-back, and add collapsible sidebar","author":"Yongjhih Chen","date":"2026-11-11T17:35:08.000Z","branch":"main"},"summary":{"lines":{"total":6934,"covered":4773,"skipped":2161,"pct":68.83},"functions":{"total":202,"covered":79,"skipped":123,"pct":39.11},"branches":{"total":774,"covered":520,"skipped":254,"pct":67.18}},"folderSummaries":{"":{"lines":{"total":6934,"covered":4773,"skipped":2161,"pct":68.83},"functions":{"total":202,"covered":79,"skipped":123,"pct":39.11},"branches":{"total":774,"covered":520,"skipped":254,"pct":
