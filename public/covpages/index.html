<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Unit test coverage report with multi-commit trends powered by covpages">
  <meta name="color-scheme" content="light dark">
  <title>DentalCAD Pages Coverage - covpages</title>
  <style>

/* Primer-inspired GitHub theme design tokens (Restrained & Impeccable compliant) */
:root {
  color-scheme: light dark;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --color-canvas-default: #ffffff;
  --color-canvas-subtle: #f6f8fa;
  --color-canvas-inset: #f6f8fa;
  --color-canvas-overlay: #ffffff;
  --color-border-default: #d0d7de;
  --color-border-muted: #d8dee4;
  --color-fg-default: #1f2328;
  --color-fg-muted: #59636e;
  --color-fg-subtle: #656d76;
  --color-accent-fg: #0969da;
  --color-accent-emphasis: #0969da;
  --color-accent-subtle: rgba(9, 105, 218, 0.08);
  --color-success-fg: #1a7f37;
  --color-success-emphasis: #1f883d;
  --color-success-subtle: rgba(26, 127, 55, 0.08);
  --color-success-line: rgba(26, 127, 55, 0.06);
  --color-success-gutter: rgba(26, 127, 55, 0.14);
  --color-danger-fg: #cf222e;
  --color-danger-emphasis: #cf222e;
  --color-danger-subtle: rgba(207, 34, 46, 0.08);
  --color-danger-line: rgba(207, 34, 46, 0.07);
  --color-danger-gutter: rgba(207, 34, 46, 0.15);
  --color-attention-fg: #9a6700;
  --color-attention-emphasis: #9a6700;
  --color-attention-subtle: rgba(154, 103, 0, 0.08);
  --color-neutral-subtle: rgba(129, 139, 152, 0.1);
  --color-neutral-emphasis: #656d76;
  --color-tab-indicator: #1f2328;

  --color-btn-bg: #f6f8fa;
  --color-btn-border: #d0d7de;
  --color-btn-hover-bg: #eaeef2;
  --color-btn-primary-bg: #1f883d;
  --color-btn-primary-fg: #ffffff;
  --color-btn-primary-border: #1a7f37;
  --color-btn-primary-hover-bg: #1a7f37;

  --chart-grid: #eaeef2;
  --chart-line: #0969da;
  --chart-fill: rgba(9, 105, 218, 0.08);

  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --shadow-sm: 0 1px 0 rgba(31, 35, 40, 0.04);
  --shadow-rest: 0 4px 12px rgba(31, 35, 40, 0.08), 0 1px 2px rgba(31, 35, 40, 0.06);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-color-mode="light"]) {
    color-scheme: dark;
    --color-canvas-default: #0d1117;
    --color-canvas-subtle: #161b22;
    --color-canvas-inset: #010409;
    --color-canvas-overlay: #161b22;
    --color-border-default: #30363d;
    --color-border-muted: #21262d;
    --color-fg-default: #e6edf3;
    --color-fg-muted: #8b949e;
    --color-fg-subtle: #6e7681;
    --color-accent-fg: #4493f8;
    --color-accent-emphasis: #1f6feb;
    --color-accent-subtle: rgba(56, 139, 253, 0.1);
    --color-success-fg: #3fb950;
    --color-success-emphasis: #238636;
    --color-success-subtle: rgba(46, 160, 67, 0.1);
    --color-success-line: rgba(46, 160, 67, 0.07);
    --color-success-gutter: rgba(46, 160, 67, 0.16);
    --color-danger-fg: #f85149;
    --color-danger-emphasis: #da3633;
    --color-danger-subtle: rgba(248, 81, 73, 0.1);
    --color-danger-line: rgba(248, 81, 73, 0.08);
    --color-danger-gutter: rgba(248, 81, 73, 0.18);
    --color-attention-fg: #d29922;
    --color-attention-emphasis: #9e6a03;
    --color-attention-subtle: rgba(187, 128, 9, 0.1);
    --color-neutral-subtle: rgba(110, 118, 129, 0.12);
    --color-neutral-emphasis: #6e7681;
    --color-tab-indicator: #e6edf3;

    --color-btn-bg: #21262d;
    --color-btn-border: #30363d;
    --color-btn-hover-bg: #30363d;
    --color-btn-primary-bg: #238636;
    --color-btn-primary-fg: #ffffff;
    --color-btn-primary-border: rgba(240, 246, 252, 0.1);
    --color-btn-primary-hover-bg: #1a7f37;

    --chart-grid: #21262d;
    --chart-line: #388bfd;
    --chart-fill: rgba(56, 139, 253, 0.1);
    --shadow-rest: 0 8px 24px rgba(1, 4, 9, 0.45), 0 1px 3px rgba(1, 4, 9, 0.3);
  }
}

:root[data-theme="dark"],
:root[data-color-mode="dark"] {
  color-scheme: dark;
  --color-canvas-default: #0d1117;
  --color-canvas-subtle: #161b22;
  --color-canvas-inset: #010409;
  --color-canvas-overlay: #161b22;
  --color-border-default: #30363d;
  --color-border-muted: #21262d;
  --color-fg-default: #e6edf3;
  --color-fg-muted: #8b949e;
  --color-fg-subtle: #6e7681;
  --color-accent-fg: #4493f8;
  --color-accent-emphasis: #1f6feb;
  --color-accent-subtle: rgba(56, 139, 253, 0.1);
  --color-success-fg: #3fb950;
  --color-success-emphasis: #238636;
  --color-success-subtle: rgba(46, 160, 67, 0.1);
  --color-success-line: rgba(46, 160, 67, 0.07);
  --color-success-gutter: rgba(46, 160, 67, 0.16);
  --color-danger-fg: #f85149;
  --color-danger-emphasis: #da3633;
  --color-danger-subtle: rgba(248, 81, 73, 0.1);
  --color-danger-line: rgba(248, 81, 73, 0.08);
  --color-danger-gutter: rgba(248, 81, 73, 0.18);
  --color-attention-fg: #d29922;
  --color-attention-emphasis: #9e6a03;
  --color-attention-subtle: rgba(187, 128, 9, 0.1);
  --color-neutral-subtle: rgba(110, 118, 129, 0.12);
  --color-neutral-emphasis: #6e7681;
  --color-tab-indicator: #e6edf3;

  --color-btn-bg: #21262d;
  --color-btn-border: #30363d;
  --color-btn-hover-bg: #30363d;
  --color-btn-primary-bg: #238636;
  --color-btn-primary-fg: #ffffff;
  --color-btn-primary-border: rgba(240, 246, 252, 0.1);
  --color-btn-primary-hover-bg: #1a7f37;

  --chart-grid: #21262d;
  --chart-line: #388bfd;
  --chart-fill: rgba(56, 139, 253, 0.1);
  --shadow-rest: 0 8px 24px rgba(1, 4, 9, 0.45), 0 1px 3px rgba(1, 4, 9, 0.3);
}

:root[data-theme="light"],
:root[data-color-mode="light"] {
  color-scheme: light;
  --color-canvas-default: #ffffff;
  --color-canvas-subtle: #f6f8fa;
  --color-canvas-inset: #f6f8fa;
  --color-canvas-overlay: #ffffff;
  --color-border-default: #d0d7de;
  --color-border-muted: #d8dee4;
  --color-fg-default: #1f2328;
  --color-fg-muted: #59636e;
  --color-fg-subtle: #656d76;
  --color-accent-fg: #0969da;
  --color-accent-emphasis: #0969da;
  --color-accent-subtle: rgba(9, 105, 218, 0.08);
  --color-success-fg: #1a7f37;
  --color-success-emphasis: #1f883d;
  --color-success-subtle: rgba(26, 127, 55, 0.08);
  --color-success-line: rgba(26, 127, 55, 0.06);
  --color-success-gutter: rgba(26, 127, 55, 0.14);
  --color-danger-fg: #cf222e;
  --color-danger-emphasis: #cf222e;
  --color-danger-subtle: rgba(207, 34, 46, 0.08);
  --color-danger-line: rgba(207, 34, 46, 0.07);
  --color-danger-gutter: rgba(207, 34, 46, 0.15);
  --color-attention-fg: #9a6700;
  --color-attention-emphasis: #9a6700;
  --color-attention-subtle: rgba(154, 103, 0, 0.08);
  --color-neutral-subtle: rgba(129, 139, 152, 0.1);
  --color-neutral-emphasis: #656d76;
  --color-tab-indicator: #1f2328;

  --color-btn-bg: #f6f8fa;
  --color-btn-border: #d0d7de;
  --color-btn-hover-bg: #eaeef2;
  --color-btn-primary-bg: #1f883d;
  --color-btn-primary-fg: #ffffff;
  --color-btn-primary-border: #1a7f37;
  --color-btn-primary-hover-bg: #1a7f37;

  --chart-grid: #eaeef2;
  --chart-line: #0969da;
  --chart-fill: rgba(9, 105, 218, 0.08);
  --shadow-rest: 0 4px 12px rgba(31, 35, 40, 0.08), 0 1px 2px rgba(31, 35, 40, 0.06);
}

*, *::before, *::after {
  box-sizing: border-box;
}

::selection {
  background-color: var(--color-accent-subtle);
  color: var(--color-fg-default);
}

html {
  scrollbar-color: var(--color-border-default) transparent;
}

body {
  margin: 0;
  padding: 0;
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-default);
  caret-color: var(--color-fg-default);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

a {
  text-underline-offset: 0.2em;
}

/* Header bar */
.gh-header {
  background-color: var(--color-canvas-subtle);
  border-bottom: 1px solid var(--color-border-default);
  padding: 12px 24px;
}

.gh-header-inner {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.gh-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--color-fg-default);
  font-weight: 600;
  font-size: 15px;
}

.gh-brand-icon {
  display: flex;
  align-items: center;
  color: var(--color-fg-default);
}

.gh-repo-title {
  color: var(--color-fg-muted);
  font-weight: 500;
}

.gh-header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* GitHub Primer Buttons & Selectors */
.gh-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 500;
  line-height: 20px;
  color: var(--color-fg-default);
  background-color: var(--color-btn-bg);
  border: 1px solid var(--color-btn-border);
  border-radius: var(--radius-md);
  cursor: pointer;
  text-decoration: none;
  transition: background-color 120ms cubic-bezier(0.25, 1, 0.5, 1), border-color 120ms cubic-bezier(0.25, 1, 0.5, 1);
  box-shadow: var(--shadow-sm);
  user-select: none;
}

.gh-btn:hover {
  background-color: var(--color-btn-hover-bg);
  border-color: var(--color-btn-border);
}

.gh-btn:active {
  background-color: var(--color-neutral-subtle);
}

.gh-btn:focus-visible {
  outline: 2px solid var(--color-accent-fg);
  outline-offset: 1px;
}

.gh-btn-primary {
  color: var(--color-btn-primary-fg) !important;
  background-color: var(--color-btn-primary-bg);
  border-color: var(--color-btn-primary-border);
  font-weight: 500;
}

.gh-btn-primary:hover {
  background-color: var(--color-btn-primary-hover-bg);
  border-color: var(--color-btn-primary-border);
  opacity: 1;
}

/* Ref (Branch/Tag) Selector Popover */
.ref-selector-wrap {
  position: relative;
}

.ref-selector-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}

.ref-btn-label {
  font-weight: 600;
  max-width: 140px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.dropdown-caret {
  font-size: 10px;
  margin-left: 2px;
  color: var(--color-fg-muted);
}

.ref-popover {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  width: 300px;
  background-color: var(--color-canvas-overlay);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-rest);
  z-index: 100;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.ref-popover-header {
  padding: 8px 10px;
  background-color: var(--color-canvas-subtle);
  border-bottom: 1px solid var(--color-border-default);
}

.ref-popover-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.ref-popover-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-fg-default);
}

.ref-popover-close {
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px 6px;
  font-size: 13px;
  color: var(--color-fg-muted);
  border-radius: var(--radius-sm);
}

.ref-popover-close:hover {
  color: var(--color-fg-default);
  background-color: var(--color-neutral-subtle);
}

.ref-search-wrap {
  margin-bottom: 8px;
}

.ref-search-input {
  width: 100%;
  padding: 5px 8px;
  font-size: 12px;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-sm);
  outline: none;
}

.ref-search-input::placeholder {
  color: var(--color-fg-muted);
  opacity: 1;
}

.ref-search-input:focus {
  border-color: var(--color-accent-fg);
  box-shadow: 0 0 0 2px var(--color-accent-subtle);
}

.ref-tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--color-border-muted);
  margin-top: 4px;
}

.ref-tab {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 4px 8px;
  font-size: 12px;
  color: var(--color-fg-muted);
  cursor: pointer;
  margin-bottom: -1px;
}

.ref-tab:hover {
  color: var(--color-fg-default);
}

.ref-tab.active {
  color: var(--color-fg-default);
  border-bottom-color: var(--color-tab-indicator);
  font-weight: 600;
}

.ref-list {
  max-height: 250px;
  overflow-y: auto;
  padding: 4px 0;
}

.ref-item {
  display: flex;
  align-items: center;
  padding: 6px 12px;
  font-size: 12px;
  color: var(--color-fg-default);
  cursor: pointer;
  gap: 8px;
  text-decoration: none;
}

.ref-item:hover, .ref-item.active {
  background-color: var(--color-canvas-subtle);
}

.ref-item.selected {
  font-weight: 600;
}

.ref-item-check {
  width: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-fg-default);
  flex-shrink: 0;
}

.ref-item-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ref-item-badge {
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  margin-left: auto;
  color: var(--color-fg-muted);
  background-color: var(--color-neutral-subtle);
}

.ref-empty {
  padding: 16px 12px;
  text-align: center;
  color: var(--color-fg-muted);
  font-size: 12px;
}

/* Tabs */
.gh-nav-tabs {
  background-color: var(--color-canvas-subtle);
  border-bottom: 1px solid var(--color-border-default);
  padding: 0 24px;
}

.gh-nav-tabs-inner {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  gap: 8px;
  overflow-x: auto;
}

.gh-tab {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  font-size: 14px;
  font-weight: 500;
  color: var(--color-fg-muted);
  text-decoration: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  white-space: nowrap;
}

.gh-tab:hover {
  color: var(--color-fg-default);
}

.gh-tab.active {
  color: var(--color-fg-default);
  font-weight: 600;
  border-bottom-color: var(--color-tab-indicator);
}

.gh-tab .counter {
  display: inline-block;
  padding: 0 6px;
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  line-height: 18px;
  color: var(--color-fg-muted);
  background-color: var(--color-neutral-subtle);
  border-radius: 20px;
}

/* Main Container */
.gh-container {
  max-width: 1280px;
  width: 100%;
  margin: 0 auto;
  padding: 24px;
  flex: 1;
}

/* Compact Summary Strip (replaces oversized hero metric cards) */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  background-color: var(--color-canvas-default);
  margin-bottom: 20px;
  overflow: hidden;
}

.metric-card {
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border-right: 1px solid var(--color-border-muted);
}

.metric-card:last-child {
  border-right: none;
}

.metric-title {
  font-size: 12px;
  font-weight: 500;
  color: var(--color-fg-muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.metric-value-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 8px;
}

.metric-percent {
  font-size: 20px;
  font-weight: 600;
  line-height: 1.2;
  font-family: var(--font-sans);
  font-variant-numeric: tabular-nums;
  color: var(--color-fg-default);
}

.metric-counts {
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  color: var(--color-fg-muted);
}

/* Progress bar */
.progress-bar-container {
  height: 4px;
  background-color: var(--color-border-muted);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 4px;
}

.progress-bar-fill {
  height: 100%;
  border-radius: 2px;
}

/* Delta badges */
.delta-badge {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 1px 6px;
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  border-radius: var(--radius-sm);
  line-height: 16px;
  border: 1px solid transparent;
}

.delta-badge.positive {
  color: var(--color-success-fg);
  background-color: var(--color-success-subtle);
}

.delta-badge.negative {
  color: var(--color-danger-fg);
  background-color: var(--color-danger-subtle);
}

.delta-badge.neutral {
  color: var(--color-fg-muted);
  background-color: var(--color-neutral-subtle);
}

/* GitHub Commit Banner */
.commit-banner {
  background-color: var(--color-canvas-subtle);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  padding: 10px 16px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.commit-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.commit-author-avatar {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background-color: var(--color-neutral-subtle);
  border: 1px solid var(--color-border-default);
  color: var(--color-fg-default);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
}

.commit-message {
  font-weight: 500;
  color: var(--color-fg-default);
}

.commit-meta {
  color: var(--color-fg-muted);
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.commit-sha-badge {
  font-family: var(--font-mono);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  background-color: var(--color-neutral-subtle);
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  color: var(--color-fg-muted);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* Toolbar & Breadcrumbs */
.file-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  flex-wrap: wrap;
  gap: 12px;
}

.breadcrumbs {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: var(--color-fg-muted);
  flex-wrap: wrap;
}

.breadcrumb-item {
  color: var(--color-accent-fg);
  text-decoration: none;
  font-weight: 500;
  cursor: pointer;
}

.breadcrumb-item:hover {
  text-decoration: underline;
}

.breadcrumb-separator {
  color: var(--color-fg-muted);
}

.search-box {
  position: relative;
  min-width: 220px;
}

.search-box input {
  width: 100%;
  padding: 5px 10px 5px 30px;
  font-size: 13px;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  outline: none;
}

.search-box input::placeholder {
  color: var(--color-fg-muted);
  opacity: 1;
}

.search-box input:focus {
  border-color: var(--color-accent-fg);
  box-shadow: 0 0 0 3px var(--color-accent-subtle);
}

.search-icon {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--color-fg-muted);
  display: flex;
  align-items: center;
  pointer-events: none;
  z-index: 1;
}

/* File Table */
.gh-box {
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  overflow: hidden;
  margin-bottom: 24px;
}

.table-wrapper {
  overflow-x: auto;
  max-inline-size: 100%;
}

table.gh-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 13px;
}

table.gh-table th {
  background-color: var(--color-canvas-subtle);
  color: var(--color-fg-muted);
  font-weight: 600;
  padding: 8px 16px;
  border-bottom: 1px solid var(--color-border-default);
  white-space: nowrap;
  user-select: none;
}

table.gh-table th.sortable {
  cursor: pointer;
}

table.gh-table th.sortable:hover {
  color: var(--color-fg-default);
}

table.gh-table td {
  padding: 8px 16px;
  border-top: 1px solid var(--color-border-muted);
  color: var(--color-fg-default);
  vertical-align: middle;
  font-variant-numeric: tabular-nums;
}

table.gh-table tbody tr:first-child td {
  border-top: none;
}

table.gh-table tbody tr:hover td {
  background-color: var(--color-canvas-subtle);
}

.file-name-cell {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
}

.file-name-cell svg {
  color: var(--color-fg-muted);
}

.file-link {
  color: var(--color-fg-default);
  text-decoration: none;
  cursor: pointer;
}

.file-link:hover {
  color: var(--color-accent-fg);
  text-decoration: underline;
}

/* Rate Pill (Primer + shadcn/ui subtle badge) */
.rate-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  min-width: 48px;
  border: 1px solid transparent;
}

.rate-high {
  color: var(--color-fg-default);
  background-color: var(--color-neutral-subtle);
  border-color: var(--color-border-muted);
}

.rate-medium {
  color: var(--color-attention-fg);
  background-color: var(--color-attention-subtle);
}

.rate-low {
  color: var(--color-danger-fg);
  background-color: var(--color-danger-subtle);
}

/* Charts */
.chart-container {
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  padding: 20px;
  margin-bottom: 24px;
}

.chart-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 12px;
}

.chart-title {
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--color-fg-default);
}

.chart-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.svg-chart {
  width: 100%;
  height: 220px;
  overflow: visible;
}

.chart-dot {
  transition: r 0.15s cubic-bezier(0.25, 1, 0.5, 1), fill 0.15s cubic-bezier(0.25, 1, 0.5, 1);
}

.chart-dot:hover {
  r: 5;
  fill: var(--color-fg-default);
}

.git-blob-link {
  color: var(--color-fg-muted);
  display: inline-flex;
  align-items: center;
  transition: color 0.15s ease;
  text-decoration: none;
}

.git-blob-link:hover {
  color: var(--color-accent-fg);
  text-decoration: none;
}

/* Tooltip */
.chart-tooltip {
  position: absolute;
  background-color: var(--color-canvas-overlay);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  padding: 8px 12px;
  box-shadow: var(--shadow-rest);
  font-size: 12px;
  pointer-events: none;
  z-index: 100;
  opacity: 0;
  transition: opacity 0.15s cubic-bezier(0.25, 1, 0.5, 1);
  white-space: nowrap;
}

/* Code Viewer */
.blob-wrapper {
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  overflow: hidden;
  margin-bottom: 24px;
}

.blob-header {
  background-color: var(--color-canvas-subtle);
  border-bottom: 1px solid var(--color-border-default);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 12px;
  color: var(--color-fg-muted);
}

.blob-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.code-table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 20px;
}

.code-table td {
  padding: 0 8px;
}

.code-table tr:hover td {
  background-color: var(--color-neutral-subtle);
}

.blob-num {
  width: 1%;
  min-width: 48px;
  text-align: right;
  color: var(--color-fg-subtle);
  font-variant-numeric: tabular-nums;
  user-select: none;
  cursor: pointer;
  border-right: 1px solid var(--color-border-muted);
}

.blob-hits {
  width: 1%;
  min-width: 36px;
  text-align: right;
  color: var(--color-fg-muted);
  font-variant-numeric: tabular-nums;
  user-select: none;
  font-size: 11px;
  border-right: 1px solid var(--color-border-muted);
}

.blob-code {
  white-space: pre-wrap;
  word-break: break-all;
  padding-left: 12px !important;
}

/* Line Coverage Highlighting (Softened GitHub Primer diff style) */
tr.line-covered {
  background-color: var(--color-success-line);
}

tr.line-covered .blob-num,
tr.line-covered .blob-hits {
  background-color: var(--color-success-gutter);
}

tr.line-covered .blob-hits {
  color: var(--color-success-fg);
  font-weight: 500;
}

tr.line-uncovered {
  background-color: var(--color-danger-line);
}

tr.line-uncovered .blob-num,
tr.line-uncovered .blob-hits {
  background-color: var(--color-danger-gutter);
}

tr.line-uncovered .blob-hits {
  color: var(--color-danger-fg);
  font-weight: 600;
}

/* GitHub Primer Syntax Highlighting Tokens (Light) */
.token.comment, .token.prolog, .token.doctype, .token.cdata { color: #59636e; font-style: italic; }
.token.punctuation { color: #1f2328; }
.token.property, .token.tag, .token.boolean, .token.number, .token.constant, .token.symbol { color: #0550ae; }
.token.selector, .token.attr-name, .token.string, .token.char, .token.builtin { color: #0a3069; }
.token.operator, .token.entity, .token.url { color: #0550ae; }
.token.atrule, .token.attr-value, .token.keyword { color: #cf222e; font-weight: 500; }
.token.function, .token.class-name { color: #6639ba; }
.token.regex, .token.important, .token.variable { color: #953800; }

/* GitHub Primer Syntax Highlighting Tokens (Dark Mode) */
[data-theme="dark"] .token.comment,
[data-theme="dark"] .token.prolog,
[data-theme="dark"] .token.doctype,
[data-theme="dark"] .token.cdata,
[data-color-mode="dark"] .token.comment,

[data-color-mode="dark"] .token.doctype,
[data-color-mode="dark"] .token.cdata { color: #8b949e; font-style: italic; }
[data-theme="dark"] .token.punctuation,
[data-color-mode="dark"] .token.punctuation { color: #e6edf3; }
[data-theme="dark"] .token.property,
[data-theme="dark"] .token.tag,
[data-theme="dark"] .token.boolean,
[data-theme="dark"] .token.number,
[data-theme="dark"] .token.constant,
[data-theme="dark"] .token.symbol,
[data-color-mode="dark"] .token.property,
[data-color-mode="dark"] .token.tag,
[data-color-mode="dark"] .token.boolean,
[data-color-mode="dark"] .token.number,
[data-color-mode="dark"] .token.constant,
[data-color-mode="dark"] .token.symbol { color: #79c0ff; }
[data-theme="dark"] .token.selector,
[data-theme="dark"] .token.attr-name,
[data-theme="dark"] .token.string,
[data-theme="dark"] .token.char,
[data-theme="dark"] .token.builtin,
[data-color-mode="dark"] .token.selector,
[data-color-mode="dark"] .token.attr-name,
[data-color-mode="dark"] .token.string,
[data-color-mode="dark"] .token.char,
[data-color-mode="dark"] .token.builtin { color: #a5d6ff; }
[data-theme="dark"] .token.operator,
[data-theme="dark"] .token.entity,
[data-theme="dark"] .token.url,
[data-color-mode="dark"] .token.operator,
[data-color-mode="dark"] .token.entity,
[data-color-mode="dark"] .token.url { color: #79c0ff; }
[data-theme="dark"] .token.atrule,
[data-theme="dark"] .token.attr-value,
[data-theme="dark"] .token.keyword,
[data-color-mode="dark"] .token.atrule,
[data-color-mode="dark"] .token.attr-value,
[data-color-mode="dark"] .token.keyword { color: #ff7b72; font-weight: 500; }
[data-theme="dark"] .token.function,
[data-theme="dark"] .token.class-name,
[data-color-mode="dark"] .token.function,
[data-color-mode="dark"] .token.class-name { color: #d2a8ff; }
[data-theme="dark"] .token.regex,
[data-theme="dark"] .token.important,
[data-theme="dark"] .token.variable,
[data-color-mode="dark"] .token.regex,
[data-color-mode="dark"] .token.important,
[data-color-mode="dark"] .token.variable { color: #ffa657; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.comment,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.prolog,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.doctype,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.cdata { color: #8b949e; font-style: italic; }
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.punctuation { color: #e6edf3; }
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.property,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.tag,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.boolean,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.number,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.constant,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.symbol { color: #79c0ff; }
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.selector,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.attr-name,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.string,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.char,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.builtin { color: #a5d6ff; }
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.operator,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.entity,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.url { color: #79c0ff; }
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.atrule,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.attr-value,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.keyword { color: #ff7b72; font-weight: 500; }
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.function,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.class-name { color: #d2a8ff; }
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.regex,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.important,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.variable { color: #ffa657; }
}


/* File Tree Sidebar & Layout */
.files-layout {
  display: flex;
  gap: 16px;
  align-items: flex-start;
  width: 100%;
}

.files-sidebar {
  width: 280px;
  flex-shrink: 0;
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  position: sticky;
  top: 16px;
  max-height: calc(100vh - 32px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.files-layout.sidebar-collapsed .files-sidebar {
  display: none;
}

.files-main {
  flex: 1;
  min-width: 0;
}

.sidebar-header {
  padding: 8px 12px;
  background-color: var(--color-canvas-subtle);
  border-bottom: 1px solid var(--color-border-default);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sidebar-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--color-fg-default);
  display: flex;
  align-items: center;
  gap: 8px;
}

.sidebar-counter {
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  padding: 1px 6px;
  background-color: var(--color-neutral-subtle);
  border-radius: 10px;
  color: var(--color-fg-muted);
}

.sidebar-btn-icon {
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  border-radius: var(--radius-sm);
  color: var(--color-fg-muted);
  display: flex;
  align-items: center;
  justify-content: center;
}

.sidebar-btn-icon:hover {
  color: var(--color-fg-default);
  background-color: var(--color-neutral-subtle);
}

.sidebar-btn-icon:focus-visible {
  outline: 2px solid var(--color-accent-fg);
}

.goto-box {
  padding: 8px 10px;
  border-bottom: 1px solid var(--color-border-muted);
  background-color: var(--color-canvas-default);
  position: relative;
}

.goto-input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

.goto-input {
  width: 100%;
  padding: 5px 28px 5px 28px;
  font-size: 12px;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-subtle);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  outline: none;
}

.goto-input::placeholder {
  color: var(--color-fg-muted);
  opacity: 1;
}

.goto-input:focus {
  background-color: var(--color-canvas-default);
  border-color: var(--color-accent-fg);
  box-shadow: 0 0 0 2px var(--color-accent-subtle);
}

.goto-icon {
  position: absolute;
  left: 8px;
  color: var(--color-fg-muted);
  pointer-events: none;
  display: flex;
  align-items: center;
  z-index: 1;
}

.goto-shortcut {
  position: absolute;
  right: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 1px 4px;
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: 3px;
  color: var(--color-fg-muted);
  pointer-events: none;
  line-height: 14px;
}

.goto-clear {
  position: absolute;
  right: 6px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px;
  color: var(--color-fg-muted);
  display: flex;
  align-items: center;
}

.goto-clear:hover {
  color: var(--color-fg-default);
}

.tree-container {
  overflow-y: auto;
  overflow-x: hidden;
  padding: 6px 4px;
  flex: 1;
}

.tree-node {
  position: relative;
  display: flex;
  align-items: center;
  padding: 4px 8px;
  font-size: 12px;
  line-height: 20px;
  border-radius: var(--radius-sm);
  color: var(--color-fg-default);
  cursor: pointer;
  user-select: none;
  text-decoration: none;
  gap: 6px;
  margin: 1px 0;
  transition: background-color 0.1s ease;
}

.tree-node:hover {
  background-color: var(--color-neutral-subtle);
  color: var(--color-fg-default);
}

.tree-node.selected {
  background-color: var(--color-neutral-subtle);
  color: var(--color-fg-default);
  font-weight: 600;
}

.tree-node.selected::before {
  content: "";
  position: absolute;
  left: 0;
  top: 5px;
  bottom: 5px;
  width: 2px;
  background-color: var(--color-tab-indicator);
  border-radius: 1px;
}

.tree-node:focus-visible {
  outline: 2px solid var(--color-accent-fg);
}

.tree-node[data-tree-folder] .tree-icon {
  color: var(--color-fg-muted);
}

.tree-node[data-tree-file] .tree-icon {
  color: var(--color-fg-subtle);
}

.tree-toggle-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  color: var(--color-fg-muted);
  flex-shrink: 0;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
}

.tree-toggle-spacer {
  width: 16px;
  flex-shrink: 0;
}

.tree-icon {
  display: flex;
  align-items: center;
  flex-shrink: 0;
}

.tree-label {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tree-badge {
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  padding: 0 4px;
  border-radius: var(--radius-sm);
  margin-left: 4px;
  flex-shrink: 0;
  line-height: 16px;
  color: var(--color-fg-muted);
}

.tree-badge-high {
  color: var(--color-fg-muted);
}

.tree-badge-med {
  color: var(--color-attention-fg);
}

.tree-badge-low {
  color: var(--color-danger-fg);
}

.goto-results {
  overflow-y: auto;
  padding: 6px 4px;
  flex: 1;
}

.goto-item {
  position: relative;
  display: flex;
  align-items: center;
  padding: 6px 10px;
  font-size: 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  gap: 8px;
  color: var(--color-fg-default);
  margin: 1px 0;
  transition: background-color 0.1s ease;
}

.goto-item:hover, .goto-item.active {
  background-color: var(--color-neutral-subtle);
}

.goto-item.selected {
  background-color: var(--color-neutral-subtle);
  color: var(--color-fg-default);
  font-weight: 600;
}

.goto-item.selected::before {
  content: "";
  position: absolute;
  left: 0;
  top: 4px;
  bottom: 4px;
  width: 2px;
  background-color: var(--color-tab-indicator);
  border-radius: 1px;
}

.goto-item-path {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--font-mono);
  font-size: 11px;
}

.goto-highlight {
  font-weight: 700;
  color: var(--color-accent-fg);
}

.goto-empty {
  padding: 24px 12px;
  text-align: center;
  color: var(--color-fg-muted);
  font-size: 12px;
}

.sidebar-toggle-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  font-size: 12px;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-subtle);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  cursor: pointer;
}

.sidebar-toggle-btn:hover {
  background-color: var(--color-canvas-default);
  border-color: var(--color-accent-fg);
}

.sidebar-toggle-btn:focus-visible {
  outline: 2px solid var(--color-accent-fg);
}

/* Footer */
.gh-footer {
  border-top: 1px solid var(--color-border-default);
  padding: 24px;
  text-align: center;
  font-size: 12px;
  color: var(--color-fg-muted);
  margin-top: auto;
}

.gh-footer a {
  color: var(--color-accent-fg);
  text-decoration: none;
}

.gh-footer a:hover {
  text-decoration: underline;
}

/* Badge Copy & Modal */
.badge-toolbar-group {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.badge-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 8px;
  font-size: 12px;
  line-height: 18px;
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border-default);
  background-color: var(--color-canvas-subtle);
  color: var(--color-fg-default);
  cursor: pointer;
  user-select: none;
  transition: all 0.15s ease;
}

.badge-btn:hover {
  background-color: var(--color-neutral-subtle);
  border-color: var(--color-border-muted);
}

.badge-btn:focus-visible {
  outline: 2px solid var(--color-accent-fg);
}

.badge-svg-display {
  display: inline-flex;
  align-items: center;
  line-height: 0;
}

.badge-svg-display svg {
  display: block;
  height: 20px;
  width: auto;
  max-width: none;
  border-radius: 3px;
}

.badge-copy-text {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 500;
  font-size: 12px;
}

/* Primer Toast Notification */
.gh-toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 99999;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-overlay);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px rgba(140, 149, 159, 0.2);
  opacity: 0;
  transform: translateY(12px);
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.gh-toast.show {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.gh-toast-icon {
  color: var(--color-success-fg);
  display: flex;
  align-items: center;
}

/* Badge Options Dialog / Popover */
.badge-modal-backdrop {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(0, 0, 0, 0.4);
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.badge-modal {
  background-color: var(--color-canvas-overlay);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
  width: 100%;
  max-width: 520px;
  overflow: hidden;
  animation: modalFadeIn 0.15s ease-out;
}

@keyframes modalFadeIn {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}

.badge-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--color-border-default);
}

.badge-modal-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--color-fg-default);
}

.badge-modal-close {
  background: none;
  border: none;
  color: var(--color-fg-muted);
  cursor: pointer;
  padding: 4px;
  font-size: 16px;
  display: flex;
  align-items: center;
  border-radius: var(--radius-sm);
}

.badge-modal-close:hover {
  color: var(--color-fg-default);
  background-color: var(--color-neutral-subtle);
}

.badge-modal-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.badge-preview-box {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background-color: var(--color-canvas-subtle);
  border-radius: var(--radius-md);
  border: 1px dashed var(--color-border-default);
}

.badge-field-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-fg-default);
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.badge-code-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.badge-code-input {
  width: 100%;
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 6px 60px 6px 10px;
  background-color: var(--color-canvas-subtle);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  color: var(--color-fg-default);
  outline: none;
}

.badge-code-input:focus {
  border-color: var(--color-accent-fg);
  box-shadow: 0 0 0 2px var(--color-accent-subtle);
}

.badge-copy-inline-btn {
  position: absolute;
  right: 4px;
  padding: 3px 8px;
  font-size: 11px;
  font-weight: 500;
  border-radius: var(--radius-sm);
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  color: var(--color-fg-default);
  cursor: pointer;
}

.badge-copy-inline-btn:hover {
  background-color: var(--color-neutral-subtle);
}

/* Responsive adjustments */
@media (max-width: 768px) {
  .gh-header-inner, .file-toolbar, .commit-banner {
    flex-direction: column;
    align-items: flex-start;
  }
  .metrics-grid {
    grid-template-columns: 1fr;
  }
}

  PanelRightClose,\n  PanelRightOpen,\n  ChevronDown,\n  ChevronUp,\n} from 'lucide-react';\n\ntype TabType = 'dossier' | 'articulator' | 'gallery' | 'tools' | 'xml';\ntype MobileLayoutMode = 'split' | '3d' | 'panel';\n\nconst FALLBACK_STATS: MeshGeometryStats = {\n  upperTriangles: 0,\n  lowerTriangles: 0,\n  upperDimensions: { width: 0, depth: 0, height: 0 },\n  lowerDimensions: { width: 0, depth: 0, height: 0 },\n};\n\nconst DEFAULT_OCCLUSOGRAM_STATS: OcclusogramStats = {\n  minClearanceMm: 0.08,\n  meanContactClearanceMm: 0.42,\n  contactAreaMm2: 38.4,\n  heavyCollisionAreaMm2: 4.2,\n  leftContactPercent: 49,\n  rightContactPercent: 51,\n  anteriorContactPercent: 24,\n  posteriorContactPercent: 76,\n  totalContactPoints: 142,\n};\n\nconst THEME_STORAGE_KEY = 'dentalcad_theme';\n\nexport const App: React.FC = () =\u003e {\n  // Theme state (Light / Dark mode)\n  const [theme, setTheme] = useState\u003cThemeMode\u003e(() =\u003e {\n    try {\n      const saved = localStorage.getItem(THEME_STORAGE_KEY);\n      if (saved === 'light' || saved === 'dark') return saved;\n    } catch {\n      // ignore\n    }\n    return 'dark';\n  });\n\n  useEffect(() =\u003e {\n    const root = document.documentElement;\n    if (theme === 'dark') {\n      root.classList.add('dark');\n    } else {\n      root.classList.remove('dark');\n    }\n    try {\n      localStorage.setItem(THEME_STORAGE_KEY, theme);\n    } catch {\n      // ignore\n    }\n  }, [theme]);\n\n  const handleToggleTheme = useCallback(() =\u003e {\n    setTheme((prev) =\u003e (prev === 'dark' ? 'light' : 'dark'));\n  }, []);\n\n  // Language / Locale state: auto-detect browser language; default to English ('en') if non-Chinese or undetectable\n  const [locale, setLocale] = useState\u003cLocaleMode\u003e(() =\u003e detectInitialLocale());\n\n  useEffect(() =\u003e {\n    document.documentElement.lang = locale;\n    try {\n      localStorage.setItem(LOCALE_STORAGE_KEY, locale);\n    } catch {\n      // ignore\n    }\n  }, [locale]);\n\n  const handleToggleLocale = useCallback(() =\u003e {\n    setLocale((prev) =\u003e (prev === 'zh-TW' ? 'en' : 'zh-TW'));\n  }, []);\n\n  // Case Registry state (builtin manifest + browser IndexedDB persisted cases)\n  const [cases, setCases] = useState\u003cDentalCaseBundle[]\u003e([DEFAULT_CASE_BUNDLE]);\n  const [activeCaseId, setActiveCaseId] = useState\u003cstring\u003e(DEFAULT_CASE_BUNDLE.id);\n  const [pendingUrlDataParam, setPendingUrlDataParam] = useState\u003cParsedUrlDataParam | null\u003e(null);\n  const [copiedUrlPath, setCopiedUrlPath] = useState\u003cboolean\u003e(false);\n  const urlParamFileInputRef = useRef\u003cHTMLInputElement\u003e(null);\n\n  // Select case and remember in localStorage\n  const handleSelectCase = useCallback((caseId: string) =\u003e {\n    setActiveCaseId(caseId);\n    saveLastActiveCaseId(caseId);\n  }, []);\n\n  // Load both manifest.json, persisted IndexedDB cases, AND ?url= query parameter on startup\n  useEffect(() =\u003e {\n    Promise.all([fetchCaseManifest(), loadAllCasesFromIndexedDB()]).then(\n      async ([manifest, storedCases]) =\u003e {\n        const storedIds = new Set(storedCases.map((c) =\u003e c.id));\n        const builtinCases = manifest.cases.filter((c) =\u003e !storedIds.has(c.id));\n        const mergedCases = [...storedCases, ...builtinCases];\n        setCases(mergedCases);\n\n        const urlParams = new URLSearchParams(window.location.search);\n        const requestedCase = urlParams.get('case');\n        const rawUrlParam = urlParams.get('url');\n        const lastSavedCaseId = getLastActiveCaseId();\n\n        // Handle ?url=\"...\" query parameter (e.g. ?url=\"/Users/.../Export_297077963.zip\" or https://.../case.zip)\n        if (rawUrlParam) {\n          const parsedUrl = parseUrlDataParameter(rawUrlParam);\n\n          // 1. If the inferred case ID is already persisted in browser IndexedDB, activate it immediately!\n          const existingMatch = parsedUrl.inferredCaseId\n            ? mergedCases.find((c) =\u003e c.id === parsedUrl.inferredCaseId)\n            : undefined;\n          if (existingMatch) {\n            handleSelectCase(existingMatch.id);\n            return;\n          }\n\n          // 2. If it is a remote HTTP/HTTPS URL (or localhost HTTP relay), attempt direct fetch + ZIP unpack\n          if (parsedUrl.isRemoteHttpUrl) {\n            try {\n              const resp = await fetch(parsedUrl.cleanedUrlOrPath);\n              if (resp.ok) {\n                const blob = await resp.blob();\n                const fetchedFile = new File([blob], parsedUrl.fileName, {\n                  type: blob.type || 'application/octet-stream',\n                });\n                const imported = await buildCaseBundleFromFiles(\n                  [fetchedFile],\n                  DEFAULT_CASE_BUNDLE\n                );\n                setCases((prev) =\u003e [\n                  imported,\n                  ...prev.filter((c) =\u003e c.id !== imported.id),\n                ]);\n                handleSelectCase(imported.id);\n                return;\n              }\n            } catch {\n              // Fall through to interactive local/manual picker banner\n            }\n          }\n\n          // 3. Local filesystem path (/Users/..., file://...) or blocked CORS URL:\n          // Browser security sandbox blocks silent reading of local disk paths without user gesture,\n          // so present a 1-click pre-targeted loader banner for that exact path/ZIP.\n          setPendingUrlDataParam(parsedUrl);\n        }\n\n        if (requestedCase && mergedCases.some((c) =\u003e c.id === requestedCase)) {\n          setActiveCaseId(requestedCase);\n        } else if (lastSavedCaseId && mergedCases.some((c) =\u003e c.id === lastSavedCaseId)) {\n          setActiveCaseId(lastSavedCaseId);\n        } else if (storedCases.length \u003e 0) {\n          setActiveCaseId(storedCases[0].id);\n        } else if (manifest.defaultCaseId) {\n          setActiveCaseId(manifest.defaultCaseId);\n        }\n      }\n    );\n  }, [handleSelectCase]);\n\n  const activeCase = useMemo(\n    () =\u003e cases.find((c) =\u003e c.id === activeCaseId) || cases[0] || DEFAULT_CASE_BUNDLE,\n    [cases, activeCaseId]\n  );\n\n  // Dynamic mesh statistics computed directly from the loaded STL geometries\n  const [meshStats, setMeshStats] = useState\u003cMeshGeometryStats\u003e(\n    activeCase.defaultMeshStats || FALLBACK_STATS\n  );\n\n  // Occlusogram & Arch Metrics\n  const [occlusogramStats, setOcclusogramStats] = useState\u003cOcclusogramStats\u003e(\n    DEFAULT_OCCLUSOGRAM_STATS\n  );\n  const [archMetrics, setArchMetrics] = useState\u003cOrthoArchMetrics\u003e(\n    DEFAULT_ORTHO_ARCH_METRICS\n  );\n  const [caliperMeasurements, setCaliperMeasurements] = useState\u003cCaliperMeasurement[]\u003e([\n    createCaliperMeasurement(\n      'init-u3',\n      '上顎尖牙間距 (U3-U3)',\n      { x: -17.4, y: -6.2, z: 1.5 },\n      { x: 17.4, y: -6.2, z: 1.5 }\n    ),\n  ]);\n\n  useEffect(() =\u003e {\n    if (activeCase.defaultMeshStats) {\n      setMeshStats(activeCase.defaultMeshStats);\n    }\n  }, [activeCase]);\n\n  const handleMeshStatsComputed = useCallback(\n    (stats: MeshGeometryStats) =\u003e {\n      setMeshStats(stats);\n      if (activeCase.source === 'custom') {\n        updateStoredCaseMeshStats(activeCase.id, stats);\n      }\n    },\n    [activeCase.id, activeCase.source]\n  );\n\n  const handleAddCaliperMeasurement = useCallback((pointA: Point3D, pointB: Point3D) =\u003e {\n    setCaliperMeasurements((prev) =\u003e {\n      const nextIdx = prev.length + 1;\n      const m = createCaliperMeasurement(\n        `caliper-${Date.now()}-${nextIdx}`,\n        `3D 測距 #${nextIdx}`,\n        pointA,\n        pointB\n      );\n      return [m, ...prev];\n    });\n  }, []);\n\n  const handleAddPresetCaliperMeasurement = useCallback(() =\u003e {\n    setCaliperMeasurements((prev) =\u003e {\n      const nextIdx = prev.length + 1;\n      const presets: Array\u003c{ label: string; a: Point3D; b: Point3D }\u003e = [\n        {\n          label: '大臼齒間寬 (U6-U6)',\n          a: { x: -26.3, y: -28.0, z: 1.2 },\n          b: { x: 26.3, y: -28.0, z: 1.2 },\n        },\n        {\n          label: '下顎尖牙間寬 (L3-L3)',\n          a: { x: -13.7, y: -5.4, z: 0.4 },\n          b: { x: 13.7, y: -5.4, z: 0.4 },\n        },\n        {\n          label: '前牙水平覆蓋 (Overjet)',\n          a: { x: 0.0, y: 8.6, z: 1.2 },\n          b: { x: 0.0, y: 6.0, z: 1.2 },\n        },\n      ];\n      const pick = presets[(nextIdx - 1) % presets.length];\n      const m = createCaliperMeasurement(\n        `preset-${Date.now()}-${nextIdx}`,\n        pick.label,\n        pick.a,\n        pick.b\n      );\n      return [m, ...prev];\n    });\n  }, []);\n\n  const handleClearCaliperMeasurements = useCallback(() =\u003e {\n    setCaliperMeasurements([]);\n  }, []);\n\n  // Privacy toggle (HIPAA / clinical presentation - default ON)\n  const [anonymizePatient, setAnonymizePatient] = useState\u003cboolean\u003e(true);\n\n  // Active right pane tab (default to Articulator & Occlusogram)\n  const [activeTab, setActiveTab] = useState\u003cTabType\u003e('articulator');\n\n  // Collapsible right/bottom sidebar panel state\n  const [sidebarCollapsed, setSidebarCollapsed] = useState\u003cboolean\u003e(false);\n\n  // Ask AI Assistant slide-over drawer state\n  const [askAiOpen, setAskAiOpen] = useState\u003cboolean\u003e(false);\n\n  // Mobile layout ratio mode ('split' | '3d' | 'panel') for small screens\n  const [mobileLayoutMode, setMobileLayoutMode] = useState\u003cMobileLayoutMode\u003e('split');\n  const mobileBundleInputRef = useRef\u003cHTMLInputElement\u003e(null);\n  const mobileUpperInputRef = useRef\u003cHTMLInputElement\u003e(null);\n  const mobileLowerInputRef = useRef\u003cHTMLInputElement\u003e(null);\n\n  // Camera presets\n  const [cameraPreset, setCameraPreset] = useState\u003cCameraPreset\u003e('front');\n\n  // Viewport 3D settings (with 5-view photo texture mapping, Occlusogram & Virtual Articulator)\n  const [viewportSettings, setViewportSettings] = useState\u003cViewportSettings\u003e({\n    showUpper: true,\n    showLower: true,\n    occlusionSeparation: 0,\n    shadingMode: 'enamel',\n    photoTextureMapped: true,\n    occlusogramEnabled: false,\n    occlusogramMaxRangeMm: 1.6,\n    caliperToolActive: false,\n    archDistinction: false,\n    wireframeOverlay: false,\n    clippingEnabled: false,\n    clippingAxis: 'z',\n    clippingOffset: 0,\n    autoRotate: false,\n    lightingIntensity: 1.0,\n    articulator: { ...DEFAULT_ARTICULATOR_SETTINGS },\n  });\n\n  // Apply live 3D viewer control commands from Ask AI or WebMCP (mcp.html via BroadcastChannel)\n  const handleApplyViewerControl = useCallback((payload: ViewerControlPayload) =\u003e {\n    if (payload.cameraPreset) {\n      setCameraPreset(payload.cameraPreset);\n    }\n    setViewportSettings((prev) =\u003e ({\n      ...prev,\n      shadingMode: payload.shadingMode ?? prev.shadingMode,\n      occlusogramEnabled:\n        typeof payload.occlusogramEnabled === 'boolean'\n          ? payload.occlusogramEnabled\n          : prev.occlusogramEnabled,\n      occlusionSeparation:\n        typeof payload.occlusionSeparation === 'number'\n          ? payload.occlusionSeparation\n          : prev.occlusionSeparation,\n      articulator: {\n        ...prev.articulator,\n        mode: payload.articulationMode ?? prev.articulator.mode,\n        progress:\n          typeof payload.articulationProgress === 'number'\n            ? payload.articulationProgress\n            : prev.articulator.progress,\n      },\n    }));\n  }, []);\n\n  useEffect(() =\u003e {\n    if (typeof BroadcastChannel === 'undefined') return;\n    let channel: BroadcastChannel | null = null;\n    try {\n      channel = new BroadcastChannel('dentalcad_mcp_channel');\n      channel.onmessage = (ev) =\u003e {\n        if (ev?.data?.type === 'DENTALCAD_MCP_CONTROL' && ev.data.payload) {\n          handleApplyViewerControl(ev.data.payload);\n        }\n      };\n    } catch {\n      // ignore if BroadcastChannel is unsupported in test env\n    }\n    return () =\u003e {\n      try {\n        channel?.close();\n      } catch {\n        // ignore\n      }\n    };\n  }, [handleApplyViewerControl]);\n\n  // Import an entire new case bundle (e.g. .zip or .stl + .xml + .jpg + .pdf) at runtime and persist to IndexedDB\n  const handleImportCaseFiles = async (fileList: FileList) =\u003e {\n    const newBundle = await buildCaseBundleFromFiles(fileList, activeCase);\n    setCases((prev) =\u003e {\n      const filtered = prev.filter((c) =\u003e c.id !== newBundle.id);\n      return [newBundle, ...filtered];\n    });\n    handleSelectCase(newBundle.id);\n    setPendingUrlDataParam(null);\n  };\n\n  // Replace only upper or lower STL on the current active case and persist to IndexedDB\n  const handleCustomStlSelected = async (upper?: File, lower?: File) =\u003e {\n    const updatedBundle = await updateCaseStlInIndexedDB(activeCase, upper, lower);\n    setCases((prev) =\u003e {\n      const filtered = prev.filter((c) =\u003e c.id !== updatedBundle.id);\n      return [updatedBundle, ...filtered];\n    });\n    handleSelectCase(updatedBundle.id);\n  };\n\n  // Delete a custom case from IndexedDB\n  const handleDeleteCustomCase = async (caseId: string) =\u003e {\n    await deleteCaseFromIndexedDB(caseId);\n    const manifest = await fetchCaseManifest();\n    const storedCases = await loadAllCasesFromIndexedDB();\n    const storedIds = new Set(storedCases.map((c) =\u003e c.id));\n    const builtinCases = manifest.cases.filter((c) =\u003e !storedIds.has(c.id));\n    const nextCases = [...storedCases, ...builtinCases];\n    setCases(nextCases.length \u003e 0 ? nextCases : [DEFAULT_CASE_BUNDLE]);\n\n    if (activeCaseId === caseId) {\n      const fallbackId = nextCases[0]?.id || DEFAULT_CASE_BUNDLE.id;\n      handleSelectCase(fallbackId);\n    }\n  };\n\n gs;\n  onSettingsChange: React.Dispatch\u003cReact.SetStateAction\u003cViewportSettings\u003e\u003e;\n  occlusogramStats: OcclusogramStats;\n  archMetrics: OrthoArchMetrics;\n  caliperMeasurements: CaliperMeasurement[];\n  onClearCaliperMeasurements: () =\u003e void;\n  onAddPresetCaliperMeasurement: () =\u003e void;\n  locale?: LocaleMode;\n}\n\nexport const ArticulatorPanel: React.FC\u003cArticulatorPanelProps\u003e = ({\n  settings,\n  onSettingsChange,\n  occlusogramStats,\n  archMetrics,\n  caliperMeasurements,\n  onClearCaliperMeasurements,\n  onAddPresetCaliperMeasurement,\n  locale = 'en',\n}) =\u003e {\n  const { articulator } = settings;\n  const svgRef = useRef\u003cSVGSVGElement\u003e(null);\n  const [draggingHandle, setDraggingHandle] = useState\u003c'p1' | 'p2' | null\u003e(null);\n  const [curveViewMode, setCurveViewMode] = useState\u003c'bezier' | 'sagittal'\u003e('bezier');\n\n  // Compute live kinematics & sampled trajectory for the curve preview\n  const kinematics = useMemo(\n    () =\u003e computeMandibularKinematics(articulator),\n    [articulator]\n  );\n\n  const trajectorySamples = useMemo(\n    () =\u003e sampleArticulationTrajectory(articulator, 36),\n    [articulator]\n  );\n\n  const updateArticulator = (patch: Partial\u003ctypeof articulator\u003e) =\u003e {\n    onSettingsChange((prev) =\u003e {\n      const nextArt = { ...prev.articulator, ...patch };\n      return {\n        ...prev,\n        occlusionSeparation: Math.round(nextArt.progress * 35),\n        articulator: nextArt,\n      };\n    });\n  };\n\n  const handleSelectCurvePreset = (presetId: Exclude\u003cArticulationCurvePresetId, 'custom'\u003e) =\u003e {\n    const preset = ARTICULATION_CURVE_PRESETS[presetId];\n    updateArticulator({\n      curvePresetId: presetId,\n      bezier: { ...preset.bezier },\n      condylarGuidanceAngleDeg:\n        preset.condylarGuidanceAngleDeg ?? articulator.condylarGuidanceAngleDeg,\n      incisalGuidanceAngleDeg:\n        preset.incisalGuidanceAngleDeg ?? articulator.incisalGuidanceAngleDeg,\n    });\n  };\n\n  // Interactive SVG Bezier handle drag\n  const handleSvgPointerMove = (e: React.PointerEvent\u003cSVGSVGElement\u003e) =\u003e {\n    if (!draggingHandle || !svgRef.current) return;\n    const rect = svgRef.current.getBoundingClientRect();\n    const pad = 24;\n    const plotW = Math.max(1, rect.width - pad * 2);\n    const plotH = Math.max(1, rect.height - pad * 2);\n\n    const normX = Math.max(0, Math.min(1, (e.clientX - rect.left - pad) / plotW));\n    const normY = Math.max(0, Math.min(1, 1 - (e.clientY - rect.top - pad) / plotH));\n\n    const nextBezier = {\n      ...articulator.bezier,\n      ...(draggingHandle === 'p1'\n        ? { p1x: Number(normX.toFixed(2)), p1y: Number(normY.toFixed(2)) }\n        : { p2x: Number(normX.toFixed(2)), p2y: Number(normY.toFixed(2)) }),\n    };\n\n    updateArticulator({\n      curvePresetId: 'custom',\n      bezier: nextBezier,\n    });\n  };\n\n  const movementModes: { id: ArticulationMode; label: string; sub: string }[] = [\n    {\n      id: 'hinge',\n      label: tr(locale, '生理樞軸開合', 'TMJ Hinge & Glide'),\n      sub: tr(locale, 'TMJ 旋轉 + 髁導滑動', 'TMJ Rotation + Condylar Slip'),\n    },\n    {\n      id: 'protrusion',\n      label: tr(locale, '前突切導運動', 'Protrusive Guidance'),\n      sub: 'Anterior Incisal Guidance',\n    },\n    {\n      id: 'lateral_left',\n      label: tr(locale, '左側方運動', 'Left Lateral Excursion'),\n      sub: 'Left Working / Bennett',\n    },\n    {\n      id: 'lateral_right',\n      label: tr(locale, '右側方運動', 'Right Lateral Excursion'),\n      sub: 'Right Working / Bennett',\n    },\n    {\n      id: 'chewing',\n      label: tr(locale, '咀嚼循環模擬', 'Chewing Envelope'),\n      sub: 'Tear-Drop Mastication',\n    },\n    {\n      id: 'parallel',\n      label: tr(locale, '垂直平行開離', 'Parallel Z-Split'),\n      sub: 'Parallel CAD Z-Split',\n    },\n  ];\n\n  // SVG coordinate helper for Bezier view (viewBox 0 0 280 180, plot area [28..252
